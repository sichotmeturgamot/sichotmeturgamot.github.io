<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>קריאה — מרכז הריי״ץ</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="fonts.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body { background:#525659; font-family:'Heebo',sans-serif; display:flex; flex-direction:column; overflow:hidden; }
  .bar { flex:0 0 auto; background:#1a2942; color:#fff; display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:2px solid #b8933e; }
  .bar .title { font-family:'Frank Ruhl Libre',serif; font-size:1rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; }
  .bar a, .bar button { color:#fff; text-decoration:none; font:inherit; font-size:.85rem; background:transparent; border:1px solid rgba(255,255,255,.55); border-radius:8px; padding:6px 14px; white-space:nowrap; cursor:pointer; }
  #hint { flex:0 0 auto; color:#cfd3da; text-align:center; font-size:.78rem; padding:8px 16px; line-height:1.4; }
  #viewer { flex:1 1 auto; overflow:auto; direction:ltr; touch-action:pan-x pan-y; -webkit-overflow-scrolling:touch; }
  #pagesInner { margin:0 auto; padding:12px 0 120px; display:flex; flex-direction:column; align-items:center; gap:14px; }
  .page { position:relative; width:100%; background:#fff; box-shadow:0 4px 18px rgba(0,0,0,.4); }
  .page canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  .hlayer, .layer { position:absolute; inset:0; }
  .hlayer { z-index:2; pointer-events:none; }
  .layer { z-index:3; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
  .w { position:absolute; display:block; pointer-events:none; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
  .hl { position:absolute; background:rgba(184,147,62,.42); border-radius:4px; mix-blend-mode:multiply; }
  .hl.a { background:rgba(184,147,62,.8); }

  #sheet { position:fixed; inset-inline:0; bottom:0; z-index:60; display:none; background:#fffdf9; color:#2a2723; border-top:2px solid #b8933e; padding:12px 16px calc(14px + env(safe-area-inset-bottom)); max-height:62vh; overflow:auto; box-shadow:0 -6px 22px rgba(0,0,0,.35); direction:rtl; }
  #sheet.show { display:block; }
  #sheet .in { max-width:760px; margin:0 auto; }
  #smsg { font-size:.95rem; }
  #smsg.err { color:#a33a34; }
  #smeta { font-size:.76rem; color:#8a7d61; margin:3px 0 8px; }
  #tr { white-space:pre-wrap; font-family:'Frank Ruhl Libre',serif; font-size:1.15rem; line-height:1.9; margin:8px 0; padding:10px 12px; border-radius:8px; background:rgba(169,132,60,.1); }
  #trnote { font-size:.74rem; color:#8a7d61; margin-bottom:8px; }
  .btns { display:flex; gap:8px; flex-wrap:wrap; }
  .b { font:inherit; font-size:.92rem; border:1px solid #b8933e; background:#b8933e; color:#fff; border-radius:22px; padding:8px 20px; cursor:pointer; }
  .b.alt { background:transparent; color:#2a2723; border-color:#d9d1c0; }
  #toast { position:fixed; left:50%; transform:translateX(-50%); bottom:22px; z-index:70; background:#1a2942; color:#fff; border:1px solid #b8933e; border-radius:24px; padding:10px 20px; font-size:.92rem; display:none; }
  #toast.show { display:block; }

  #gate { position:fixed; inset:0; z-index:100; background:#1a2942; display:none; align-items:center; justify-content:center; padding:24px; direction:rtl; }
  #gate.show { display:flex; }
  #gate .g { background:#fffdf9; border-radius:14px; padding:24px 22px; width:100%; max-width:340px; text-align:center; }
  #gate h2 { font-family:'Frank Ruhl Libre',serif; color:#17233d; margin-bottom:6px; }
  #gate p { font-size:.88rem; color:#8a7d61; margin-bottom:14px; }
  #gate input { width:100%; font:inherit; padding:10px 12px; border:1.5px solid #d9d1c0; border-radius:10px; margin-bottom:12px; direction:ltr; text-align:center; }
  #gate .e { color:#a33a34; font-size:.85rem; min-height:1.2em; margin-bottom:6px; }
  #loader { position:fixed; inset:0; z-index:50; display:none; flex-direction:column; align-items:center; justify-content:center; gap:14px; color:#fff; background:rgba(82,86,89,.92); text-align:center; padding:20px; pointer-events:none; }
  #loader.show { display:flex; }
  #loader .sp { width:46px; height:46px; border:4px solid rgba(255,255,255,.25); border-top-color:#b8933e; border-radius:50%; animation:rzspin .8s linear infinite; }
  #loader .t { font-size:1rem; }
  #loader .s { font-size:.8rem; color:#cfd3da; min-height:1.2em; }
  #loader .pb { width:180px; height:5px; border-radius:3px; background:rgba(255,255,255,.2); overflow:hidden; display:none; }
  #loader .pb i { display:block; height:100%; width:0; background:#b8933e; transition:width .2s; }
  .page::after { content:''; position:absolute; top:50%; left:50%; width:30px; height:30px; margin:-15px 0 0 -15px; border:3px solid rgba(26,41,66,.15); border-top-color:#b8933e; border-radius:50%; animation:rzspin .8s linear infinite; z-index:1; }
  .page.done::after { display:none; }
  @keyframes rzspin { to { transform:rotate(360deg); } }
  #msg { color:#fff; text-align:center; padding:60px 20px; font-size:1.05rem; margin:auto; display:none; }
</style>
</head>
<body>

<div class="bar">
  <button type="button" id="back">→ חזור</button>
  <span class="title" id="title">טוען…</span>
  <a href="rayatz.html">לרשימה</a>
</div>
<div id="hint">לתרגום: הקישו על המילה הראשונה ואז על האחרונה • להגדלה: צביטה</div>
<div id="viewer"><div id="pagesInner"></div></div>
<div id="msg"></div>
<div id="loader"><div class="sp"></div><div class="t" id="ldt">טוען את הקובץ…</div><div class="pb" id="ldpb"><i></i></div><div class="s" id="lds"></div></div>

<div id="sheet"><div class="in">
  <div id="smsg"></div>
  <div id="smeta"></div>
  <div id="tr" hidden></div>
  <div id="trnote" hidden>תרגום אוטומטי (AI) מתוך ספר השיחות. התרגום אינו מוגה.</div>
  <div class="btns"><button class="b" id="go" hidden>תרגם</button><button class="b" id="copy" hidden>העתק תרגום</button><button class="b alt" id="close">סגור</button></div>
</div></div>
<div id="toast"></div>

<div id="gate"><div class="g">
  <h2 id="rzh2">מרכז הריי״ץ</h2>
  <p>הגישה לאזור זה מוגבלת. הזינו את קוד הגישה.</p>
  <input type="password" id="key" autocomplete="off" placeholder="קוד גישה">
  <div class="e" id="gerr"></div>
  <button class="b" id="gok">כניסה</button>
</div></div>

<script src="rz-config.js?v=1"></script>
<script src="rayatz-data.js?v=20261110c"></script>
<script src="rayatz-auth.js?v=20261109a"></script>
<script type="module">
const API = 'https://sichos-translate.doviber.workers.dev';
const params = new URLSearchParams(location.search);
const BOOK = params.get('book') || 'tarpach-tartzaa';
const startPage = parseInt(params.get('page'), 10) || 1;
const $ = id => document.getElementById(id);
const book = RAYATZ.books.find(b => b.id === BOOK);
if (book && book.nt) { const h = document.getElementById('hint'); if (h) h.textContent = 'התרגום לספר הזה בהכנה • להגדלה: צביטה'; }
if (book && book.ro) { const h = document.getElementById('hint'); if (h) h.textContent = 'קריאה בלבד • להגדלה: צביטה'; }
const viewer = $('viewer'), inner = $('pagesInner');
$('title').textContent = params.get('title') || (book && book.title) || '';
if (window.RZ_CONFIG && window.RZ_CONFIG.live) { var hh = document.getElementById('rzh2'); if (hh) hh.textContent = 'תורת אדמו״ר הריי״ץ'; }
document.title = (params.get('title') || 'קריאה') + ((window.RZ_CONFIG && window.RZ_CONFIG.live) ? '' : ' — מרכז הריי״ץ');
$('back').onclick = () => { if (history.length > 1) history.back(); else location.href = 'rayatz.html'; };
function toast(t) { const e = $('toast'); e.textContent = t; e.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('show'), 2200); }
let ldTimers = [];
function showLoader(t) {
  $('ldt').textContent = t || 'טוען את הקובץ…'; $('lds').textContent = ''; $('ldpb').style.display = 'none'; $('loader').classList.add('show');
  ldTimers.forEach(clearTimeout);
  ldTimers = [setTimeout(() => { $('lds').textContent = 'עדיין טוען, הקובץ גדול…'; }, 6000), setTimeout(() => { $('lds').textContent = 'החיבור איטי, עוד רגע…'; }, 15000)];
}
function loaderProgress(p) {
  if (!p || !p.total || p.loaded > p.total) return;
  const pc = Math.round(p.loaded / p.total * 100); $('ldpb').style.display = 'block'; $('ldpb').firstChild.style.width = pc + '%'; $('lds').textContent = pc + '%';
}
function hideLoader() { ldTimers.forEach(clearTimeout); ldTimers = []; $('loader').classList.remove('show'); }
function fatal(t) { hideLoader(); viewer.style.display = 'none'; $('hint').style.display = 'none'; const m = $('msg'); m.style.display = 'block'; m.textContent = t; }
if (!book) fatal('הספר לא נמצא.');

// ---------- קוד גישה ----------
const KEYN = 'rayatz-key';
const getKey = () => { try { return localStorage.getItem(KEYN) || ''; } catch (e) { return ''; } };
let started = false;
function gate(err) {
  $('gate').classList.add('show'); $('gerr').textContent = err || ''; $('key').focus();
}
$('gok').onclick = () => {
  const v = $('key').value.trim(); if (!v) return;
  try { localStorage.setItem(KEYN, v); } catch (e) {}
  location.reload();
};
$('key').addEventListener('keydown', e => { if (e.key === 'Enter') $('gok').click(); });
async function api(path, opt) {
  const r = await fetch(API + path, Object.assign({}, opt, { headers: Object.assign({ 'x-key': getKey() }, (opt && opt.headers) || {}) }));
  if (r.status === 401) { try { localStorage.removeItem(KEYN); } catch (e) {} gate('הקוד שגוי. נסו שוב.'); throw new Error('unauthorized'); }
  return r.json();
}

// ---------- מצב מדידה (?diag=1): זמני רשת וציור על המסך ----------
const DIAG = params.get('diag') === '1', T0 = performance.now();
let dlog = null;
function dl(t) { if (!DIAG) return; if (!dlog) { dlog = document.createElement('pre'); dlog.style.cssText = 'position:fixed;left:0;right:0;bottom:0;max-height:45vh;overflow:auto;z-index:99;margin:0;background:rgba(0,0,0,.82);color:#9f9;font:11px/1.35 monospace;padding:6px;direction:ltr;text-align:left;white-space:pre-wrap'; document.body.appendChild(dlog); }
  dlog.textContent = '\u200E' + ((performance.now() - T0) / 1000).toFixed(1) + 's ' + t + '\n' + dlog.textContent; }
if (DIAG) {
  const of = window.fetch.bind(window);
  window.fetch = async (u, o) => {
    const url = String(u && u.url || u), rg = o && o.headers && (o.headers.Range || o.headers.range || (o.headers.get && o.headers.get('Range')));
    const t = performance.now(), r = await of(u, o);
    if (/\/yid\//.test(url)) { const tag = url.includes('/yid/pdf') ? 'pdf ' + (rg ? rg.replace('bytes=', '') : 'FULL') : url.includes('/yid/boxes') ? 'boxes p' + (/page=(\d+)/.exec(url) || [])[1] : url.split('?')[0].split('/').pop();
      dl(tag + ' → ' + r.status + ' head ' + Math.round(performance.now() - t) + 'ms');
      if (rg) r.clone().arrayBuffer().then(b => dl(tag + ' body ' + (b.byteLength >> 10) + 'KB total ' + Math.round(performance.now() - t) + 'ms')).catch(() => {}); }
    return r;
  };
}

// ---------- PDF.js ----------
let pdfjsLib;
async function loadPdfjs() {
  const CDN = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.7.76/';
  try { pdfjsLib = await import('/pdf.min.mjs'); pdfjsLib.GlobalWorkerOptions.workerSrc = '/pdf.worker.min.mjs'; }
  catch (e) { pdfjsLib = await import(CDN + 'build/pdf.min.mjs'); pdfjsLib.GlobalWorkerOptions.workerSrc = CDN + 'build/pdf.worker.min.mjs'; }
}
const IS_IOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const MAX_SIDE = IS_IOS ? 4000 : 8192, MAX_AREA = (IS_IOS ? 16 : 60) * 1024 * 1024;
const dpr = window.devicePixelRatio || 1, clamp = (v, a, b) => Math.min(Math.max(v, a), b);
let pdf = null, baseW = 600, Z = 1, recs = [];

async function renderCanvas(rec) {
  const t0 = performance.now();
  if (!rec.pdfPage) rec.pdfPage = await pdf.getPage(rec.n);
  const t1 = performance.now();
  const base = rec.pdfPage.getViewport({ scale: 1 });
  rec.el.style.aspectRatio = base.width + '/' + base.height;
  let rs = (baseW * Z * dpr) / base.width, w = base.width * rs, h = base.height * rs;
  rs *= Math.min(MAX_SIDE / w, MAX_SIDE / h, Math.sqrt(MAX_AREA / (w * h)), 1);
  const vp = rec.pdfPage.getViewport({ scale: rs });
  if (rec.task) { try { rec.task.cancel(); } catch (e) {} }
  rec.canvas.width = Math.floor(vp.width); rec.canvas.height = Math.floor(vp.height);
  const task = rec.pdfPage.render({ canvasContext: rec.canvas.getContext('2d'), viewport: vp });
  rec.task = task; rec.rendered = true;
  try { await task.promise; if (rec.task === task) rec.el.classList.add('done'); dl('page ' + rec.n + ': getPage ' + Math.round(t1 - t0) + 'ms, draw ' + Math.round(performance.now() - t1) + 'ms (' + rec.canvas.width + '×' + rec.canvas.height + ')'); } catch (e) { dl('page ' + rec.n + ' cancelled'); }
  if (rec.task === task) rec.task = null;
}
function dropCanvas(rec) { if (rec.task) { try { rec.task.cancel(); } catch (e) {} rec.task = null; } rec.canvas.width = 1; rec.canvas.height = 1; rec.rendered = false; rec.el.classList.remove('done'); }

// ---------- תיבות מילים (בלי טקסט) והדגשה ----------
const sel = { lo: null, hi: null };      // מזהי מילים
function med(a) { const b = a.slice().sort((x, y) => x - y); return b[b.length >> 1]; }
function paintPage(rec) {
  rec.hl.innerHTML = '';
  if (!rec.boxes || sel.lo === null) return;
  const anchorOnly = sel.hi === null, hi = anchorOnly ? sel.lo : sel.hi;
  const items = rec.boxes.filter(b => b.id >= 0 && b.id >= sel.lo && b.id <= hi); if (!items.length) return;
  const mh = med(items.map(o => o.h)), rows = [];
  items.slice().sort((a, b) => (a.y + a.h / 2) - (b.y + b.h / 2)).forEach(o => { const yc = o.y + o.h / 2, r = rows[rows.length - 1]; if (r && Math.abs(yc - r.yc) < mh * 0.6) { r.items.push(o); r.yc = (r.yc * (r.items.length - 1) + yc) / r.items.length; } else rows.push({ yc, items: [o] }); });
  const add = seg => {
    const x0 = Math.min(...seg.map(o => o.x)) - 2, x1 = Math.max(...seg.map(o => o.x + o.w)) + 2, mH = med(seg.map(o => o.h)), h = mH * 1.25, y = med(seg.map(o => o.y)) - mH * 0.12, d = document.createElement('div');
    d.className = 'hl' + (anchorOnly ? ' a' : '');
    d.style.cssText = 'left:' + x0 / rec.W * 100 + '%;top:' + y / rec.H * 100 + '%;width:' + (x1 - x0) / rec.W * 100 + '%;height:' + h / rec.H * 100 + '%';
    rec.hl.appendChild(d);
  };
  rows.forEach(r => {
    const it = r.items.slice().sort((a, b) => a.x - b.x); let seg = [it[0]];
    for (let i = 1; i < it.length; i++) { if (it[i].x - (seg[seg.length - 1].x + seg[seg.length - 1].w) > mh * 1.5) { add(seg); seg = [it[i]]; } else seg.push(it[i]); }
    add(seg);
  });
}
const paintAll = () => recs.forEach(r => paintPage(r));

async function loadBoxes(rec) {
  if ((book && book.ro) || rec.boxes || rec.loading) return; rec.loading = true;
  try {
    const j = await api('/yid/boxes?book=' + BOOK + '&page=' + rec.n + '&v=2');
    if (!j.ok) { if (j.error === 'no-page') rec.boxes = []; rec.loading = false; return; }
    rec.W = j.W; rec.H = j.H; rec.boxes = j.boxes.map(b => ({ x: b[0], y: b[1], w: b[2], h: b[3], id: b[4] }));
    const frag = document.createDocumentFragment();
    rec.boxes.forEach(o => {
      const s = document.createElement('span'); s.className = 'w'; o.el = s; s.dataset.id = o.id;
      s.style.cssText = 'left:' + o.x / rec.W * 100 + '%;top:' + o.y / rec.H * 100 + '%;width:' + o.w / rec.W * 100 + '%;height:' + o.h / rec.H * 100 + '%';
      frag.appendChild(s);
    });
    rec.layer.appendChild(frag); paintPage(rec);
  } catch (e) { rec.loading = false; }
}

// ---------- בחירה בהקשה: ראשונה ואחרונה ----------
const MINW = 5;
const sheet = $('sheet'), smsg = $('smsg'), smeta = $('smeta'), trEl = $('tr'), goBtn = $('go'), copyBtn = $('copy'), trnote = $('trnote');
function say(text, err, meta) { sheet.classList.add('show'); smsg.textContent = text; smsg.className = err ? 'err' : ''; smeta.textContent = meta || ''; goBtn.hidden = true; copyBtn.hidden = true; trEl.hidden = true; trnote.hidden = true; }
function clearSel() { sel.lo = sel.hi = null; cur = null; anchor = null; paintAll(); sheet.classList.remove('show'); }
let cur = null, anchor = null, anchorPage = 1, tapPage = 1;
function onTap(id) {
  if (anchor === null || cur) { anchor = id; cur = null; sel.lo = id; sel.hi = null; anchorPage = tapPage; paintAll(); say('סימנתם את המילה הראשונה. הקישו על המילה האחרונה.'); return; }
  const lo = Math.min(anchor, id), hi = Math.max(anchor, id), n = hi - lo + 1;
  sel.lo = lo; sel.hi = hi; paintAll();
  if (n < MINW) { anchor = null; sel.lo = sel.hi = null; paintAll(); say('הסימון קצר מדי (פחות מ-' + MINW + ' מילים). למילים בודדות אפשר להשתמש במילון. הקישו שוב על מילה ראשונה.', true); return; }
  cur = { from: lo, to: hi, page: Math.min(anchorPage, tapPage) };
  say('נבחרו כ-' + n + ' מילים. לחצו "תרגם".'); goBtn.hidden = false;
}
let pd = null, multiAt = 0;
function hitWord(cx, cy) {
  const pe = document.elementFromPoint(cx, cy), pgEl = pe && pe.closest ? pe.closest('.page') : null;
  const rec = pgEl && recs[+pgEl.dataset.n - 1]; if (!rec || !rec.boxes) return null;
  const r = pgEl.getBoundingClientRect(), px = (cx - r.left) / r.width * rec.W, py = (cy - r.top) / r.height * rec.H;
  let best = null, bd = 1e9;
  for (const b of rec.boxes) {
    const dx = Math.max(b.x - px, 0, px - (b.x + b.w)), dy = Math.max(b.y - py, 0, py - (b.y + b.h)), d = Math.hypot(dx, dy);
    if (d < bd && d <= b.h * 0.55) { bd = d; best = b; }
  }
  if (best) tapPage = rec.n;
  return best;
}
inner.addEventListener('pointerdown', e => { pd = (e.isPrimary && Date.now() - multiAt > 350) ? { x: e.clientX, y: e.clientY } : null; }, { passive: true });
inner.addEventListener('pointercancel', () => { pd = null; }, { passive: true });
inner.addEventListener('pointerup', e => {
  if ((book && book.ro) || !pd || pinch || Date.now() - multiAt < 350) { pd = null; return; }   // בחירה ותרגום — רק בספרי אידיש עם טקסט
  const moved = Math.hypot(e.clientX - pd.x, e.clientY - pd.y); pd = null;
  if (moved > 10) return;
  const b = hitWord(e.clientX, e.clientY); if (!b) return;
  if (b.id >= 0) onTap(b.id); else toast('הערות שוליים אינן ניתנות לתרגום');
}, { passive: true });
$('close').onclick = clearSel;

const ERR = { short: 'הסימון קצר מדי.', long: 'הסימון ארוך מדי. סמנו פחות.', nomatch: 'לא הצלחתי לזהות היכן הסימון. נסו לסמן שוב, והקפידו שהמילה הראשונה והאחרונה יהיו מגוף השיחה.', order: 'סדר הסימון לא תקין, נסו שוב.', rate: 'עברתם את מכסת התרגומים לשעה. נסו מאוחר יותר.', upstream: 'שגיאה זמנית בשירות התרגום. נסו שוב.', 'book-missing': 'נתוני הספר לא נמצאו.', server: 'שגיאה בשרת.' };
goBtn.onclick = async () => {
  if (!cur) return;
  if (book && book.ready && !book.ready.some(r => cur.from >= r[0] && cur.to <= r[1])) { goBtn.hidden = true; say('התרגום לשנה זו עדיין לא זמין: הטקסט בהכנה.', true); return; }
  if (book && book.nt) { goBtn.hidden = true; say('התרגום לספר הזה עדיין לא זמין: הטקסט בהכנה. הסימון עובד לצורך בדיקה בלבד.', true); return; } goBtn.hidden = true; trEl.hidden = false; trEl.textContent = 'מתרגם…';
  try {
    const j = await api('/yid/translate', { method: 'POST', headers: Object.assign({ 'content-type': 'application/json' }, window.RZ ? RZ.authHeader() : {}), body: JSON.stringify({ book: BOOK, from: cur.from, to: cur.to, meta: { p: cur.page, t: $('title').textContent.slice(0, 140) } }) });
    if (j.ok) { trEl.textContent = String(j.translation).replace(/<br\s*\/?>/gi, '\n').replace(/<\/?[a-z][^>]*>/gi, '').replace(/[ \t]*\n(?!\n)[ \t]*/g, ' ').trim(); trnote.hidden = false; copyBtn.hidden = false; smsg.textContent = 'התרגום מוכן.'; smeta.textContent = 'תורגמו ' + j.words + ' מילים' + (j.expanded ? (j.gran === 'sentence' ? ' (הורחב לגבולות משפט)' : ' (הורחב לגבולות פסקה)') : '') + (j.cached ? ' (שמור)' : '') + (j.saved ? ' · נשמר באזור האישי' : ''); }
    else { trEl.hidden = true; say(ERR[j.error] || ('שגיאה: ' + j.error), true, j.detail ? 'פרטים: ' + j.detail : ''); }
  } catch (e) { if (e.message !== 'unauthorized') { trEl.hidden = true; say('אין חיבור לשרת התרגום.', true); } }
};
copyBtn.onclick = async () => {
  const t = trEl.textContent + '\n\n(תרגום אוטומטי מתוך ספר השיחות — לא מוגה)';
  try { await navigator.clipboard.writeText(t); toast('התרגום הועתק ✓'); } catch (e) { toast('לא ניתן להעתיק במכשיר זה'); }
};

// ---------- בניית הקורא ----------
async function begin() {
  if (started) return; if (!getKey() && !(window.RZ_CONFIG && window.RZ_CONFIG.live)) { gate(); return; }
  started = true; showLoader();
  try {
    await loadPdfjs();
    const hdr = { 'x-key': getKey() };
    try { const lt = pdfjsLib.getDocument({ url: API + '/yid/pdf?book=' + BOOK, httpHeaders: hdr, rangeChunkSize: 1 << 18, disableAutoFetch: true, disableStream: true }); pdf = await lt.promise; }
    catch (e1) {
      if (e1 && e1.status === 401) { hideLoader(); try { localStorage.removeItem(KEYN); } catch (e) {} started = false; gate('הקוד שגוי. נסו שוב.'); return; }
      $('ldt').textContent = 'מוריד את הקובץ…';
      const pr = await fetch(API + '/yid/pdf?book=' + BOOK, { headers: hdr });   // גיבוי: הורדה מלאה
      if (pr.status === 401) { hideLoader(); try { localStorage.removeItem(KEYN); } catch (e) {} started = false; gate('הקוד שגוי. נסו שוב.'); return; }
      if (!pr.ok) throw new Error('pdf ' + pr.status);
      const total = +pr.headers.get('content-length') || 0, chunks = []; let got = 0;
      if (pr.body && pr.body.getReader) { const rd = pr.body.getReader(); for (;;) { const { done, value } = await rd.read(); if (done) break; chunks.push(value); got += value.length; loaderProgress({ loaded: got, total }); } }
      else chunks.push(new Uint8Array(await pr.arrayBuffer()));
      const buf = new Uint8Array(chunks.reduce((a, c) => a + c.length, 0)); let off = 0; chunks.forEach(c => { buf.set(c, off); off += c.length; });
      $('ldt').textContent = 'פותח את הקובץ…';
      pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    }
  } catch (e) { fatal('לא ניתן לטעון את הקובץ כרגע. נסו לרענן.' + ' [' + String((e && e.message) || e).slice(0, 80) + ']'); return; }
  const ratios = []; { const pg1 = await pdf.getPage(1), v1 = pg1.getViewport({ scale: 1 }); const r1 = v1.width + '/' + v1.height; for (let k = 1; k <= pdf.numPages; k++) ratios[k] = r1; }
  baseW = Math.min(viewer.clientWidth || 600, 900);
  inner.style.width = baseW + 'px';
  for (let n = 1; n <= pdf.numPages; n++) {
    const el = document.createElement('div'); el.className = 'page'; el.style.aspectRatio = ratios[n]; el.dataset.n = n;
    el.innerHTML = '<canvas></canvas><div class="hlayer"></div><div class="layer"></div>';
    inner.appendChild(el);
    recs.push({ n, el, canvas: el.querySelector('canvas'), hl: el.querySelector('.hlayer'), layer: el.querySelector('.layer'), rendered: false });
  }
  // קודם העמוד המבוקש בלבד, ורק אחריו העמודים שמסביב (כדי שלא יתחרו על הרשת)
  const trec = recs[clamp(startPage, 1, recs.length) - 1], target = trec.el;
  $('ldt').textContent = 'מציג את העמוד…'; setTimeout(hideLoader, 15000);
  viewer.scrollTop = target.offsetTop - inner.offsetTop - 6;
  loadBoxes(trec);
  await renderCanvas(trec); hideLoader();
  viewer.scrollTop = target.offsetTop - inner.offsetTop - 6;
  // תור ציור: עד 2 עמודים בבת אחת, קודם הקרוב ביותר למרכז המסך (כדי שלא יתחרו על רשת איטית)
  const want = new Set(); let active = 0;
  const dist = r => { const b = r.el.getBoundingClientRect(), v = viewer.getBoundingClientRect(); return Math.abs((b.top + b.bottom) / 2 - (v.top + v.bottom) / 2); };
  const pump = () => {
    while (active < 2 && want.size) {
      let best = null; want.forEach(r => { if (!best || dist(r) < dist(best)) best = r; });
      want.delete(best); active++;
      renderCanvas(best).finally(() => { active--; pump(); });
    }
  };
  viewer.addEventListener('scroll', () => { if (want.size) pump(); }, { passive: true });
  const io = new IntersectionObserver(es => { es.forEach(en => {
    const rec = recs[+en.target.dataset.n - 1];
    if (en.isIntersecting) { if (!rec.rendered) want.add(rec); loadBoxes(rec); } else { want.delete(rec); if (rec.rendered) dropCanvas(rec); }
  }); pump(); }, { root: viewer, rootMargin: '900px 0px' });
  recs.forEach(r => io.observe(r.el));
  window.__io = io;
}

// ---------- זום (צביטה) ----------
function anchorAt(fx, fy) {
  let best = null, bd = 1e9;
  for (const r of recs) {
    const b = r.el.getBoundingClientRect(); if (b.bottom < -50 || b.top > innerHeight + 50) continue;
    const d = fy < b.top ? b.top - fy : fy > b.bottom ? fy - b.bottom : 0; if (d < bd) { bd = d; best = { el: r.el, fx: (fx - b.left) / b.width, fy: (fy - b.top) / b.height }; }
  }
  return best;
}
function keepAnchor(a, fx, fy) {
  if (!a) return; const b = a.el.getBoundingClientRect();
  viewer.scrollLeft += (b.left + a.fx * b.width) - fx; viewer.scrollTop += (b.top + a.fy * b.height) - fy;
}
function setZoom(z, fx, fy) {
  z = clamp(z, 1, 4); const a = anchorAt(fx, fy);
  Z = z; inner.style.width = (baseW * Z) + 'px'; keepAnchor(a, fx, fy);
}
let reT = null; const reRender = () => { clearTimeout(reT); reT = setTimeout(() => recs.forEach(r => { if (r.rendered) renderCanvas(r); }), 200); };
const distOf = e => Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
const midOf = e => ({ x: (e.touches[0].clientX + e.touches[1].clientX) / 2, y: (e.touches[0].clientY + e.touches[1].clientY) / 2 });
let pinch = null;
function pinchApply(m, d) {
  const k = clamp(pinch.z0 * d / pinch.d0, 1, 4) / pinch.z0; pinch.k = k; pinch.m = m;
  inner.style.transform = 'translate(' + (m.x - pinch.m0.x) + 'px,' + (m.y - pinch.m0.y) + 'px) scale(' + k + ')';
}
viewer.addEventListener('touchstart', e => {
  if (e.touches.length === 2) {
    multiAt = Date.now(); pd = null; const m = midOf(e), ir = inner.getBoundingClientRect();
    pinch = { d0: distOf(e), z0: Z, k: 1, m0: m, m: m };
    inner.style.transformOrigin = (m.x - ir.left) + 'px ' + (m.y - ir.top) + 'px'; inner.style.willChange = 'transform';
    e.preventDefault();
  }
}, { passive: false });
viewer.addEventListener('touchmove', e => { if (pinch && e.touches.length === 2) { e.preventDefault(); pinchApply(midOf(e), distOf(e)); } }, { passive: false });
function pinchEnd() {
  if (!pinch) return; const p = pinch; pinch = null; multiAt = Date.now();
  const a = anchorAt(p.m.x, p.m.y);
  inner.style.transform = ''; inner.style.transformOrigin = ''; inner.style.willChange = '';
  Z = p.z0 * p.k; inner.style.width = (baseW * Z) + 'px'; keepAnchor(a, p.m.x, p.m.y); reRender();
}
viewer.addEventListener('touchend', e => { if (e.touches.length < 2) pinchEnd(); }, { passive: true });
viewer.addEventListener('touchcancel', pinchEnd, { passive: true });
viewer.addEventListener('wheel', e => { if (e.ctrlKey) { e.preventDefault(); setZoom(Z * (e.deltaY < 0 ? 1.1 : 0.9), e.clientX, e.clientY); reRender(); } }, { passive: false });

if (book) begin();
</script>
