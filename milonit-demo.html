<style>
/* Layout: one centred column; the device is the hero, the controls sit under it like a caption. */
:root {
  /* the site's own palette (style.css): cream page, paper cards, gold accents, navy buttons */
  --bg: #f6f1e6;
  --surface: #fffdf9;
  --ink: #2a2723;
  --muted: #7a6e55;
  --navy: #17233d;
  --gold: #856527;
  --line: #e5dcc6;
  --chip: #efe7d6;
  --focus: #a9843c;
  --display: "Frank Ruhl Libre", "David Libre", "Times New Roman", serif;
  --body: "Heebo", "Arial Hebrew", Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.55; }
.wrap {
  max-width: 900px; margin: 0 auto; direction: rtl;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 40px;
  display: flex; flex-direction: column; gap: 18px;
}
header { display: flex; flex-direction: column; gap: 4px; text-align: center; }
.eyebrow { font-size: 13px; letter-spacing: .04em; color: var(--gold); font-weight: 500; }
h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: clamp(28px, 5vw, 40px); line-height: 1.15; color: var(--ink); text-wrap: balance; }
.lead { margin: 0; color: var(--muted); font-size: 16px; text-wrap: balance; }

.device { position: relative; width: 100%; aspect-ratio: 1560 / 1040; max-width: 100%; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
.device img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
.device canvas { position: absolute; left: 26.897%; top: 10.154%; width: 25.609%; height: 21.606%; mix-blend-mode: screen; pointer-events: none; image-rendering: auto; }
.key { position: absolute; padding: 0; margin: 0; border: 0; background: transparent; cursor: pointer; border-radius: 10px; -webkit-tap-highlight-color: transparent; }
.key:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
.key .flash { position: absolute; left: 50%; bottom: 0; width: 120%; aspect-ratio: 1; transform: translate(-50%, 28%); border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.75) 0 38%, rgba(255,255,255,0) 66%); opacity: 0; transition: opacity .28s ease-out; pointer-events: none; }
.key .flash.on { opacity: 1; transition: none; }

.hint { margin: 0; text-align: center; color: var(--ink); font-size: 15px; min-height: 1.6em; }
.hint kbd { font-family: var(--body); font-size: 13px; padding: 1px 7px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 6px; background: var(--surface); color: var(--ink); white-space: nowrap; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.modes { display: flex; gap: 6px; background: var(--chip); padding: 4px; border-radius: 10px; }
.modes button { font: 500 15px var(--body); color: var(--ink); background: transparent; border: 0; border-radius: 7px; padding: 6px 14px; cursor: pointer; }
.modes button[aria-pressed="true"] { background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.12); color: var(--ink); }
.modes button:focus-visible, .chips button:focus-visible, form input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
form { display: flex; gap: 8px; flex: 1 1 260px; min-width: 0; }
form input { flex: 1 1 auto; min-width: 0; font: 400 17px var(--body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; direction: rtl; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chips span { color: var(--muted); font-size: 14px; }
.chips button { font: 400 16px var(--display); color: var(--ink); background: var(--chip); border: 0; border-radius: 999px; padding: 3px 14px; cursor: pointer; }
.chips button small { font-family: var(--body); font-size: 12px; color: var(--muted); }
.note { margin: 0; font-size: 13.5px; color: var(--muted); text-align: center; text-wrap: balance; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (max-width: 520px) { .panel { padding: 12px; } .hint { font-size: 14px; } }
@media (prefers-reduced-motion: reduce) { .key .flash { transition: none; } }
</style>
</head>

  input.addEventListener("input", () => {
    if (st.mode !== "dict") enterDict();
    st.query = input.value.replace(/[^א-ת ]/g, "");
    update();
  });
  document.getElementById("form").addEventListener("submit", ev => {
    ev.preventDefault();
    if (st.mode !== "dict") enterDict();
    const v = input.value.replace(/[^א-ת ]/g, "").trim();
    if (v) { st.query = v; flash("enter"); press("enter"); }
    input.value = "";
  });
  let typing = 0;
  async function typeWord(w) {
    const my = ++typing;
    if (st.mode === "boot") return;
    if (st.mode !== "dict") { enterDict(); update(); await wait(250); }
    st.query = ""; update();
    for (const ch of w) {
      if (my !== typing) return;
      await wait(110); flash(HEB2KEY[ch] || ch); st.query += ch; update();
    }
    await wait(260); if (my !== typing) return;
    flash("enter"); press("enter");
  }
  document.getElementById("chips").addEventListener("click", ev => {
    const b = ev.target.closest("button[data-w]"); if (b) { b.blur(); typeWord(b.dataset.w); }
  });
  document.getElementById("m-dict").onclick = ev => { ev.currentTarget.blur(); if (st.mode === "boot") return; typing++; enterDict(); update(); };
  document.getElementById("m-triv").onclick = ev => { ev.currentTarget.blur(); if (st.mode === "boot") return; typing++; enterTrivia(); update(); };
  document.getElementById("m-menu").onclick = ev => { ev.currentTarget.blur(); if (st.mode === "boot") return; typing++; st.mode = "menu"; update(); };

  // ---- hint line under the device, and a text copy of the screen for screen readers ----
  const hint = document.getElementById("hint"), sr = document.getElementById("sr");
  const kbd = s => `<kbd>${s}</kbd>`;
  function update() {
    draw();
    let h = "", s = "";
    if (st.mode === "boot") h = "המכשיר נדלק…";
    else if (st.mode === "menu") { h = `בחרו ב־${kbd("←")} ${kbd("→")} ואשרו ב־${kbd("אישור")}`; s = "תפריט: " + APPS[st.app]; }
    else if (st.mode === "dict") {
      if (st.heb === "לא נמצא") h = "המילה לא נמצאת ברשימה הקטנה של ההדגמה. נסו את אחת המילים למטה.";
      else if (st.res.length > 1) h = `יש ${st.res.length} פירושים. ${kbd("→")} לפירוש הבא`;
      else h = `הקלידו מילה ביידיש ולחצו ${kbd("אישור")}. ${kbd("esc")} חוזר לתפריט`;
      s = st.heb ? (st.approx ? "אולי התכוונת: " : "") + st.yid + ": " + st.heb : "";
    } else if (st.mode === "trivia") {
      if (st.showing) h = st.chosen === st.q.correct ? "נכון! עוד 10 נקודות" : "לא נכון. התשובה הנכונה מהבהבת בירוק";
      else h = `מה פירוש המילה? בחרו ${kbd("1")}–${kbd("4")}`;
      s = st.q ? "טריוויה: " + st.q.word + ". " + st.q.opts.map((o, i) => (i + 1) + ". " + o).join(", ") : "";
    } else if (st.mode === "other") h = `ההדגמה כוללת את המילון והטריוויה. ${kbd("esc")} חוזר לתפריט`;
    hint.innerHTML = h; sr.textContent = s;
    canvas.setAttribute("aria-label", "מסך המכשיר" + (s ? ": " + s : ""));
    const pressed = { "m-dict": st.mode === "dict", "m-triv": st.mode === "trivia", "m-menu": st.mode === "menu" };
    for (const id in pressed) document.getElementById(id).setAttribute("aria-pressed", pressed[id] ? "true" : "false");
  }

  // ---- start: wait for the screen font, then the boot animation ----
  function boot() { st.mode = "boot"; st.bootT0 = performance.now(); POOL = null; update(); }
  if ("ResizeObserver" in window) new ResizeObserver(fitCanvas).observe(canvas); else window.addEventListener("resize", fitCanvas);
  fitCanvas();
  const fontReady = document.fonts && document.fonts.load
    ? Promise.all([document.fonts.load(FONT, "אידיש"), document.fonts.load(FONT, "0123456789.,:+esc"), document.fonts.load('700 26px Heebo', "?")]).catch(() => {})
    : Promise.resolve();
  if (document.fonts && document.fonts.addEventListener) document.fonts.addEventListener("loadingdone", () => { if (st.mode !== "boot") draw(); });
  Promise.race([fontReady, wait(2500)]).then(() => {
    const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce) { st.mode = "menu"; update(); } else boot();
  });
})();
</script>
</body>
</html>
