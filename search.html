האיר שרש נשמה אצל הלמדנים, ניגון מעיר גילוי הנשמה", "page": 22, "sichah": "יום א' דחג הפסח תש\"ו", "excerpt": "מאחר ורצה לקרב גם את היהודים הפשוטים, אדמו\"ר הזקן המציא את ענין הניגון, שע\"י ניגונים התגלה אצלם שורש נשמתם. אדמו\"ר הזקן היה הרי חכמה דאצילות, והוא חיבר את עשרת הניגונים שמסודרים על פי חכמה דאצילות.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FYom_Alef_Pesach_5706.pdf&title=%D7%99%D7%95%D7%9D+%D7%90%27+%D7%93%D7%97%D7%92+%D7%94%D7%A4%D7%A1%D7%97+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "ניגון", "desc": "סיפור הנ. של ר' אשר מניקאָלאַייעוו, נ. חב\"ד א' מתי פנים", "page": 26, "sichah": "סדר השני של חג הפסח תש\"ו", "excerpt": "ט. בתוך הסעודה נגנו את הניגון הידוע של ר' אשר מניקאָלאַייעוו וסיפר כ\"ק אדמו\"ר שליט\"א: המחבר של ניגון זה היה ר' משה חאַריטאָנאָוו. את הניגון (ב' בבות הראשונות) הביא ר' אשר הנ\"ל לאחר ששמעו בחתונת משפחת האָרענשטיין (חתונת ר' שלמה האָרענשטיין). וכשבא אח\"כ ר' אשר לליובאוויטש למסור פ\"ש מהחתונה, אמר לו כ\"ק אדמו\"ר נ\"ע שבטח יבוא לנאות הדשא בחו\"ל וכך הוה, ובא ר' אשר הנ\"ל לפורים תרס\"א לחו\"ל, וניגן את הניגון הנ\"ל כפי שתיקנו סידרו ושכללו ר' משה חאַריטאָנאָוו, ואמר כ\"ק אדמו\"ר נ\"ע: בניגון זה משתקף עד כמה חסיד מרגיש אבוד מצד מעשיו, וכל תקותו על הרבי.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FSeder_Sheni_Pesach_5706.pdf&title=%D7%A1%D7%93%D7%A8+%D7%94%D7%A9%D7%A0%D7%99+%D7%A9%D7%9C+%D7%97%D7%92+%D7%94%D7%A4%D7%A1%D7%97+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "ניגון", "desc": "אדה\"ז רצה שינגנו הניגונים שלו עד סוף כל הדורות ויעוררו לתשובה", "page": 29, "sichah": "ליל שביעי של פסח תש\"ו", "excerpt": "ה\"למען תספר באזני בנך ובן בנך\" - המשיך אדה\"ז ואמר לרב\"ש - הכוונה לא רק לנכד אלא עד סוף כל הדורות, אלא שאפשר לומר בע\"פ רק לנכד או לנין. הייתי מאד רוצה שהניגונים ששמעת ממני, שהם כפי שמלכות דאצילות שרה, ינגנו אותם עד סוף כל הדורות.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Shvii_shel_Pesach_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%A9%D7%91%D7%99%D7%A2%D7%99+%D7%A9%D7%9C+%D7%A4%D7%A1%D7%97+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "ניגון", "desc": "אדה\"ז הי' טוב עין ונתן הנ. לרחוץ הכלי", "page": 30, "sichah": "ליל שביעי של פסח תש\"ו", "excerpt": "הצ\"צ אמר: סיפור צריך לפעול בענינים הנ\"ל, ואם אינו פועל הרי זה מסיבת א' מג' טעמים: א) כי השומע אינו מבין, ב) הוא אינו רוצה, והג) כי המקבל הוא כלי מאוס. הסבא - התכוון לאדה\"ז - הרי היה טוב עין, ונתן כח לרחוץ את הכלי על ידי ניגון.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Shvii_shel_Pesach_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%A9%D7%91%D7%99%D7%A2%D7%99+%D7%A9%D7%9C+%D7%A4%D7%A1%D7%97+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "ניגון", "desc": "אדה\"ז התגלה ע\"י נגינה, ג' אופנים בניגון", "page": 33, "sichah": "ליל א' דחג השבועות תש\"ו", "excerpt": "וסיפר כ\"ק אאמו\"ר נ\"ע: כשגילו את אדמו\"ר הזקן במעזריטש, מי הוא, הוא התחיל לפעול, והוא התגלה על ידי נגינה.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Alef_Shavuos_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%90%27+%D7%93%D7%97%D7%92+%D7%94%D7%A9%D7%91%D7%95%D7%A2%D7%95%D7%AA+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "ניגון", "desc": "אדה\"ז הי' מנגן מילדותו", "page": 35, "sichah": "יום א' דחג השבועות תש\"ו", "excerpt": "כשהוא היה בשדה לעיתים תכופות הוא היה מנגן. יש שהאדם מנגן ויש שהנגינה בוקעת מהאדם (\"אויסזינגען זיך\"). אדמו\"ר הזקן היה אומר שפנימיות הנפש יכול להתבטא בניגון (\"אויסזינגען אין אַ ניגון\").", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2F24_Yom_Alef_Shavuos_5706.pdf&title=%D7%99%D7%95%D7%9D+%D7%90%27+%D7%93%D7%97%D7%92+%D7%94%D7%A9%D7%91%D7%95%D7%A2%D7%95%D7%AA+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "ניגון", "desc": "יש שמנגן ויש שבוקע הנ., נ.יכול למשוך מהבוץ", "page": 36, "sichah": "יום א' דחג השבועות תש\"ו", "excerpt": "בשנת תרנ\"ד, בהתוועדות, אבי אמר, שזה מאה שנה מאז שאדמו\"ר הזקן אמר את הפתגם: ניגון יכול למשוך את האדם מהבוץ הכי עמוק.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2F24_Yom_Alef_Shavuos_5706.pdf&title=%D7%99%D7%95%D7%9D+%D7%90%27+%D7%93%D7%97%D7%92+%D7%94%D7%A9%D7%91%D7%95%D7%A2%D7%95%D7%AA+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "ניגון", "desc": "תופס מקום חשוב בחסי', אדה\"ז היה מנגן נפלא וידע ענין הנגינה, נ. מראה היכן נמצאים והיכן צ\"ל, נ. מבטא הנפש, נ. שמחה ונ. מרירות במנים מיוחדים, נ. ענינו התגלות העצם, לא שרים במהירות, הכנה לעבודה", "page": 40, "sichah": "י\"ב תמוז תש\"ו", "excerpt": "ענינו של עבודת החסידות הוא, להכיר את עצמך ולפעול עם עצמך. לא רק לקנות מידות־טובות, שבמידות־טובות אין הכוונה רק למידות הטובות על פי דיני התורה, אלא למידות הטובות על פי חסידות. אכן זה באמת טוב מאוד, אבל זה עדיין לא חסיד - עבודתו של חסיד הוא להכיר את עצמו, וזה בא על ידי ניגון. ניגון מראה לחסיד היכן הוא נמצא, כיצד צריך הוא להיות והיכן מסוגל הוא להיות. וזהו על ידי התגלות העצם - עצם הנשמה. ניגון הוא פתח ושער שעל ידו אפשר להגיע להיכן שצריכים להיות. בנגינה לא מתכוונים רק לנגן אלא לבטא את הנפש בניגון (אויסזינגען זיך), שהתגלות העצם מתנגנת (מתבטאת) בניגון.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2F12_Tammuz_5706.pdf&title=%D7%99%22%D7%91+%D7%AA%D7%9E%D7%95%D7%96+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "ניגון", "desc": "כשהתמימים נגנו נתן חיות לאדמו\"ר הריי\"ץ", "page": 43, "sichah": "עש\"ק פ' שופטים, כ\"ו מנחם־אב תש\"ו", "excerpt": "ז. מספר כ\"ק אדמו\"ר שליט\"א: שבעת האחרונה הי' חלוש ביותר ל\"ע, ובשמעו כי תלמידי התמימים ניגנו ניגונים, הוא ממש קיבל חיות מכך, הוא חש ליובאוויטש.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FErev_Shabbos_Shoftim_26_Menachem_Av_5706.pdf&title=%D7%A2%D7%A9%22%D7%A7+%D7%A4%27+%D7%A9%D7%95%D7%A4%D7%98%D7%99%D7%9D%2C+%D7%9B%22%D7%95+%D7%9E%D7%A0%D7%97%D7%9D%D6%BE%D7%90%D7%91+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "נסיעה לרבי", "desc": "פעם נסעו פעם בכמה שנים וחיו עם פתגם", "page": 19, "sichah": "פורים תש\"ו", "excerpt": "חסיד היה נוסע לרבי פעם אחת בשנה, פעם בשנתיים פעם בשלוש שנים; כשהוא שמע מהרבי פתגם - הוא חי את הפתגם, הוא היה דבר אחד עם החסידות. כשהיה ברחוב, בשוק, וכשאכל הוא חי עם הפתגם.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FPurim_5706.pdf&title=%D7%A4%D7%95%D7%A8%D7%99%D7%9D+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "נרות חנוכה", "desc": "אדנ\"ע מדליק אצל אמו, נשאר לכחצי שעה", "page": 16, "sichah": "ליל ש\"פ וישב, כ\"ו כסלו, שבת חנוכה תש\"ו", "excerpt": "ו. הוד כ\"ק אאמו\"ר הרה\"ק הי' מדליק את נרות חנוכה ליד דלת בין חדר אחד לשני, ולא אהב שמישהו שאינו מבני הבית יהי' נוכח. אחרי ההדלקה הוד כ\"ק אאמו\"ר הרה\"ק היה נשאר לשבת ליד הנרות לכחצי שעה. אחרי כן הוא היה הולך הביתה ולומד שעה, שעה וחצי שיעור גמרא. לאו דוקא מענין נרות חנוכה, אלא על סדר הש\"ס שהי' לומד.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Shabbos_Vayeishev_26_Kislev_Chanukah_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%A9%22%D7%A4+%D7%95%D7%99%D7%A9%D7%91%2C+%D7%9B%22%D7%95+%D7%9B%D7%A1%D7%9C%D7%95%2C+%D7%A9%D7%91%D7%AA+%D7%97%D7%A0%D7%95%D7%9B%D7%94+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "נרות חנוכה", "desc": "הרבנית תדליק לבד כשאדנ\"ע נסע, מנהג בית־רבי, להקשיב להם", "page": 17, "sichah": "ליל ש\"פ וישב, כ\"ו כסלו, שבת חנוכה תש\"ו", "excerpt": "ה. הוד כ\"ק אאמו\"ר הרה\"ק היה מדליק את נרות חנוכה בבית אמו, כבוד אמי זקנתי הרבנית רבקה, וגם ביום שישי ערב ש\"ק הי' מדליק שם את נרות החנוכה, למרות שלא אכל או ישן שם.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Shabbos_Vayeishev_26_Kislev_Chanukah_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%A9%22%D7%A4+%D7%95%D7%99%D7%A9%D7%91%2C+%D7%9B%22%D7%95+%D7%9B%D7%A1%D7%9C%D7%95%2C+%D7%A9%D7%91%D7%AA+%D7%97%D7%A0%D7%95%D7%9B%D7%94+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "נרות־קרח", "desc": "סיפור עם הבעש\"ט", "page": 30, "sichah": "ליל אחרון של פסח תש\"ו", "excerpt": "בפסח ת\"ש דיברנו על ה'וואָרט' הזה, ואז אמרנו שאצל הבעש\"ט גם \"נרות־קרח\" בערו, והיום חסידים לבושים כחסידים אך קרים וחשוכים.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2F21_Leil_Acharon_shel_Pesach_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%90%D7%97%D7%A8%D7%95%D7%9F+%D7%A9%D7%9C+%D7%A4%D7%A1%D7%97+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "נשמה דאצי'", "desc": "אדה\"ז", "page": 4, "sichah": "יום ב' דחג הסוכות תש\"ו", "excerpt": "ח\"י אלול הוא היום המאושר שסבא - אדמו\"ר הזקן - נולד. הסבא, שהוא נשמה דאצילות, גילה וייסד את עבודת החסידות, שמרומזת במילים ח\"י אלול. אלול הוא ראשי תיבות אני לדודי ודודי לי. ח\"י זה חיים, זאת אומרת שהחסידות יוצרת את החיות שבירידת הנשמה בגוף.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FYom_Beis_Sukkos_5706.pdf&title=%D7%99%D7%95%D7%9D+%D7%91%27+%D7%93%D7%97%D7%92+%D7%94%D7%A1%D7%95%D7%9B%D7%95%D7%AA+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "נשמה דאצי'", "desc": "יכול לפתוח המעיינות", "page": 17, "sichah": "ליל ש\"פ וישב, כ\"ו כסלו, שבת חנוכה תש\"ו", "excerpt": "רק נשמה חדשה דאצילות - הכוונה להוד כ\"ק אדמו\"ר הזקן - יכל לפתוח את המעינות. יב. באחת האספות שהתאספו בפטרבּורג הוד כ\"ק אאזמו\"ר הרה\"ק מוהר\"ש אמר לאחד הרבנים: גם לעשיו קראו 'הרב'.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Shabbos_Vayeishev_26_Kislev_Chanukah_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%A9%22%D7%A4+%D7%95%D7%99%D7%A9%D7%91%2C+%D7%9B%22%D7%95+%D7%9B%D7%A1%D7%9C%D7%95%2C+%D7%A9%D7%91%D7%AA+%D7%97%D7%A0%D7%95%D7%9B%D7%94+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "נשמה דאצי'", "desc": "אדה\"ז נשמה דחכ' דאצי'", "page": 21, "sichah": "יום א' דחג הפסח תש\"ו", "excerpt": "א. כשאדמו\"ר הזקן חזר בפעם הראשונה ממעזריטש הוא אמר שבמעזריטש גילו לו מה הוא ומדוע נשמתו ירדה לשוק. גילו לו שנשמתו היא חכמה דאצי' ומה כוונת שליחותו כאן למטה. בידעו מה הוא ומה השליחות בירידת נשמתו למטה, הוא אזר עוז להתחיל לנהוג בהתגלות.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FYom_Alef_Pesach_5706.pdf&title=%D7%99%D7%95%D7%9D+%D7%90%27+%D7%93%D7%97%D7%92+%D7%94%D7%A4%D7%A1%D7%97+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "סוכה", "desc": "של הבעש\"ט", "page": 1, "sichah": "ליל א' דחג הסוכות תש\"ו", "excerpt": "ג. סוכתו של הבעש\"ט היתה בנויה כדבעי וחמה.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Alef_Sukkos_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%90%27+%D7%93%D7%97%D7%92+%D7%94%D7%A1%D7%95%D7%9B%D7%95%D7%AA+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "סיפור", "desc": "גוף ונשמה", "page": 2, "sichah": "ליל א' דחג הסוכות תש\"ו", "excerpt": "ההבדל בין לשמוע מה מספרים לבין לשמוע כיצד מספרים הוא, שבשמיעה מה מספרים שומעים את גוף הסיפור, אבל בשמיעה כיצד מספרים שומעים את הנשמה של הסיפור.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Alef_Sukkos_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%90%27+%D7%93%D7%97%D7%92+%D7%94%D7%A1%D7%95%D7%9B%D7%95%D7%AA+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "סיפור", "desc": "הרביים היו נמנעים מלספר ס., הי' קביעות לספר על אדה\"ז בנערותו, אדה\"ז סיפר לאדמו\"ר האמצעי, הצ\"צ רשם הס", "page": 21, "sichah": "יום א' דחג הפסח תש\"ו", "excerpt": "אצל הרביים היה קביעות לספר סיפורים על ההתנהגות של אדמו\"ר הזקן בימי נערותו, אדמו\"ר הזקן סיפר לאדמו\"ר האמצעי את קורותיו בימי ילדותו וכשהיה אברך.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FYom_Alef_Pesach_5706.pdf&title=%D7%99%D7%95%D7%9D+%D7%90%27+%D7%93%D7%97%D7%92+%D7%94%D7%A4%D7%A1%D7%97+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "סיפור", "desc": "שונה מדיבור - ענינו לספר", "page": 24, "sichah": "סדר השני של חג הפסח תש\"ו", "excerpt": "יש דיבור ויש סיפור, דיבור יכול להיות בקיצור במילים ספורות ובאופן שמילים ספורות אלו יכילו בתוכם את כל האריכות, אבל סיפור ענינו לספר לאחר, על מנת שהוא יבין, ואם הוא לא הבין בפעם הראשונה צריך לספר עוד פעם, ואם הוא לא הבין במילים אלו צריך לספר במילים אחרות.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FSeder_Sheni_Pesach_5706.pdf&title=%D7%A1%D7%93%D7%A8+%D7%94%D7%A9%D7%A0%D7%99+%D7%A9%D7%9C+%D7%97%D7%92+%D7%94%D7%A4%D7%A1%D7%97+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "סיפור", "desc": "צריך לפעול ואם לא ה\"ז א' מג טעמים", "page": 29, "sichah": "ליל שביעי של פסח תש\"ו", "excerpt": "הצ\"צ אמר: סיפור צריך לפעול בענינים הנ\"ל, ואם אינו פועל הרי זה מסיבת א' מג' טעמים: א) כי השומע אינו מבין, ב) הוא אינו רוצה, והג) כי המקבל הוא כלי מאוס. הסבא - התכוון לאדה\"ז - הרי היה טוב עין, ונתן כח לרחוץ את הכלי על ידי ניגון.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Shvii_shel_Pesach_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%A9%D7%91%D7%99%D7%A2%D7%99+%D7%A9%D7%9C+%D7%A4%D7%A1%D7%97+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "סיפור", "desc": "המלמד סיפר סי", "page": 31, "sichah": "ליל אחרון של פסח תש\"ו", "excerpt": "כשסבי אדמו\"ר המהר\"ש סיפר את סיפור זה לאבי הוא סיים: לא רק שהקרח לא נמס, אלא שהוא האיר וחימם.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2F21_Leil_Acharon_shel_Pesach_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%90%D7%97%D7%A8%D7%95%D7%9F+%D7%A9%D7%9C+%D7%A4%D7%A1%D7%97+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "סיפור", "desc": "הס. עצמו נותן חיות", "page": 33, "sichah": "ליל א' דחג השבועות תש\"ו", "excerpt": "אני חשבתי שעשיתי בחירה נכונה, אני מתחרט על כך (\"איך בין מוחל\")... מי שלוקח ענין במוחין, הוא צריך שמצידו יהיה לו חיות בזה, אבל כששומעים סיפור הסיפור עצמו נותן חיות.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Alef_Shavuos_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%90%27+%D7%93%D7%97%D7%92+%D7%94%D7%A9%D7%91%D7%95%D7%A2%D7%95%D7%AA+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "סיפור", "desc": "אדנ\"ע סיפר הרבה לאדמו\"ר הריי\"ץ", "page": 42, "sichah": "עש\"ק פ' שופטים, כ\"ו מנחם־אב תש\"ו", "excerpt": "כ\"ק אדמו\"ר שליט\"א מספר: כשהחסיד ר' אשר מניקָלאַיעוו הגיע לליובאוויטש, ושמע שכ\"ק אדמו\"ר אינו בקו הבריאות, מיד חזר לביתו כדי לא להטריח את כ\"ק אדמו\"ר. (כמדומה לי שהתענית הידוע של החסיד ר' אשר הנ\"ל, היה בשל חלישות הבריאות של כ\"ק אאמו\"ר, וקיבל עליו תענית שבוע שלם, בהיותו בביתו. ונסע מליובאוויטש לביתו והגיע ביום הרביעי. בבואו, לא אמר לו כ\"ק אאמו\"ר להפסיק התענית, ורק שיתנהג בסדר בשינה, שלא היה מדייק בזה, ועוד דברים, ובכניסת הש\"ק אמר לו כ\"ק אאמו\"ר שיתפלל ערבית, והזהירו שישתה הרבה, צונן וחמין.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FErev_Shabbos_Shoftim_26_Menachem_Av_5706.pdf&title=%D7%A2%D7%A9%22%D7%A7+%D7%A4%27+%D7%A9%D7%95%D7%A4%D7%98%D7%99%D7%9D%2C+%D7%9B%22%D7%95+%D7%9E%D7%A0%D7%97%D7%9D%D6%BE%D7%90%D7%91+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "ספירת העומר", "desc": "אצל הבעש\"ט והמגיד - כעובר לפני התיבה, בליל הוד שבהוד", "page": 16, "sichah": "כ' כסלו תש\"ו", "excerpt": "מנהגם של מורנו הבעש\"ט והרב המגיד בזמן נשיאותם של כל אחד מהם הי', שאת ספירת העומר היו סופרים כעובר לפני התיבה בבית הכנסת. כשהרב המגיד ספר את ספירת העומר במנין לפני התיבה בתפילת ערבית, ליל התקדש הוד שבהוד, אדמו\"ר הזקן הרגיש את הגילוי חב\"ד שבנפשו. ומאז והלאה רבינו הזקן ראה במוחש את קיום תפילתו וברכתו של הרב המגיד - \"אל הוי' ויאר לנו\"; ותפילתו וברכתו של הרב המגיד שאצלו, אצל אדמו\"ר הזקן, יאיר חב\"ד שבנפשו בהתגלות בהצלחה מופלגה בזמן במחשבה ובכתיבה בסגנון קצר המחזיק את המרובה.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2F20_Kislev_5706.pdf&title=%D7%9B%27+%D7%9B%D7%A1%D7%9C%D7%95+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "עבודה", "desc": "ע. אמיתית - תכין ליבם", "page": 5, "sichah": "ליל שמחת תורה תש\"ו", "excerpt": "א. העבודה האמיתית היא ה\"תכין לבם\", לבקש מהשי\"ת, שהוא, ברוך הוא, יעזור בתחילת העבודה של הַצָבת הלב בדרגת העבודה הנכונה.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Simchas_Torah_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%A9%D7%9E%D7%97%D7%AA+%D7%AA%D7%95%D7%A8%D7%94+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "עבודה", "desc": "פעם היו מונחים בע. היום לא", "page": 34, "sichah": "ליל א' דחג השבועות תש\"ו", "excerpt": "ג. פעם ברוסיה החסידים היו עשירים בגשמיות וברוחניות, ביקשו גשמיות אבל לא דרשו הרבה, ולא היה חסר, יותר, פחות, שלי, שלו. ורוחניות בודאי שהיה, היו מונחים בעבודה והיה חיות בזה, מה שאין כן במדינה זו חסר לגמרי ענין העבודה הרוחנית.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Alef_Shavuos_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%90%27+%D7%93%D7%97%D7%92+%D7%94%D7%A9%D7%91%D7%95%D7%A2%D7%95%D7%AA+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "עבודה", "desc": "חסי' בלי ע. אינה כלום", "page": 36, "sichah": "יום א' דחג השבועות תש\"ו", "excerpt": "ו. ה\"זכור ימות עולם\" של חסידים הוא עשיר ביותר. אמירת מאמר חסידות הרי אין למעלה ממנו; כשמדברים בעניני עבודה, הרי זה אותו הדבר, שהרי חסידות בלי עבודה זה הרי כלום, עבודה בלי חסידות - נו…, אבל כשמדברים על ה\"זכור ימות עולם\" של חסידים - זה עושה שינו בחיים, וכשמורידים את העבר אל תוך ההווה - זה עושה את ההווה מואר.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2F24_Yom_Alef_Shavuos_5706.pdf&title=%D7%99%D7%95%D7%9D+%D7%90%27+%D7%93%D7%97%D7%92+%D7%94%D7%A9%D7%91%D7%95%D7%A2%D7%95%D7%AA+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "עבודה", "desc": "היא המסגרת של החסידות", "page": 37, "sichah": "יום ב' דחג השבועות תש\"ו", "excerpt": "אבא אמר שלחסידות יש מסגרת והיא עבודה; ו'עבודה' צריכה להיות באמת, מאחר ואם לא הרי היא כלל לא עבודה. יש שקר ברע ויש שקר בטוב - כאשר נעמדים בדרגא בעבודה שהיא לעילא מדרגי' הרי זה שקר.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FYom_Beis_Shavuos_5706.pdf&title=%D7%99%D7%95%D7%9D+%D7%91%27+%D7%93%D7%97%D7%92+%D7%94%D7%A9%D7%91%D7%95%D7%A2%D7%95%D7%AA+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "עבודה", "desc": "צ\"ל עבודת הלב", "page": 40, "sichah": "י\"ב תמוז תש\"ו", "excerpt": "ג. ענינו של חסיד הוא - ללמוד. צריכים ללמוד חסידות, על דרך לימוד הנגלה כך צריך להיות לימוד החסידות, אבי ייסד את תומכי־תמימים כדי שידעו מה זאת אומרת ללמוד וכיצד צריך ללמוד כדי שאור התורה יאיר את הלומד. את זאת צריכים אחר כך להוריד לתוך עבודת הלב, שלא יהיה ראש מנותק. חסידות אינה ע\"י מקיפים: הוא מסתפק במועט, הוא הרי יהודי, הוא חסיד, מתנהג במידות חסידות, הוא מתפלל, בשבת הוא מאריך קצת בתפילה, הוא מתאנח אנחה חסידית והוא רוקד. זה לא חסיד, אלא מוכרח להיות עבודה ויגיעה.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2F12_Tammuz_5706.pdf&title=%D7%99%22%D7%91+%D7%AA%D7%9E%D7%95%D7%96+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "עבודה", "desc": "עצמות מתגלה ע\"י ע", "page": 42, "sichah": "עש\"ק פ' שופטים, כ\"ו מנחם־אב תש\"ו", "excerpt": "ג. כ\"ק אדמו\"ר שליט\"א ממשיך לספר: שכ\"ק אאמו\"ר היה מספר לו הרבה סיפורים מלבד מה שסיפר ברבים, הי' מספר לו ביחידות הרבה סיפורים. ושמע פעם מכ\"ק אאמו\"ר, ש\"עצמוּת נשבע שלמשכיל הוא לא יתגלה\", אלא יתגלה רק על ידי עבודה, בלימוד החסידות בעבודה מתגלה עצמותו. ופעם אמר כ\"ק אאמו\"ר שהמשכיל מורד בעצמות (ומבאר כ\"ק אדמו\"ר שליט\"א, שמורד גרוע מפוגם, מורד הוא עניין של זדון).", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FErev_Shabbos_Shoftim_26_Menachem_Av_5706.pdf&title=%D7%A2%D7%A9%22%D7%A7+%D7%A4%27+%D7%A9%D7%95%D7%A4%D7%98%D7%99%D7%9D%2C+%D7%9B%22%D7%95+%D7%9E%D7%A0%D7%97%D7%9D%D6%BE%D7%90%D7%91+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "עבודת התפילה", "desc": "דבר המעמיד", "page": 3, "sichah": "יום א' דחג הסוכות תש\"ו", "excerpt": "אחד מדרכי החסידים היא עבודת התפילה. התפילה החסידית היא ה'דבר המעמיד' החסידי. היא מעמידה את המתפלל בפינה מוארת, ומאירה לו את הדרך להכיר את מהות עצמו באופן אמיתי, הן המעלות שיש לו והן החסרונות שהוא צריך לנקות.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FYom_Alef_Sukkos_5706.pdf&title=%D7%99%D7%95%D7%9D+%D7%90%27+%D7%93%D7%97%D7%92+%D7%94%D7%A1%D7%95%D7%9B%D7%95%D7%AA+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "עובד", "desc": "מעשיו מרובים מחכמתו", "page": 5, "sichah": "ליל שמיני עצרת תש\"ו", "excerpt": "בשמחת תורה המלך בהתגלות, ואז העבודה היא שמחה בהתגלות, דהיינו שהרגליים מרוממים את הראש. העבודה בפועל מרוממת את שכל המשיג למקום כזה שהראש מעצמו לא מסוגל להשיג. רוקדים ורוקדים עד שהריקוד מרומם את האדם לרום העצמי, ולזה יכול להגיע רק עובד שמעשיו מרובים מחכמתו.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Shmini_Atzeres_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%A9%D7%9E%D7%99%D7%A0%D7%99+%D7%A2%D7%A6%D7%A8%D7%AA+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "עובד", "desc": "צריך לקלוט האמיתיות בכל דבר", "page": 23, "sichah": "יום א' דחג הפסח תש\"ו", "excerpt": "אבי היה כל כך מאוחד עם החסידות עד כדי כך שכל מה שראה, הוא לא ראה את הדבר כפי שהוא נראה כפשוטו, אלא כפי שהוא בעניני אלוקות. וזהי הוראה לעובד, שכל מה שרואה וכל מה ששומע הוא יקלוט את אמיתיות הענין שבו.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FYom_Alef_Pesach_5706.pdf&title=%D7%99%D7%95%D7%9D+%D7%90%27+%D7%93%D7%97%D7%92+%D7%94%D7%A4%D7%A1%D7%97+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "עם־הארץ", "desc": "מדריגה גדולה", "page": 18, "sichah": "פורים תש\"ו", "excerpt": "כשאדמו\"ר הזקן חזר ממעזריטש שאלו אותו מה הוא קיבל שם, והוא ענה שבמעזריטש הוא קיבל דרך חדשה, והיא שצריך לדעת שאנחנו עם הארץ, עם הארץ זו מדריגה גדולה, עם הארץ עושה כל דבר בפשיטות מבלי לדעת מדוע כך צריך להיות, ומפשיטות מגיעים לתמימות.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FPurim_5706.pdf&title=%D7%A4%D7%95%D7%A8%D7%99%D7%9D+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "עם־הארץ", "desc": "לגבי הקב\"ה כולם ע.הא", "page": 38, "sichah": "יום ב' דחג השבועות תש\"ו", "excerpt": "לגבי הקב\"ה הרי כולם כעמי הארצות, במילא לא שייך יחוסים כלל, אלא שצריכים לאהוב את הזולת שהקב\"ה בחר בו, אותו יהודי שעבורו הקב\"ה ברא את כל העולמות ונתן את התורה, וזה יהודי בעצם.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FYom_Beis_Shavuos_5706.pdf&title=%D7%99%D7%95%D7%9D+%D7%91%27+%D7%93%D7%97%D7%92+%D7%94%D7%A9%D7%91%D7%95%D7%A2%D7%95%D7%AA+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "פיקח", "desc": "חסידים הם פיקחים", "page": 36, "sichah": "יום א' דחג השבועות תש\"ו", "excerpt": "ה. הרבי והרביים נתנו ונותנים, כל מיני כלי־זין ותכסיסי מלחמה לחסידים, הם דאגו לחסידים לכל ונתנו להם כוחות. חסידים הם פיקחים, מה הפלא בכך שחסידים פקחים, הלא לאחר כל הכוחות הגדולים שהרביים הדריכו את החסידים, אפילו שוטה גמור היה נעשה 'חכם עתיק', אלא יש לפעול. אם אחרי כל הכוחות שהרביים נתנו לחסידים אין פועלים, זהו באמת פשיעה, זהו גרוע יותר מאשר אילו לא ניתנו הכוחות. אבל כאשר כן נתנו לך כאלו כוחות - בוודאי שיש לפעול.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2F24_Yom_Alef_Shavuos_5706.pdf&title=%D7%99%D7%95%D7%9D+%D7%90%27+%D7%93%D7%97%D7%92+%D7%94%D7%A9%D7%91%D7%95%D7%A2%D7%95%D7%AA+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "פנימיות התורה", "desc": "השכלה מחי' ההבנה", "page": 5, "sichah": "ליל שמחת תורה תש\"ו", "excerpt": "נקודת ההשכלה של הענין הזה הוא: בגליא שבתורה הכוונה בהבנה היא שהמבין מחי' את ההשכלה, ובפנימיות התורה הכוונה של הבנה היא שההשכלה מחי' את הבנתו.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Simchas_Torah_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%A9%D7%9E%D7%97%D7%AA+%D7%AA%D7%95%D7%A8%D7%94+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "פנימיות התורה", "desc": "מאיר את הגלות", "page": 24, "sichah": "סדר השני של חג הפסח תש\"ו", "excerpt": "אצל ראב\"ע היה 'ולא זכיתי' - לא האיר 'יציאת מצרים', 'בלילות' - בגלות, מדוע? כי ראב\"ע היה מונח רק בגליא שבתורה, למרות שגם מצד גליא שבתורה יש את ענין הגאולה, אבל זו גאולה גלותית. עד שדרשה בן זומא שזו פנימיות התורה, שפועלת שה'ימי חייך' יהיה כלי ל'כל ימי חייך להביא הלילות', להאיר את הגלות עד לענין של להביא לימות המשיח, לא רק שנדע את כוונת הגלות, אלא שגם כוונת הגאולה תאיר בגלות.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FSeder_Sheni_Pesach_5706.pdf&title=%D7%A1%D7%93%D7%A8+%D7%94%D7%A9%D7%A0%D7%99+%D7%A9%D7%9C+%D7%97%D7%92+%D7%94%D7%A4%D7%A1%D7%97+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "פשטות", "desc": "הפ. של של ש.י. הבונה", "page": 23, "sichah": "יום א' דחג הפסח תש\"ו", "excerpt": "הרשב\"ץ סיפר את שראה באחת ההתועדויות החסידיות בליובאוויטש: בהתוועדות ישבו ר' הלל מפאַריטש ור' אייזיל מהאָמיל, ור' הלל התבטא שהוא מקנא בשלום יוסף הבונה (פּלאָטניק).", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FYom_Alef_Pesach_5706.pdf&title=%D7%99%D7%95%D7%9D+%D7%90%27+%D7%93%D7%97%D7%92+%D7%94%D7%A4%D7%A1%D7%97+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "פשיטות", "desc": "פשיטות העצמות הכוונה לעצם עצמו", "page": 34, "sichah": "ליל א' דחג השבועות תש\"ו", "excerpt": "אבי שאל פעם את סבי הרבי המהר\"ש: מהו הענין של פשיטות העצמות, עצמות הוא הרי פשוט? הרבי המהר\"ש ענה לו: אמנם עצמות הוא פשוט, אבל עצמות מרגיש את מעלת העצמות, פשיטת העצמות הכוונה לַעצם עצמו. אבי סיפר שעם פתגם זה הוא התפלל למשך זמן רב.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Alef_Shavuos_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%90%27+%D7%93%D7%97%D7%92+%D7%94%D7%A9%D7%91%D7%95%D7%A2%D7%95%D7%AA+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "פתגם", "desc": "לחיות שנה שלימה", "page": 6, "sichah": "ש\"פ נח בסעודת הלילה", "excerpt": "אמר כ\"ק אד\"ש:) מזה מובן גם כן מה שנדבר בחג הסוכות העבר, שעם פתגם חסידות אפשר לחיות שנה שלימה, שזהו כמו גפרור שאיתו אפשר להצית אש גדולה.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Shabbos_Noach_5706.pdf&title=%D7%A9%22%D7%A4+%D7%A0%D7%97+%D7%91%D7%A1%D7%A2%D7%95%D7%93%D7%AA+%D7%94%D7%9C%D7%99%D7%9C%D7%94"}, {"t": "i", "topic": "פתגם", "desc": "הלואי לחזור בפנימיות", "page": 19, "sichah": "פורים תש\"ו", "excerpt": "(ואמר כ\"ק אדמו\"ר שליט\"א:) כדי לומר כזה פתגם צריך להיות ר' אייזיל. ואנחנו מאחלים לעצמנו היום: הלוואי שנחזור פתגם של חסיד זקן בפנימיות והפנמה כזו שרק הקב\"ה יודע. באמת אין לנו כלום ואיננו כלום, אנו מסתפקים בכך שישנו. קבצן נהיה מאושר כשגביר אומר לו שלום עליכם.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FPurim_5706.pdf&title=%D7%A4%D7%95%D7%A8%D7%99%D7%9D+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "פתגם", "desc": "צריך יגיעה להבין פתגם, להתעמק בפ., חיות בפ", "page": 41, "sichah": "י\"ב תמוז תש\"ו", "excerpt": "צריך שתהיה עבודה ויגיעה, להתייגע בהבנת פתגם. על דרך שבנגלה יש קושיה ותירוץ ומזה מגיעים לענין חדש, כמו כן צריך להיות בלימוד החסידות - ללמוד עם תענוג ושיהיה חיות בפתגם של חסידות, צריך להתעמק בפתגם של חסידות.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2F12_Tammuz_5706.pdf&title=%D7%99%22%D7%91+%D7%AA%D7%9E%D7%95%D7%96+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "צדיקים נסתרים", "desc": "אבי ודוד אדה\"ז היו צ.נ", "page": 18, "sichah": "פורים תש\"ו", "excerpt": "ג. בהיותי ביחידות בשנת תרנ\"ח, אבי סיפר לי מה ששמע מסבי בשם הצ\"צ, שהעבודה של אדמו\"ר הזקן היתה לגלות אצל כל אחד את החב\"ד שבנשמה. כשנכנס אליו ליחידות יהודי פשוט, האָט ער איהם אַ סמאָליע (כן היה הלשון של כ\"ק אדמו\"ר מהר\"ש נ\"ע) געטאָן מיט זיין חב\"ד שבנשמה.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FPurim_5706.pdf&title=%D7%A4%D7%95%D7%A8%D7%99%D7%9D+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "צדיקים נסתרים", "desc": "אדה\"ז ניגן הניגונים שלהם, התארחו בבית אדה\"ז, מעברם לגילוי בזמן ילדות אדה\"ז", "page": 35, "sichah": "יום א' דחג השבועות תש\"ו", "excerpt": "כשהיה ילד קטן, הוא היה מנגן גדול. הוא היה שר את הניגונים ששמע מהאורחים, עוברים ושבים שהיו באים לאביו, הם היו הצדיקים הנסתרים, השלוחים של הבעש\"ט נ\"ע. אדמו\"ר הזקן אז לא ידע על הבעש\"ט ולא ידע שאביו ר' ברוך היה יהודי ששייך לבעש\"ט (\"בעל שם'סקער איד\"). אז היה הזמן של המעבר של הצדיקים נסתרים להתגלות, הבעש\"ט היה ענינו להתגלות. האורחים הצדיקים נסתרים שהיו מגיעים לביתו של ר' ברוך היו שלוחים מהבעש\"ט אודות הילד (היינו אדמו\"ר הזקן) בנוגע להוראות בחינוך שלו וכדומה.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2F24_Yom_Alef_Shavuos_5706.pdf&title=%D7%99%D7%95%D7%9D+%D7%90%27+%D7%93%D7%97%D7%92+%D7%94%D7%A9%D7%91%D7%95%D7%A2%D7%95%D7%AA+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "צדיקים נסתרים", "desc": "הבעש\"ט שלח לאבי אדה\"ז בענין חינוכו", "page": 36, "sichah": "יום א' דחג השבועות תש\"ו", "excerpt": "כשהיה ילד קטן, הוא היה מנגן גדול. הוא היה שר את הניגונים ששמע מהאורחים, עוברים ושבים שהיו באים לאביו, הם היו הצדיקים הנסתרים, השלוחים של הבעש\"ט נ\"ע. אדמו\"ר הזקן אז לא ידע על הבעש\"ט ולא ידע שאביו ר' ברוך היה יהודי ששייך לבעש\"ט (\"בעל שם'סקער איד\"). אז היה הזמן של המעבר של הצדיקים נסתרים להתגלות, הבעש\"ט היה ענינו להתגלות. האורחים הצדיקים נסתרים שהיו מגיעים לביתו של ר' ברוך היו שלוחים מהבעש\"ט אודות הילד (היינו אדמו\"ר הזקן) בנוגע להוראות בחינוך שלו וכדומה.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2F24_Yom_Alef_Shavuos_5706.pdf&title=%D7%99%D7%95%D7%9D+%D7%90%27+%D7%93%D7%97%D7%92+%D7%94%D7%A9%D7%91%D7%95%D7%A2%D7%95%D7%AA+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "צורה", "desc": "התגברות הצ. על החומר וסיפור בנושא", "page": 39, "sichah": "כ\"א סיון תש\"ו", "excerpt": "בכלל צריך להיות התגברות הצורה על החומר בכל הענינים, הן בהתעסקות בעניני הכלל, וגם בענינים כאלו אשר עושים במס\"נ צריך להיות התגברות הצורה על החומר.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2F21_Sivan_5706.pdf&title=%D7%9B%22%D7%90+%D7%A1%D7%99%D7%95%D7%9F+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "ציור", "desc": "העמקה בצ. המחשבה על העבר", "page": 25, "sichah": "סדר השני של חג הפסח תש\"ו", "excerpt": "כשמעמיקים בציור המחשבה על החיים בעבר, אזי אינֶנוּ בודדים. למרות שגם כעת הרי אנו לא לבד, אנו נמצאים ב\"ה בין יהודים, יהודים כאלו שרוצים לשמוע ושיש להם געגועים לשמוע 'וואָרט'. -", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FSeder_Sheni_Pesach_5706.pdf&title=%D7%A1%D7%93%D7%A8+%D7%94%D7%A9%D7%A0%D7%99+%D7%A9%D7%9C+%D7%97%D7%92+%D7%94%D7%A4%D7%A1%D7%97+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "צרות", "desc": "טרודים מצ. היום יום", "page": 31, "sichah": "ליל אחרון של פסח תש\"ו", "excerpt": "אנו טרודים מצרות היום יום, אצל פלוני יש צו גיוס, אצל מישהו אחר יש ניתוח ר\"ל, יולדת, ובכל עת טרודים מכך עד כדי כך שאי אפשר להיות בשמחה.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2F21_Leil_Acharon_shel_Pesach_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%90%D7%97%D7%A8%D7%95%D7%9F+%D7%A9%D7%9C+%D7%A4%D7%A1%D7%97+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "ק\"ש שעל המיטה", "desc": "סיפור על הרג\"ד", "page": 3, "sichah": "יום א' דחג הסוכות תש\"ו", "excerpt": "ג. החסיד הרב ר' גרשון דוב נ\"ע היה רגיל לומר לאחר שקרא קריאת שמע שעל המיטה ב'עבודה': [אני חש ש]אני מטעה את עצמי, אני לא רוצה להטעות את עצמי, אבל כך זה קורה. צריך לקום אחרת לגמרי. לאחר עבודה כזו בק\"ש שעל המיטה ישנים אחרת וקמים אחרת. ובפרט בזמנים שהלב נעול והראש סתום, פתגמי העבודה החסידיים פותחים את הלב ומאירים את הראש.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FYom_Alef_Sukkos_5706.pdf&title=%D7%99%D7%95%D7%9D+%D7%90%27+%D7%93%D7%97%D7%92+%D7%94%D7%A1%D7%95%D7%9B%D7%95%D7%AA+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "ק\"ש שעל המיטה", "desc": "הכנה לתפילה", "page": 14, "sichah": "ש\"פ וישלח, י\"ט כסלו תש\"ו", "excerpt": "ז. ההכנה לתפילה מתחילה מקריאת שמע שעל המיטה, גם תיקון חצות, אם שייכים לזה. (שאל הרש\"ל שיחי': מה הכוונה שייך לזה? וענה כ\"ק אדמו\"ר שליט\"א:) אני מתכוון מצד בריאות הגוף. (שאל הרמ\"ש שיחי': השינה אינה הפסק (בין הק\"ש שעל המיטה ושחרית) ואז זה כבר לא נוגע? וענה כ\"ק אדמו\"ר שליט\"א:) ישנים אחרת, [ואזי] זה מאד נוגע.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FShabbos_Vayishlach_19_Kislev_5706.pdf&title=%D7%A9%22%D7%A4+%D7%95%D7%99%D7%A9%D7%9C%D7%97%2C+%D7%99%22%D7%98+%D7%9B%D7%A1%D7%9C%D7%95+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "ק\"ש שעל המיטה", "desc": "שונה מדרגת ק\"ש של שחרית", "page": 24, "sichah": "סדר השני של חג הפסח תש\"ו", "excerpt": "יש קריאת שמע שעל המיטה ויש קריאת שמע של שחרית. ישנו חילוק גדול בין קריאת שמע של ערבית בכלל וקריאת שמע שעל המיטה בפרט, לקריאת שמע של שחרית.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FSeder_Sheni_Pesach_5706.pdf&title=%D7%A1%D7%93%D7%A8+%D7%94%D7%A9%D7%A0%D7%99+%D7%A9%D7%9C+%D7%97%D7%92+%D7%94%D7%A4%D7%A1%D7%97+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "קבלת־עול", "desc": "לפני או אחרי ההבנה", "page": 5, "sichah": "יום שבת חוה\"מ סוכות תש\"ו", "excerpt": "", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FShabbos_Chol_HaMoed_Sukkos_5706.pdf&title=%D7%99%D7%95%D7%9D+%D7%A9%D7%91%D7%AA+%D7%97%D7%95%D7%94%22%D7%9E+%D7%A1%D7%95%D7%9B%D7%95%D7%AA+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "קבצן", "desc": "תמיד עסוק בקבצנות - כך הרבי", "page": 32, "sichah": "ליל אחרון של פסח תש\"ו", "excerpt": "ד. הקבצן תמיד עסוק בקבצנות ואינו יכול ליהנות כלל ממה שיש לו, הוא צריך תמיד לקבץ, וצריך לדאוג תמיד שיהיה ניכר בפניו שהוא קבצן, כי אם לא - לא יתנו לו, ואינו יכול ליהנות ממה שכן יש לו. כמו\"כ אצל גביר: עשיר שנותן אינו יכול ליהנות מעשירותו מאחר וחסר אצל הזולת, ואילו הגביר  שאינו נוהג לתת, אינו יכול ליהנות מעשירותו משום שמבקשים ממנו בכל עת.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2F21_Leil_Acharon_shel_Pesach_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%90%D7%97%D7%A8%D7%95%D7%9F+%D7%A9%D7%9C+%D7%A4%D7%A1%D7%97+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "קול מעורר הכוונה", "desc": "מנגנים בתפילה כי \"הקול כו'\"", "page": 3, "sichah": "יום א' דחג הסוכות תש\"ו", "excerpt": "הוד כ\"ק אאמו\"ר הרה\"ק ענה: הנגינה היא מעמד הנפש המתבטאת בניגון. יש ניגון שמגיע מהגעגועים שיש למנגן, יש ניגוני תקווה ויש ניגוני התמרמרות, וכך ישנם ניגונים מסוגים שונים המתארים את מעמד נפש של המנגן. חסידים מנגנים בתפילה כי הקול מעורר הכוונה. בכדי להבין ענין פנימי צריך לנגן, ואצל חסיד, כשבשעת התפילה ענין מסויים", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FYom_Alef_Sukkos_5706.pdf&title=%D7%99%D7%95%D7%9D+%D7%90%27+%D7%93%D7%97%D7%92+%D7%94%D7%A1%D7%95%D7%9B%D7%95%D7%AA+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "קול מעורר הכוונה", "desc": "ניגון מיוחד לכל ענין", "page": 4, "sichah": "יום שבת חוה\"מ סוכות תש\"ו", "excerpt": "קול מעורר הכוונה. לחסידי רבינו הזקן, לחסידי אדמו\"ר האמצעי ולחסידי הסבא, היה ניגון מיוחד לכל ענין בעבודת החסידות והחסידים, ניגון התעוררות לפני שמיעת חסידות ואחרי שמיעת חסידות, לפני יחידות ואחרי יחידות…", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FShabbos_Chol_HaMoed_Sukkos_5706.pdf&title=%D7%99%D7%95%D7%9D+%D7%A9%D7%91%D7%AA+%D7%97%D7%95%D7%94%22%D7%9E+%D7%A1%D7%95%D7%9B%D7%95%D7%AA+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "רבי", "desc": "אדנ\"ע רבי מלידה", "page": 12, "sichah": "ליל ש\"פ וירא, כ' מר־חשון תש\"ו", "excerpt": "ב. אאמו\"ר נ\"ע לא היה בוכה הרבה, והוא היה מחייך, כשהוא היה רואה אור הוא היה צוחק ומחייך. וסיפרה זאת הרבנית רבקה לאדמו\"ר מוהר\"ש ואמרה: הוא חסיד מלידה, בעל־ביטול (אַ ביטול'דיקער). וסיפר מהר\"ש לאדמו\"ר הצ\"צ, ואמר: היא טועה, הוא לא חסיד מלידה אלא רבי מלידה.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Shabbos_Vayeira_20_MarCheshvan_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%A9%22%D7%A4+%D7%95%D7%99%D7%A8%D7%90%2C+%D7%9B%27+%D7%9E%D7%A8%D6%BE%D7%97%D7%A9%D7%95%D7%9F+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "רבי", "desc": "עצמי יכול להאיר חב\"ד שבנשמה", "page": 19, "sichah": "פורים תש\"ו", "excerpt": "וזה יכול לעשות רק רבי, שהוא עצמי. עצמי יכול לעשות שיאיר החב\"ד שבנשמה. וכמעשה הידוע מר' אייזיק עם הצ\"צ במאמר על שלשה דברים העולם עומד שאמר הצ\"צ בתחילת קבלת הנשיאות, אותו המאמר ששמע מאדמו\"ר הזקן כשהיה ילד, כידוע שהלך אז הצ\"צ לבקר את הרב אייזיל, ויהב לי' ידי' ואוקמי', ואמר לו אז הפירוש על זה בקבלה. ואמר אז אח\"כ ר' אייזיק: חמישים שנה התייגעתי בחסידות, ולא הגעתי אפילו לא כאצבע קטנה; אצלנו האורות הם במתנה והכלים אינם מזוככים, אצלו האורות הם עצמיים והכלים מזוככים.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FPurim_5706.pdf&title=%D7%A4%D7%95%D7%A8%D7%99%D7%9D+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "ריקוד", "desc": "בשמחת תורה", "page": 5, "sichah": "ליל שמיני עצרת תש\"ו", "excerpt": "בשמחת תורה המלך בהתגלות, ואז העבודה היא שמחה בהתגלות, דהיינו שהרגליים מרוממים את הראש. העבודה בפועל מרוממת את שכל המשיג למקום כזה שהראש מעצמו לא מסוגל להשיג. רוקדים ורוקדים עד שהריקוד מרומם את האדם לרום העצמי, ולזה יכול להגיע רק עובד שמעשיו מרובים מחכמתו.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Shmini_Atzeres_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%A9%D7%9E%D7%99%D7%A0%D7%99+%D7%A2%D7%A6%D7%A8%D7%AA+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "שבועות", "desc": "בכל ש. נמשך המשכה חדשה", "page": 38, "sichah": "יום ב' דחג השבועות תש\"ו", "excerpt": "ד. שבועות הוא קבלת התורה ושמירת התורה. בכל שבועות נמשך המשכה חדשה בתורה, שההמשכה החדשה היא המשכה עצמית - לא גילוי של סדר השתלשלות, אלא המשכה עצמית.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FYom_Beis_Shavuos_5706.pdf&title=%D7%99%D7%95%D7%9D+%D7%91%27+%D7%93%D7%97%D7%92+%D7%94%D7%A9%D7%91%D7%95%D7%A2%D7%95%D7%AA+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "שברון־לב", "desc": "אדנ\"ע בטבעו, ע\"י ש.ל. לא מגיעים לכלום, יכולים להגיע להכל", "page": 12, "sichah": "ליל ש\"פ וירא, כ' מר־חשון תש\"ו", "excerpt": "ח. פעם אחת שמעתי מכ\"ק אאמו\"ר נ\"ע שעל ידי שברון־לב (צובראָכענקייט) לא מגיעים לכלום, ופעם שמעתי שעל ידי שברון־לב (צובראָכענקייט) יכולים להגיע להכל.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Shabbos_Vayeira_20_MarCheshvan_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%A9%22%D7%A4+%D7%95%D7%99%D7%A8%D7%90%2C+%D7%9B%27+%D7%9E%D7%A8%D6%BE%D7%97%D7%A9%D7%95%D7%9F+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "שברון־לב", "desc": "אצל יהודי חסידי ברחוב כאן", "page": 34, "sichah": "ליל א' דחג השבועות תש\"ו", "excerpt": "אני יכול לתאר לעצמי את שברון הלב של בן תורה ובן מצוות ובפרט יהודי חסידי, שהולך ברחוב ורואה מה קורה מסביב - איזו שבירה זה פועל עליו, זה ממש עונש…", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Alef_Shavuos_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%90%27+%D7%93%D7%97%D7%92+%D7%94%D7%A9%D7%91%D7%95%D7%A2%D7%95%D7%AA+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "שוטה", "desc": "אינו יודע היכן אוחז", "page": 4, "sichah": "יום ב' דחג הסוכות תש\"ו", "excerpt": "אסור לאדם להיות מוטעה, ועליו לדעת היכן הוא אוחז בעבודת השם. מי שלא יודע היכן הוא אוחז וחושב שהוא ירא שמים, הרי הוא שוטה. ומה חכמה יש בלהטעות שוטה.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FYom_Beis_Sukkos_5706.pdf&title=%D7%99%D7%95%D7%9D+%D7%91%27+%D7%93%D7%97%D7%92+%D7%94%D7%A1%D7%95%D7%9B%D7%95%D7%AA+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "שוטה", "desc": "עם ש. לא נוח גם בג\"ע", "page": 20, "sichah": "פורים תש\"ו", "excerpt": "והתחיל לדבר כ\"ק אדמו\"ר שליט\"א, שכמו\"כ צריכים להתנהג: צריך לא להתווכח כלל עם המתנגדים; צריכים להתנהג באופן שיראו את דרך הטוב. אם הזולת מאפשר - צריך לעשות טובה ליהודי. ואם הוא שוטה וטיפש, ובמילא הוא גם מה שכתוב בהמשך (רשע וגס רוח), לא צריך. עם שוטה פתי - גם אחרי ק\"כ שנה בג\"ע לא נוח להיות.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FPurim_5706.pdf&title=%D7%A4%D7%95%D7%A8%D7%99%D7%9D+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "שוטה", "desc": "אפי' ש. הי' נעשה חכם עם הכוחות שהרביים נתנו", "page": 36, "sichah": "יום א' דחג השבועות תש\"ו", "excerpt": "ה. הרבי והרביים נתנו ונותנים, כל מיני כלי־זין ותכסיסי מלחמה לחסידים, הם דאגו לחסידים לכל ונתנו להם כוחות. חסידים הם פיקחים, מה הפלא בכך שחסידים פקחים, הלא לאחר כל הכוחות הגדולים שהרביים הדריכו את החסידים, אפילו שוטה גמור היה נעשה 'חכם עתיק', אלא יש לפעול. אם אחרי כל הכוחות שהרביים נתנו לחסידים אין פועלים, זהו באמת פשיעה, זהו גרוע יותר מאשר אילו לא ניתנו הכוחות. אבל כאשר כן נתנו לך כאלו כוחות - בוודאי שיש לפעול.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2F24_Yom_Alef_Shavuos_5706.pdf&title=%D7%99%D7%95%D7%9D+%D7%90%27+%D7%93%D7%97%D7%92+%D7%94%D7%A9%D7%91%D7%95%D7%A2%D7%95%D7%AA+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "שמחה", "desc": "אצל הבע\"שט בסוכות", "page": 1, "sichah": "ליל א' דחג הסוכות תש\"ו", "excerpt": "אחד ממנהגי קודש של מורנו הבעש\"ט היתה העבודה בשמחה בחג הסוכות יחד עם היהודים הפשוטים ביותר.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Alef_Sukkos_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%90%27+%D7%93%D7%97%D7%92+%D7%94%D7%A1%D7%95%D7%9B%D7%95%D7%AA+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "שמחה", "desc": "לא רואים על אדמו\"ר הרייץ, צריך להיות כל יום ש\"ת", "page": 30, "sichah": "ליל שביעי של פסח תש\"ו", "excerpt": "אלו שרואים אותי, ובעצמי אני מתפלא על כך, שלא רואים עלי שמחה בהתגלות. באמת הייתי צריך להיות שש ושמח, שבזמן כזה קצר הארנו הרבה לבבות יהודים, ב\"ה נטענו נטיעה פנימית, אור זרוע שמביא ויביא פירי פירות. הביאו אור - שגם במדינה זו יקלטו את האמת, ואור זה פעל בכל סוגי בני האדם, שגם אלו שלא רצו להתחיל להתעסק בעבודה, ועשו הרבה השתדלות שלא להכנס בזה והניעו ראשם לשלילה, אף הם השתנו, ולפי ערכם הם", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Shvii_shel_Pesach_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%A9%D7%91%D7%99%D7%A2%D7%99+%D7%A9%D7%9C+%D7%A4%D7%A1%D7%97+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "שמחת־תורה", "desc": "המלך בהתגלות", "page": 5, "sichah": "ליל שמיני עצרת תש\"ו", "excerpt": "בשמחת תורה המלך בהתגלות, ואז העבודה היא שמחה בהתגלות, דהיינו שהרגליים מרוממים את הראש. העבודה בפועל מרוממת את שכל המשיג למקום כזה שהראש מעצמו לא מסוגל להשיג. רוקדים ורוקדים עד שהריקוד מרומם את האדם לרום העצמי, ולזה יכול להגיע רק עובד שמעשיו מרובים מחכמתו.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Shmini_Atzeres_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%A9%D7%9E%D7%99%D7%A0%D7%99+%D7%A2%D7%A6%D7%A8%D7%AA+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "שמיני עצרת", "desc": "מלך בהיכלו", "page": 4, "sichah": "ליל שמיני עצרת תש\"ו", "excerpt": "א. בחיים של 'עבודה' יש הפרש בין העבודה של שמיני עצרת לעבודה של שמחת תורה, וההפרש הוא: שמיני עצרת הוא כמו מלך בהיכלו, שלא כולם יכולים להכנס להיכל המלך, וכשכן נכנסים להיכל המלך אפילו השר מתבטל כמו (\"אזוי ווי\") עבד. ביטולו של השר אינו יותר מאשר \"כמו\" ביטולו של העבד. כשאומרים \"ווי\" הכוונה - כמו זהו עדיין לא ביטול בכל עצמותו. לשר יש שכל, לעבד אין שום שכל משלו, המלך נותן לו את שכלו. הביטול של העבד והשכל של המלך הם צמד נאה. וזה ההפרש בין אם מתחילים את העבודה בקבלת עול ואחר כך מבינים, לבין אם מתחילים בהבנה ולאחר מכן עושים. ההפרש מובן לכל.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Shmini_Atzeres_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%A9%D7%9E%D7%99%D7%A0%D7%99+%D7%A2%D7%A6%D7%A8%D7%AA+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "שעבוד הלב", "desc": "העיקר, מביא להשגה", "page": 7, "sichah": "ש\"פ נח בסעודת הלילה", "excerpt": "ד. העיקר הוא שעבוד הלב. הרשד\"ב באָריסאָווער התמצא בדא\"ח של אדמו\"ר האמצעי והצמח צדק בקיא בלקו\"ת כו'. פעם בא לליובאַוויטש ושאל את הצ\"צ ענין מסובך בדא\"ח. ענהו: תשאל את ר' זלמן קאַראַבעלניק - איש בעל השגה קטנה אבל מאריך בתפלה באמירת תהילים בבכי' וכה\"ג.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Shabbos_Noach_5706.pdf&title=%D7%A9%22%D7%A4+%D7%A0%D7%97+%D7%91%D7%A1%D7%A2%D7%95%D7%93%D7%AA+%D7%94%D7%9C%D7%99%D7%9C%D7%94"}, {"t": "i", "topic": "שעון", "desc": "המהר\"ש נשא ב' ש", "page": 31, "sichah": "ליל אחרון של פסח תש\"ו", "excerpt": "כשרק התחלתי לדבר, כילד בן 3 בערך, אבי היה שואל אותי: מה אתה זוכר? - הייתי מצייר [מדמיין] לעצמי - והייתי עונה: אני זוכר את סבא - המהר\"ש נ\"ע - שהוא תמיד נשא שתי שרשראות זהב על הוועסט שלו - כידוע שהמהר\"ש נ\"ע נשא תמיד 2 שעונים בכיסו - והטלית קטן בלט מהוועסט שלו, ואבי היה אומר לי לצייר את זה לעצמי. הוא פיתח אצלי את חוש הציור. כשלמדתי אצל המלמד הראשון שלי, ר' יקותיאל, ודרכו היתה שאחרי הלימוד הוא היה מספר סיפורי מעשיות שהי' בהם עניני הפלאה, סיפורים שגם לגדולים היו פלא ומכל שכן לילדים, הייתי מצייר לעצמי את מה שסיפר. אח\"כ למדתי אצל המלמד ר' ניסן. וכמו\"כ בכל ענין בלימוד דא\"ח ציירתי לעצמי הענין. אבי אמר לי פעם: כח הציור הציל אותך. ועל ידי זה התפתח אצלי חוש הציור (עד שיש כמה דברים שהנני זוכר, ואיני יודע אם ראיתי את בעצמי הדבר או שזהו מה שציירתי לעצמי ממה ששמעתי).", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2F21_Leil_Acharon_shel_Pesach_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%90%D7%97%D7%A8%D7%95%D7%9F+%D7%A9%D7%9C+%D7%A4%D7%A1%D7%97+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "שר", "desc": "ביטול כמו עבד", "page": 4, "sichah": "ליל שמיני עצרת תש\"ו", "excerpt": "א. בחיים של 'עבודה' יש הפרש בין העבודה של שמיני עצרת לעבודה של שמחת תורה, וההפרש הוא: שמיני עצרת הוא כמו מלך בהיכלו, שלא כולם יכולים להכנס להיכל המלך, וכשכן נכנסים להיכל המלך אפילו השר מתבטל כמו (\"אזוי ווי\") עבד. ביטולו של השר אינו יותר מאשר \"כמו\" ביטולו של העבד. כשאומרים \"ווי\" הכוונה - כמו זהו עדיין לא ביטול בכל עצמותו. לשר יש שכל, לעבד אין שום שכל משלו, המלך נותן לו את שכלו. הביטול של העבד והשכל של המלך הם צמד נאה. וזה ההפרש בין אם מתחילים את העבודה בקבלת עול ואחר כך מבינים, לבין אם מתחילים בהבנה ולאחר מכן עושים. ההפרש מובן לכל.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Shmini_Atzeres_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%A9%D7%9E%D7%99%D7%A0%D7%99+%D7%A2%D7%A6%D7%A8%D7%AA+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "תורה", "desc": "זה שלומד בלי עבודה - ת. בכלי מאוסה", "page": 19, "sichah": "פורים תש\"ו", "excerpt": "פעם היו אומרים פתגם על אלו שאומרים תורה אבל אינם מתעסקים בעבודה, מדוע אתה מגנה את התורה, זה תורה טהורה בכלי מאוסה! צריך להיות כמו מה שאבי היה אומר: \"טאַפּאָראָ דאָ פּלאַחאַ\".", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FPurim_5706.pdf&title=%D7%A4%D7%95%D7%A8%D7%99%D7%9D+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "תורה", "desc": "לאדה\"ז לא היו קושיות בתורה", "page": 21, "sichah": "יום א' דחג הפסח תש\"ו", "excerpt": "אדמו\"ר הזקן סיפר לאדמו\"ר האמצעי ולצ\"צ, שמימי ילדותו לעולם לא היו לו קושיות בתורה ז.א. שלימודו לא היה באופן של קושיות ותירוצים, אלא שכל ענין בתורה הוא למד מיד כהלכתו, ואם כן היתה לו קושיה - הקושיה נשארה, כי זה לא היה מצד חסרון המקבל אלא מצד העלם המשפיע, שזה נכנס בכלל של - יתרץ קושיות ואבעיות.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FYom_Alef_Pesach_5706.pdf&title=%D7%99%D7%95%D7%9D+%D7%90%27+%D7%93%D7%97%D7%92+%D7%94%D7%A4%D7%A1%D7%97+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "תיקון המידות", "desc": "הוא שבועות", "page": 35, "sichah": "יום א' דחג השבועות תש\"ו", "excerpt": "ב. בשנת תרנ\"ו אבי אמר את המאמר ועשית חג שבועות, והקשה מהו ועשית, מה שייך לעשות  את  חג  שבועות?  והתירוץ על זה ששבועות הו\"ע מעלת תיקוני המידות.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2F24_Yom_Alef_Shavuos_5706.pdf&title=%D7%99%D7%95%D7%9D+%D7%90%27+%D7%93%D7%97%D7%92+%D7%94%D7%A9%D7%91%D7%95%D7%A2%D7%95%D7%AA+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "תיקון חצות", "desc": "למי ששייך מצד בריאות", "page": 14, "sichah": "ש\"פ וישלח, י\"ט כסלו תש\"ו", "excerpt": "ז. ההכנה לתפילה מתחילה מקריאת שמע שעל המיטה, גם תיקון חצות, אם שייכים לזה. (שאל הרש\"ל שיחי': מה הכוונה שייך לזה? וענה כ\"ק אדמו\"ר שליט\"א:) אני מתכוון מצד בריאות הגוף. (שאל הרמ\"ש שיחי': השינה אינה הפסק (בין הק\"ש שעל המיטה ושחרית) ואז זה כבר לא נוגע? וענה כ\"ק אדמו\"ר שליט\"א:) ישנים אחרת, [ואזי] זה מאד נוגע.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FShabbos_Vayishlach_19_Kislev_5706.pdf&title=%D7%A9%22%D7%A4+%D7%95%D7%99%D7%A9%D7%9C%D7%97%2C+%D7%99%22%D7%98+%D7%9B%D7%A1%D7%9C%D7%95+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "תלמיד", "desc": "צ\"ל דוגמא, להתנהג ע\"פ חסידות", "page": 32, "sichah": "כ\"ח ניסן תש\"ו", "excerpt": "(כשנכנסו שאל: מתי אתם נוסעים? וענו: היום. ואמר:) נסיעתכם לשיקגו היא בעלת משמעות כפולה: אתם נוסעים עבור עצמכם, אבל גם להראות דוגמה לאחרים מהו תלמיד של תומכי־תמימים. תלמיד של תומכי־תמימים צריך להתנהג עפ\"י חסידות, לא רק עפ\"י תורה, אלא תלמיד של תומכי־תמימים צריך לנהוג גם עפ\"י חסידות. היה לי קצת נחת רוח מכם, אבל צריך יותר. שמעתי שאתם חוזרים מאמרים, היה לי נחת רוח מזה. אכן צריך לחזור, אבל זה לא מספיק, יש לעסוק בזה. אם חוזרים מאמר בעבודה - צריך להתעסק בעבודה. צריכים ללמוד ולהתמסר ללימוד ולהתעסק בלימוד. אני לא מתכוון בזמנים אחרים, בזמן המנוחה צריך לנוח, אלא שצריך להתעסק בלימוד בפועל ממש. צריך לרצות ללמוד ולהיות מסוגל ללמוד.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2F28_Nissan_5706.pdf&title=%D7%9B%22%D7%97+%D7%A0%D7%99%D7%A1%D7%9F+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "תלמידי התמימים", "desc": "יש הרבה לפעול", "page": 35, "sichah": "ליל א' דחג השבועות תש\"ו", "excerpt": "מילא לראשי הישיבות יש עליהם עול כבד, ויש להם מספיק עגמת נפש, בפרט אלו שאכן מסורים ונתונים, אין הרבה נחת, עגמת נפש מבני הבית, עגמת נפש מהבעלי בתים בעיר, והחוב הגדול שמונח עליהם, ואחרי כל זאת דורשים מהם עוד, אבל תלמידי התמימים הרי יכלו לפעול הרבה.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Alef_Shavuos_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%90%27+%D7%93%D7%97%D7%92+%D7%94%D7%A9%D7%91%D7%95%D7%A2%D7%95%D7%AA+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "תלמידי התמימים", "desc": "נמסרו להם הכוחות", "page": 38, "sichah": "יום ב' דחג השבועות תש\"ו", "excerpt": "ה. התמימים צריכים לדעת את צד־הזכות שיש להם, שמסרו להם את העבודה של הרבצת התורה, וב\"ה פעלו הרבה. אלו שחושבים שאין להם את הכוחות לזה - הרי הם טועים, ואלו שחושבים שהם פועלים בכוחות עצמם הרי זה גם לא אמת, נותנים להם כוחות וב\"ה פועלים, אבל לא צריך שיהיה סיפוק. כאשר יש שביעות־רצון זה מונע את התשוקה לעבודה הבאה [נוספת]. העיקר צריכים להפנים שעדיין לא פעלנו. כמו שאבא נותן לבנו צביטה בלחי אחרי בחינה ואומר לו: אם הצלחת כל כך טוב אזי להבא תצליח עוד יותר טוב.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FYom_Beis_Shavuos_5706.pdf&title=%D7%99%D7%95%D7%9D+%D7%91%27+%D7%93%D7%97%D7%92+%D7%94%D7%A9%D7%91%D7%95%D7%A2%D7%95%D7%AA+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "תלמידי התמימים", "desc": "צריכים לדעת את עבודתם להפוך כאן לליובאַוויטש, צריכים לעסוק בעבודה", "page": 41, "sichah": "י\"ב תמוז תש\"ו", "excerpt": "ו. אתם תלמידי התמימים צריכים להתחיל לעסוק בעבודה. אתם צריכים לדעת שאבא נמצא אחר כותלינו. אדם רעב, כשהוא אוכל, הרי הוא אוכל בחיוּת, מאחר והוא יודע שהאכילה, איזו שתהיה - מחיה אותו, שהרי מאכל משביע. כאן באמריקה נהיו שבעים מוקדם מידי.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2F12_Tammuz_5706.pdf&title=%D7%99%22%D7%91+%D7%AA%D7%9E%D7%95%D7%96+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "תפילה", "desc": "ללמוד פירוש המילות", "page": 5, "sichah": "ליל שמחת תורה תש\"ו", "excerpt": "ג. כל אחד צריך לקבוע שיעור ללמוד את פירוש המילות של התפילה. צריך ללמוד את פסוקי התורה במקור, רש\"י ורמב\"ם או אבן עזרא וכמו כן ללמוד את פסוקי הנ\"ך במקור. הרבי חיבב את המצודות.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Simchas_Torah_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%A9%D7%9E%D7%97%D7%AA+%D7%AA%D7%95%D7%A8%D7%94+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "תפילה", "desc": "יש לפעול על ת", "page": 6, "sichah": "ש\"פ נח בסעודת הלילה", "excerpt": "ג. יש לפעול שיתחילו להתפלל. לא צריכים דוקא הרבה חסידות, עם כמה שלומדים ניתן להתמקד ולהתפלל. ועל זאת כ\"ק אאמו\"ר נ\"ע אמר: הרקע של חסידות.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Shabbos_Noach_5706.pdf&title=%D7%A9%22%D7%A4+%D7%A0%D7%97+%D7%91%D7%A1%D7%A2%D7%95%D7%93%D7%AA+%D7%94%D7%9C%D7%99%D7%9C%D7%94"}, {"t": "i", "topic": "תפילה", "desc": "המשפיעים צריכים ללמד", "page": 10, "sichah": "ליל ש\"פ לך", "excerpt": "ז. על המשפיעים מונח החוב ללמד את התלמידים להתפלל, לא מאמרים על התפילה, אלא ללמד אותם כיצד להתפלל. צריך לנגן ניגון, לא עם חזנות אלא לנגן בפשטות. לאו דוקא ניגון שלם, אפילו תנועה אחת שוב ושוב.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Shabbos_Lech_Lecha_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%A9%22%D7%A4+%D7%9C%D7%9A"}, {"t": "i", "topic": "תפילה", "desc": "מלאכים מקנאים באריכות, האמת בתפילה", "page": 12, "sichah": "ליל ש\"פ וירא, כ' מר־חשון תש\"ו", "excerpt": "הי' איש ממיקולענע שהי' מאריך בתפילתו בכל יום אפילו ביום א' וד' שהיו ימי השוק. ואמר עליו כ\"ק אאמו\"ר נ\"ע: המלאכים מקנאים בתפילתו, אפי' לספירות העליונות אין הארה כמו ההארה שנעשית מתפילתו כשהיא עולה למעלה. פעם אחת שאל הרי\"מ מפּאָטלטאַווע: כיצד מגיעים לאמת בתפילה? וענה כ\"ק אאמו\"ר נ\"ע: כיצד לא מגיעים לאמת בתפילה? אם לא מגיעים לאמת זה סימן שלא התפללת.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Shabbos_Vayeira_20_MarCheshvan_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%A9%22%D7%A4+%D7%95%D7%99%D7%A8%D7%90%2C+%D7%9B%27+%D7%9E%D7%A8%D6%BE%D7%97%D7%A9%D7%95%D7%9F+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "תפילה", "desc": "לימוד וטבילה לפני והמחשבה וניגון בשעת הת", "page": 26, "sichah": "שבת חוה\"מ פסח תש\"ו", "excerpt": "אבי אמר זאת באחד משבתות השנה הרגילות, והמשיך: הלומדים שעתיים חסידות לפני התפילה, ולאחר מכן טובלים במקוה (\"אין וואַסער\"), ולאחר מכן נעמדים להתפלל, וחושבים עם מה הולכים להתפלל ומי הולך להתפלל, ולאחר מכן מתפללים באריכות ושרים את הניגון הזה יכולים לפעול משהו. עיקרו של עבודת התפילה הוא שיהיה ה'סיומא דתפילה', שהתחילה תפעל על 'לאחר התפילה'.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FShabbos_Chol_HaMoed_Pesach_5706.pdf&title=%D7%A9%D7%91%D7%AA+%D7%97%D7%95%D7%94%22%D7%9E+%D7%A4%D7%A1%D7%97+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "תפילה", "desc": "עיקרו לפעול לאחריו, דרגות בזה, היום שטחי, שייך לכולם, שתי תנועות בת., משל מעץ", "page": 27, "sichah": "שבת חוה\"מ פסח תש\"ו", "excerpt": "ואבי דיבר על כך שיש בזה דרגות: הדבר הראשון שצריך להיות הוא שאכילתו לאחרי התפילה תהיה אכילה כשל אדם שהתפלל. זהו דבר פשוט ואבי לא האריך בזה. המעלה בזה היא, שתפילתו חודרת לכל ענינו בכל היום, אכן הוא מתעסק בענינים שהוא צריך להתעסק איתם, אבל בכל עניניו הוא מחדיר את התפילה, וזה מעורר אותו לתפילת המנחה, ולאחר מכן בתפילת ערבית כשנהיה חשוך, הוא חושב על כך שלא רק חשוך ברחוב, אלא חשוך גם אצלו בלב וריק בראש, ועם התבוננות זו הוא מתחיל לומר \"והוא רחום יכפר\", שהרחמים שמגיעים מסדר השתלשלות לא מספיקים, אלא שכאשר \"והוא\" רחום, ש\"והוא\" זה עצמות, דהיינו שממשיכים רחמים מעצמות א\"ס, אז מתחיל להיות מואר אצלו, איפה זה מאיר אצלו - בקריאת שמע שעל המיטה, ואז כשישן אינו ישן כשוטה וכו'.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FShabbos_Chol_HaMoed_Pesach_5706.pdf&title=%D7%A9%D7%91%D7%AA+%D7%97%D7%95%D7%94%22%D7%9E+%D7%A4%D7%A1%D7%97+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "תפילה", "desc": "היום שוכחים", "page": 28, "sichah": "שבת חוה\"מ פסח תש\"ו", "excerpt": "היום, כשקמים בבוקר, מתחילים למהר, אנו צריכים, אנו צריכים ללכת לשם, אנו צריכים את זה, צריכים לעזור לריבונו של עולם, ועל עבודת התפילה שוכחים.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FShabbos_Chol_HaMoed_Pesach_5706.pdf&title=%D7%A9%D7%91%D7%AA+%D7%97%D7%95%D7%94%22%D7%9E+%D7%A4%D7%A1%D7%97+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "תפילה", "desc": "אדנ\"ע הי' מאריך בת. ונשאר בלי כוחות, לעורר התמימים בעניין", "page": 43, "sichah": "עש\"ק פ' שופטים, כ\"ו מנחם־אב תש\"ו", "excerpt": "כשהי' כ\"ק אאמו\"ר בגיל 17 או 18 שנה, הי' מאריך ביותר בתפילה, ואחר התפילה הוא היה נשאר ללא כוחות, ואמר המלמד שלו ר' שלום לכ\"ק אאזמו\"ר מוהר\"ש שצריכים לראות שיקצר בתפילה. ענה לו על זה כ\"ק אאזמו\"ר מוהר\"ש, מה אני יכול לומר לו, הוא - כ\"ק אאמו\"ר - בתפילתו מרגיש האמת, הגוף שלו מרגיש את האמת, שגופו כלי לאמת. והרבנית הזקנה מרת רבקה, סיפרה זאת לכ\"ק אדמו\"ר שליט\"א, ואמרה, שמאז ששמעה את מילים אלו מכ\"ק אאזמו\"ר מוהר\"ש, היא התנהגה אליו - כ\"ק אאמו\"ר - בדרך־ארץ שונה.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FErev_ "sources": [{"s": "יום ב' דחג השבועות תש\"ו", "u": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FYom_Beis_Shavuos_5706.pdf&title=%D7%99%D7%95%D7%9D+%D7%91%27+%D7%93%D7%97%D7%92+%D7%94%D7%A9%D7%91%D7%95%D7%A2%D7%95%D7%AA+%D7%AA%D7%A9%22%D7%95"}]}];
const TAG = { n: "שם", m: "מקום" };
const HKEY = "mafteach-history";

const results = document.getElementById('results');
const q = document.getElementById('q');
const countEl = document.getElementById('count');
const historyEl = document.getElementById('history');
const clearEl = document.getElementById('clear');

// ---- נרמול: הסרת ניקוד, גרשיים, מקף, פיסוק, ואיחוד אותיות סופיות ----
function normalize(s){
  return String(s)
    .replace(/[֑-ׇ]/g, '')
    .replace(/[׳״'"‘’“”]/g, '')
    .replace(/[‎‏]/g, '')
    .replace(/[־–—-]/g, '')
    .replace(/[.,:;!?()\[\]\/]/g, '')
    .replace(/ך/g,'כ').replace(/ם/g,'מ').replace(/ן/g,'נ').replace(/ף/g,'פ').replace(/ץ/g,'צ')
    .replace(/\s+/g, ' ').trim();
}
const NS = s => s.replace(/ /g,'');
for(const e of DATA){
  e._t = normalize(e.topic); e._tNS = NS(e._t); e._tw = e._t.split(' ').filter(Boolean).map(NS);
  e._c = e.clar ? normalize(e.clar) : '';
  e._d = e.desc ? normalize(e.desc) : '';
  e._e = e.excerpt ? normalize(e.excerpt) : '';
}
function subseq(needle, hay){ if(!needle) return false; let i=0; for(let j=0;j<hay.length&&i<needle.length;j++){ if(hay[j]===needle[i]) i++; } return i===needle.length; }
function editDist(a,b,max){
  const m=a.length,n=b.length; if(Math.abs(m-n)>max) return max+1;
  let prev=[]; for(let j=0;j<=n;j++) prev[j]=j;
  for(let i=1;i<=m;i++){ let cur=[i],best=i;
    for(let j=1;j<=n;j++){ const c=a[i-1]===b[j-1]?0:1; const v=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+c); cur[j]=v; if(v<best)best=v; }
    if(best>max) return max+1; prev=cur; }
  return prev[n];
}
// דירוג: התאמה מפורשת (מחרוזת) בערך או בציטוט. סבילות כתיב רק על שם הערך.
function scoreEntry(e, nq, nqNS){
  const idx = e._t.indexOf(nq);
  if(idx===0) return 6;
  if(idx>0)  return 5;
  const near = w => subseq(nqNS, w) && w.length >= nqNS.length && (w.length - nqNS.length) <= 2;
  if(e._tw.some(near) || near(e._tNS)) return 4;      // כתיב חסר בשם הערך
  const tol = nqNS.length>=6 ? 2 : (nqNS.length>=4 ? 1 : 0);
  if(tol>0 && (e._tw.some(w=>editDist(nqNS,w,tol)<=tol) || editDist(nqNS,e._tNS,tol)<=tol)) return 3; // שגיאת כתיב בשם
  if(e._c && e._c.indexOf(nq)>=0) return 2.5;          // הבהרה (שמות)
  if(e._d && e._d.indexOf(nq)>=0) return 2;            // תיאור — מפורש
  if(e._e && e._e.indexOf(nq)>=0) return 1;            // ציטוט — מפורש
  return 0;
}

function esc(s){ return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function hl(text, term){
  if(!term) return esc(text);
  const t = esc(text);
  try{ const re = new RegExp('('+term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'); return t.replace(re, '<mark>$1</mark>'); }
  catch(e){ return t; }
}

// ---- היסטוריית חיפושים (רק חיפושים שהחזירו תוצאות) ----
function loadHist(){ try{ return JSON.parse(localStorage.getItem(HKEY) || '[]'); }catch(_){ return []; } }
function saveHist(h){ try{ localStorage.setItem(HKEY, JSON.stringify(h)); }catch(_){ } }
function storeHist(name, isAuto){
  name = (name||'').trim(); if(!name) return;
  let h = loadHist().filter(x => x !== name && (isAuto ? x !== lastAuto : true));
  h.unshift(name);
  saveHist(h.slice(0,5));
  lastAuto = isAuto ? name : null;
  if(!q.value.trim()) renderHistory();
}
function renderHistory(){
  const h = loadHist();
  if(!h.length){ historyEl.innerHTML=''; return; }
  historyEl.innerHTML =
    '<div class="hist-title">חיפושים אחרונים</div>'+
    '<div class="hist-chips">'+ h.map(x => '<span class="chip" data-t="'+esc(x)+'">'+esc(x)+'</span>').join('') +'</div>';
  historyEl.querySelectorAll('.chip').forEach(c => c.addEventListener('click', ()=>{ q.value=c.dataset.t; render(); q.focus(); }));
}

function cardContent(r, tt){
  return '<div class="sicha result" data-topic="'+esc(r.topic)+'"><div class="sicha-info">'+
      '<div class="topic-line"><h3>'+hl(r.topic, tt)+'</h3></div>'+
      '<p>'+hl(r.desc, tt)+'</p>'+
      (r.excerpt ? '<div class="excerpt">'+hl(r.excerpt, tt)+'</div>' : '')+
      '<div class="meta-line"><span class="pages">עמוד '+r.page+'</span></div>'+
    '</div><div class="btns"><a class="btn btn-navy btn-sm" href="'+r.url+'" target="_blank" rel="noopener">'+esc(r.sichah)+'</a></div></div>';
}
function cardRef(r, tt){
  const clar = r.clar ? ' <span class="clar">('+hl(r.clar, tt)+')</span>' : '';
  const tag = TAG[r.t] ? ' <span class="tag">'+TAG[r.t]+'</span>' : '';
  const btns = r.sources.map(s => '<a class="btn btn-navy btn-sm" href="'+s.u+'" target="_blank" rel="noopener">'+esc(s.s)+'</a>').join('');
  return '<div class="sicha result" data-topic="'+esc(r.topic)+'"><div class="sicha-info">'+
      '<div class="topic-line"><h3>'+hl(r.topic, tt)+'</h3>'+clar+tag+'</div>'+
      '<div class="src-btns">'+btns+'</div>'+
    '</div></div>';
}

let saveTimer = null, lastAuto = null;
function render(){
  const raw = q.value.trim();
  clearEl.style.display = raw ? 'block' : 'none';
  if(!raw){ clearTimeout(saveTimer); lastAuto=null; results.innerHTML=''; countEl.textContent=''; renderHistory(); return; }
  historyEl.innerHTML='';
  const nq = normalize(raw), nqNS = NS(nq);
  if(!nq){ results.innerHTML=''; countEl.textContent=''; return; }
  let scored = [];
  for(const e of DATA){ const sc = scoreEntry(e, nq, nqNS); if(sc>0) scored.push({ e, sc }); }
  // אם יש התאמה בשם/תיאור הערך (דירוג 2 ומעלה) — מציגים רק אותן, בלי התאמות ציטוט בלבד (דירוג 1).
  // חיפוש בתוך הציטוט נשאר כברירת מחדל רק כשאין אף ערך שמתאים לשם/תיאור.
  if(scored.some(x => x.sc >= 2)) scored = scored.filter(x => x.sc >= 2);
  scored.sort((a,b) => b.sc - a.sc);
  const rows = scored.map(x => x.e);
  countEl.textContent = rows.length ? (rows.length + (rows.length===1 ? ' תוצאה' : ' תוצאות')) : 'לא נמצאו תוצאות';
  results.innerHTML = rows.map(r => ('sources' in r) ? cardRef(r, raw) : cardContent(r, raw)).join('');
  // שמירה אוטומטית של הערך הראשון של התוצאה, לאחר שההקלדה נעצרת — ומחליפה את מה שנשמר קודם באותו חיפוש
  clearTimeout(saveTimer);
  if(rows.length){ const topName = rows[0].topic; saveTimer = setTimeout(()=>storeHist(topName, true), 700); }
}

q.addEventListener('input', render);
results.addEventListener('click', e => {   // לחיצה על תוצאה — שומרת מיד את הערך שנבחר
  if(e.target.closest('a.btn')){ const card = e.target.closest('.result'); if(card && card.dataset.topic) storeHist(card.dataset.topic, false); }
});
clearEl.addEventListener('click', ()=>{ q.value=''; q.focus(); render(); });
renderHistory();
if(!matchMedia('(max-width: 640px)').matches) q.focus();
</script>
<script src="nav.js"></script>
<script src="morenav.js" defer></script>
<script src="install.js" defer></script>
</body>
