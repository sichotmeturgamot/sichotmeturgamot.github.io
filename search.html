const DATA = [{"t": "i", "topic": "אהבת ה'", "desc": "ג' דרגות", "page": 2, "sichah": "ליל א' דחג הסוכות תש\"ו", "excerpt": "לפני הבר־מצוה קרא לו אדמו\"ר הזקן ואמר לו: באהבת השם ישנם שלושה אופני אהבה: בכל לבבך, בכל נפשך ובכל מאדך. בכל לבבך יש לכל היהודים; בכל נפשך יש למביני מדע; ובכל מאדך יש לאלו שיש להם מסירות נפש בהקניית מידה טובה אצל יהודים.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Alef_Sukkos_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%90%27+%D7%93%D7%97%D7%92+%D7%94%D7%A1%D7%95%D7%9B%D7%95%D7%AA+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "אהבת ישראל", "desc": "מסכת אהב\"י אצל הבעש\"ט, הבעש\"ט הנחיל אהב\"י", "page": 30, "sichah": "ליל אחרון של פסח תש\"ו", "excerpt": "א. כשאדמו\"ר הזקן חזר לראשונה לוויטעבסק ממעזריטש, הוא סיפר מה ששמע מהמגיד ממעזריטש, שאצל הבעש\"ט מסכת אהבת ישראל הכילה כמה מאות פרקים. אצל אברהם אבינו מסכת ע\"ז הכילה ד' מאות פרקים, ואצל הבעש\"ט מסכת אהבת ישראל הכילה כמה מאות פרקים. אברהם אבינו הנחיל לעם ישראל את אהבת המקום - אהבת השי\"ת, והבעש\"ט הנחיל להיהודים אהבת ישראל, לאהוב יהודי כי הוא יהודי. כשיהודי נמצא בקצה העולם, כזה שהוא כלל לא מכירו, רק הקב\"ה יודע ממנו והוא יודע על הקב\"ה - צריך לאהוב אותו.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2F21_Leil_Acharon_shel_Pesach_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%90%D7%97%D7%A8%D7%95%D7%9F+%D7%A9%D7%9C+%D7%A4%D7%A1%D7%97+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "אהבת ישראל", "desc": "חסי' פעלה אהב\"י", "page": 37, "sichah": "יום ב' דחג השבועות תש\"ו", "excerpt": "אדמו\"ר הזקן ענה שהוא קיבל במעזריטש, מהו הקב\"ה ומהו יהודי, היוקר של היהודים אצל הקב\"ה והיוקר של הקב\"ה אצל היהודים. לפני\"ז גם כן היה אהבת ישראל אבל זה היה מצד יוקר התורה, אהבו יהודי מצד ידיעתו בתורה, ממילא היו שני דברים נפרדים: היהודי וידיעתו בתורה. חסידות פעלה אהבת ישראל - לאהוב יהודי כי הוא יהודי. במתן תורה הקב\"ה בחר ביהודים, עם סגולה לה' אלקיך, וזו היתה בחירה ביהודים מצד העצם, בגלל זה שהם יהודים, וכך צריכה להיות האהבת ישראל - לאהוב מצד זה שהוא יהודי.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FYom_Beis_Shavuos_5706.pdf&title=%D7%99%D7%95%D7%9D+%D7%91%27+%D7%93%D7%97%D7%92+%D7%94%D7%A9%D7%91%D7%95%D7%A2%D7%95%D7%AA+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "אהבת ישראל", "desc": "לאהוב יהודי כי הוא יהודי, אהב\"י לפני אהבת ה'", "page": 38, "sichah": "יום ב' דחג השבועות תש\"ו", "excerpt": "אדמו\"ר הזקן ענה שהוא קיבל במעזריטש, מהו הקב\"ה ומהו יהודי, היוקר של היהודים אצל הקב\"ה והיוקר של הקב\"ה אצל היהודים. לפני\"ז גם כן היה אהבת ישראל אבל זה היה מצד יוקר התורה, אהבו יהודי מצד ידיעתו בתורה, ממילא היו שני דברים נפרדים: היהודי וידיעתו בתורה. חסידות פעלה אהבת ישראל - לאהוב יהודי כי הוא יהודי. במתן תורה הקב\"ה בחר ביהודים, עם סגולה לה' אלקיך, וזו היתה בחירה ביהודים מצד העצם, בגלל זה שהם יהודים, וכך צריכה להיות האהבת ישראל - לאהוב מצד זה שהוא יהודי.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FYom_Beis_Shavuos_5706.pdf&title=%D7%99%D7%95%D7%9D+%D7%91%27+%D7%93%D7%97%D7%92+%D7%94%D7%A9%D7%91%D7%95%D7%A2%D7%95%D7%AA+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "אור", "desc": "אדנ\"ע הי' צוחק ומחייך כשראה אור", "page": 11, "sichah": "ליל ש\"פ וירא, כ' מר־חשון תש\"ו", "excerpt": "ב. אאמו\"ר נ\"ע לא היה בוכה הרבה, והוא היה מחייך, כשהוא היה רואה אור הוא היה צוחק ומחייך. וסיפרה זאת הרבנית רבקה לאדמו\"ר מוהר\"ש ואמרה: הוא חסיד מלידה, בעל־ביטול (אַ ביטול'דיקער). וסיפר מהר\"ש לאדמו\"ר הצ\"צ, ואמר: היא טועה, הוא לא חסיד מלידה אלא רבי מלידה.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Shabbos_Vayeira_20_MarCheshvan_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%A9%22%D7%A4+%D7%95%D7%99%D7%A8%D7%90%2C+%D7%9B%27+%D7%9E%D7%A8%D6%BE%D7%97%D7%A9%D7%95%D7%9F+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "אור", "desc": "הבעש\"ט אהב אור", "page": 30, "sichah": "ליל אחרון של פסח תש\"ו", "excerpt": "הסיפור של ה\"נרות\"־קרח הוא כזה: הבעש\"ט מאד אהב אור, הוא אהב אור וחום, אפילו בקיץ הוא היה מצווה להסיק את התנור שיהיה חם ועוד יותר חם, ואהב מאד שיהיה מואר.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2F21_Leil_Acharon_shel_Pesach_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%90%D7%97%D7%A8%D7%95%D7%9F+%D7%A9%D7%9C+%D7%A4%D7%A1%D7%97+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "אורות וכלים", "desc": "אצל ר' אייזיק ואצל הצ\"צ", "page": 19, "sichah": "פורים תש\"ו", "excerpt": "וכמעשה הידוע מר' אייזיק עם הצ\"צ במאמר על שלשה דברים העולם עומד שאמר הצ\"צ בתחילת קבלת הנשיאות, אותו המאמר ששמע מאדמו\"ר הזקן כשהיה ילד, כידוע שהלך אז הצ\"צ לבקר את הרב אייזיל, ויהב לי' ידי' ואוקמי', ואמר לו אז הפירוש על זה בקבלה. ואמר אז אח\"כ ר' אייזיק: חמישים שנה התייגעתי בחסידות, ולא הגעתי אפילו לא כאצבע קטנה; אצלנו האורות הם במתנה והכלים אינם מזוככים, אצלו האורות הם עצמיים והכלים מזוככים.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FPurim_5706.pdf&title=%D7%A4%D7%95%D7%A8%D7%99%D7%9D+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "אזן", "desc": "לשמוע מה וכיצד מספרים", "page": 1, "sichah": "ליל א' דחג הסוכות תש\"ו", "excerpt": "ד. 'אוזן שומעת' היא זו ששומעת מה שמספרים, אבל \"אזן מלין תבחן\" היא זו שקולטת כיצד מספרים. ההבדל בין לשמוע מה מספרים לבין לשמוע כיצד מספרים הוא, שבשמיעה מה מספרים שומעים את גוף הסיפור, אבל בשמיעה כיצד מספרים שומעים את הנשמה של הסיפור. כדי שתהיה 'אזן שומעת' צריך גם שיהיה ריבוי יגיעה ובפרט כדי שתהיה \"אזן מלין תבחן\" צריך רצון פנימי ועונג בכך שמתייגעים לקלוט מה ששומעים.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Alef_Sukkos_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%90%27+%D7%93%D7%97%D7%92+%D7%94%D7%A1%D7%95%D7%9B%D7%95%D7%AA+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "אמרות", "desc": "צריך לשמר, מחי'", "page": 17, "sichah": "ליל ש\"פ וישב, כ\"ו כסלו, שבת חנוכה תש\"ו", "excerpt": "יד. את אמרות אלו, ולא רק את אמרות אלו - יש לשמר. אמרה מחי' ממש.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Shabbos_Vayeishev_26_Kislev_Chanukah_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%A9%22%D7%A4+%D7%95%D7%99%D7%A9%D7%91%2C+%D7%9B%22%D7%95+%D7%9B%D7%A1%D7%9C%D7%95%2C+%D7%A9%D7%91%D7%AA+%D7%97%D7%A0%D7%95%D7%9B%D7%94+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "אמריקא", "desc": "מקום מנוחה, חיי הגשם של א", "page": 23, "sichah": "יום א' דחג הפסח תש\"ו", "excerpt": "ב\"ה, לנו באמריקא כבר יש מקום מנוחה, אמנם ישנו ה'הו־האַ' של חיי הגשם האמריקאיים, הרעש וכו', אבל ב\"ה כבר יש לנו מקום מנוחה, אבל אסור לנו להסתפק בזאת, עכשיו צריך להתחיל לפעול. ע\"ד שכתוב אחרי המבול ש\"ולא מצאה היונה מנוח לכף רגלה\", לכאורה - כיצד יכול להיות מנוחה לכף הרגל, לכאורה המנוחה מגיעה מהתענוג, גילוי עצם הנפש, א\"כ כיצד יכול להיות לעקב מנוחה? אלא הענין הוא שכל הכוונה במנוחה היא שהמנוחה תרד עד לכף הרגל היינו שתרד לבפועל ממש. מעלת הרגל היא הרי שהיא מעמידה את כל הציור־אדם, בלי הרגל אפשר ליפול ולהכשל, אבל ע\"י הרגל ציור האדם הוא על מקומו, אבל הכוונה היא להוריד את מדריגת המנוחה לכף הרגל, למדריגה הנמוכה ביותר דהיינו למעשה בפועל ממש, וזאת היא מנוחה ורגיעה.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FYom_Alef_Pesach_5706.pdf&title=%D7%99%D7%95%D7%9D+%D7%90%27+%D7%93%D7%97%D7%92+%D7%94%D7%A4%D7%A1%D7%97+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "אמריקא", "desc": "יהודי א. - מעלתם", "page": 34, "sichah": "ליל א' דחג השבועות תש\"ו", "excerpt": "ד. למרות זאת יש ליהודים המקומיים הרבה מעלות, הדרך־ארץ הפנימי שיש להם כלפי בן תורה, והם חובבי תורה ואינם מתביישים בזאת, אדרבא הם מייחסים עצמם בזה, והם מקרבים בני תורה עם דרך־ארץ פנימי, אמת הם מרגישים ובשקר הם מבחינים. לבני תורה בכלל ותלמידי התמימים בפרט יש הרבה לפעול בלהכניס אור, אמנם ב\"ה כבר פעלו הרבה, אבל זה כלל לא מגיע למה שיכלו לפעול, זה לגמרי באין ערוך.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Alef_Shavuos_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%90%27+%D7%93%D7%97%D7%92+%D7%94%D7%A9%D7%91%D7%95%D7%A2%D7%95%D7%AA+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "אמריקא", "desc": "יהודי א. - מעלתם", "page": 38, "sichah": "יום ב' דחג השבועות תש\"ו", "excerpt": "ו. אני לא רוצה להתבטא שיש לי הסתכלות מוארת (ליכטיקע אויגען), אלא שהתעמקנו בתוך של יהודי המקום. פעם חשבנו שכבר אי אפשר לפעול כלום עם יהודי המקום, האמת היא לא כזו, אצל יהודי המקום יש תמימות ודרך־ארץ פנימית כלפי אמת. כשמדברים איתם על שמירת השבת - זה תופס אותם והם מתנצלים שזה מצד עניני הפרנסה.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FYom_Beis_Shavuos_5706.pdf&title=%D7%99%D7%95%D7%9D+%D7%91%27+%D7%93%D7%97%D7%92+%D7%94%D7%A9%D7%91%D7%95%D7%A2%D7%95%D7%AA+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "אמריקא", "desc": "יהודי א. - מעלתם", "page": 40, "sichah": "י\"ב תמוז תש\"ו", "excerpt": "כעת צריכים לעשות במדינה זו ליובאוויטש. צריך שתהיה אריכות ימים אבל צריך לייקר כל רגע. לאנשים בני המקום יש מעלות נשגבות מעלות נפלאות, אבל הם חושבים שאמריקה שונה. התלמידים שמגיעים כעת לכאן למדינה זו צריכים לדעת את עבודתם כאן. הם לא צריכים לרצות להתבדל בסביבה שונה אלא אדרבא לקרב אחרים. לא צריכים להיות בהרמת רוח, לחוש עצמך כמנהיג וכו', אילו שלא יודעים את שפת המדינה לא צריכים לרצות לדעת אותו. מילא המקומיים שיודעים את שפת המדינה צריכים לנצל זאת כדי לקרב ילדים יהודים ולהשפיע עליהם. התלמידים שמגיעים לכאן עכשיו, עבודתם צריכה להיות לעשות כאן ליובאוויטש. כן! צריך שיהיה ד' אמות שלנו (אייגענע ד' אמות), אבל כבר דיברנו בעבר, ד' אמות אינם רק ד' אמות אלא הם יכולים להיות אלפי וויאָרסט.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2F12_Tammuz_5706.pdf&title=%D7%99%22%D7%91+%D7%AA%D7%9E%D7%95%D7%96+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "אנושיות (מענטשלעכקייט)", "desc": "פעם", "page": 9, "sichah": "ליל ש\"פ לך", "excerpt": "פעם האנושיות (מענטשליכקייט) בכלל היתה אחרת, ובפרט בעיירות הקטנות, ואצל חסיד בפרטי פרטיות. אצל החסידים הראשונים הייתה הזריעה והם אכן קלטו. הם קלטו את הנקודה, היה \"תן לחכם ויחכם עוד\", הם קלטו את הנקודה.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Shabbos_Lech_Lecha_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%A9%22%D7%A4+%D7%9C%D7%9A"}, {"t": "i", "topic": "אסיפות רבנים", "desc": "מאורע עם מהר\"ש", "page": 17, "sichah": "ליל ש\"פ וישב, כ\"ו כסלו, שבת חנוכה תש\"ו", "excerpt": "יב. באחת האספות שהתאספו בפטרבּורג הוד כ\"ק אאזמו\"ר הרה\"ק מוהר\"ש אמר לאחד הרבנים: גם לעשיו קראו 'הרב'. הוא אמר לו זאת ברבים.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Shabbos_Vayeishev_26_Kislev_Chanukah_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%A9%22%D7%A4+%D7%95%D7%99%D7%A9%D7%91%2C+%D7%9B%22%D7%95+%D7%9B%D7%A1%D7%9C%D7%95%2C+%D7%A9%D7%91%D7%AA+%D7%97%D7%A0%D7%95%D7%9B%D7%94+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "ביטול", "desc": "של עבד ושר", "page": 4, "sichah": "ליל שמיני עצרת תש\"ו", "excerpt": "א. בחיים של 'עבודה' יש הפרש בין העבודה של שמיני עצרת לעבודה של שמחת תורה, וההפרש הוא: שמיני עצרת הוא כמו מלך בהיכלו, שלא כולם יכולים להכנס להיכל המלך, וכשכן נכנסים להיכל המלך אפילו השר מתבטל כמו (\"אזוי ווי\") עבד. ביטולו של השר אינו יותר מאשר \"כמו\" ביטולו של העבד. כשאומרים \"ווי\" הכוונה - כמו זהו עדיין לא ביטול בכל עצמותו. לשר יש שכל, לעבד אין שום שכל משלו, המלך נותן לו את שכלו. הביטול של העבד והשכל של המלך הם צמד נאה. וזה ההפרש בין אם מתחילים את העבודה בקבלת עול ואחר כך מבינים, לבין אם מתחילים בהבנה ולאחר מכן עושים. ההפרש מובן לכל.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Shmini_Atzeres_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%A9%D7%9E%D7%99%D7%A0%D7%99+%D7%A2%D7%A6%D7%A8%D7%AA+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "ביטול", "desc": "אדנ\"ע בעל־ביטול", "page": 11, "sichah": "ליל ש\"פ וירא, כ' מר־חשון תש\"ו", "excerpt": "ד. כ\"ק אדמו\"ר נ\"ע היה בשברון־לב (א צובראָכענער) בטִבעו. אך הי' זה בתוכו, וכלפי חוץ לא היה ניכר הדבר. הוא לא רצה שיהיה ניכר כלפי חוץ. ה. כ\"ק אאמו\"ר נ\"ע היה מייקר את הזולת בהפלאה. ובהפלאה כזו בדיוק הוא הי' דורש מעצמו, ממש כמו אחד שעדיין כלל לא התחיל (את העבודה).", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Shabbos_Vayeira_20_MarCheshvan_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%A9%22%D7%A4+%D7%95%D7%99%D7%A8%D7%90%2C+%D7%9B%27+%D7%9E%D7%A8%D6%BE%D7%97%D7%A9%D7%95%D7%9F+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "בית המקדש", "desc": "ר' אייזיק קיבל אצל הרבי הגילוים כמו בביהמ\"ק", "page": 19, "sichah": "פורים תש\"ו", "excerpt": "ד. כידוע ר' אייזיק היה גאון גדול, וגאונותו הייתה ידועה לא רק בוויטעבסק ובמינסק אלא חזרו תורה שלו גם בווילנא, ובפעם הראשונה שהוא חזר מליאָזנא שאלו אותו: מה שמעת שם, הרי יש לך כבר הרבה תורה. והשיב להם: שמעתי רק מעט אבל ראיתי המון, ראיתי את אור התורה, הגילויים כמו שהיו בביהמ\"ק. ושאלו אותו: כיצד יכולים לראות את אור התורה? והשיב להם: כתוב בזהר שיש עינין סתימין ואזנין אטומים ולכן לא רואים ולא שומעים, כשיש עיניים שאינם עוורות ואזנים שאינם חרשות - יכולים לשמוע ולראות כעין האור בבית המקדש.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FPurim_5706.pdf&title=%D7%A4%D7%95%D7%A8%D7%99%D7%9D+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "בית הכנסת", "desc": "חסידי", "page": 44, "sichah": "ה' אלול תש\"ו", "excerpt": "אכן, צריך כוחות בגשמיות. (וסיפר): מלפנים היתה כל עיר ועיר נחשבת לפי מספר הבתי־כנסיות ובתי־מדרשות של החסידים אשר בעיר. היינו שעיר שהיו בה שתיים או שלוש בתי־כנסיות של אנ\"ש היתה נחשבת עיר קטנה ואם היו בה ארבע או חמש בתי־כנסיות של החסידים היתה נחשבת לעיר גדולה. כאשר נכנסו לביהכנ\"ס שמעו כיצד זה אומר 'ברוך שאמר והיה העולם' בנעימות, והשני אומר פסוקי דזמרה וברכת יוצר אור בהתלהבות. בכלל, שבת־קודש היתה אצלם יום המנוחה. בימי השבוע היה כל אחד, בעל־עסק או מלמד וכד', עסוק בענינו, אבל שבת־קודש הוא הרי יום המנוחה. ובכן, המתינו עד אחרי התפילה, כלומר ששמעו את כל התפילה, ענו את כל האמן'ס, שמעו את קריאת התורה עד סיום התפילה ואחרי הכל התחילו להתבונן עם מה מתפללים ועם מי מתפללים. כך שמעתי מכ\"ק אאמו\"ר בב' הנוסחות וכבר רשום אצלי ביאורים וחילוקים בין ב' ענינים הללו בענינים יסודיים וסיפורי ענינים באריכות בזה.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2F5_Elul_5706.pdf&title=%D7%94%27+%D7%90%D7%9C%D7%95%D7%9C+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "בכי'", "desc": "של הרג\"ד היתה פנימית", "page": 6, "sichah": "ש\"פ נח בסעודת הלילה", "excerpt": "א. (הי' יאצ\"ט של הרג\"ד פּאַהאַרער). תרנ\"ב בעת חתונת ר\"מ האָרענשטיין הי' אז הרג\"ד בליובאַוויטש, א\"ל כ\"ק אאמו\"ר נ\"ע שאבקר אצלו ואסתכל במנהגיו ואשמע מה שיספר לי.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Shabbos_Noach_5706.pdf&title=%D7%A9%22%D7%A4+%D7%A0%D7%97+%D7%91%D7%A1%D7%A2%D7%95%D7%93%D7%AA+%D7%94%D7%9C%D7%99%D7%9C%D7%94"}, {"t": "i", "topic": "בריאות", "desc": "צ\"ל גוף בריא", "page": 42, "sichah": "עש\"ק פ' שופטים, כ\"ו מנחם־אב תש\"ו", "excerpt": "והמשיך דיבורו הק': צריכים להיות בריאים בבריאות הגוף, גוף בריא. כ\"ק אאמו\"ר אמר פעם, שחכמה דאצילות מקנא בנשמה בזה שיורדת ומחי' גוף בריא; אמנם חכמה דאצילות יכולה להשיג, אבל לא יכול להיות לה מה שיש לנשמה על ידי ירידתה בגוף. ובִקשני למסור פ\"ש לתלמידים, דרישת־שלום של אלול (אלול'דיקן). צריך שתלמידי התמימים משאַנחאי ישפיעו על תלמידי התמימים המקומיים, שילמדו חסידות כפי שצריך ללמוד.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FErev_Shabbos_Shoftim_26_Menachem_Av_5706.pdf&title=%D7%A2%D7%A9%22%D7%A7+%D7%A4%27+%D7%A9%D7%95%D7%A4%D7%98%D7%99%D7%9D%2C+%D7%9B%22%D7%95+%D7%9E%D7%A0%D7%97%D7%9D%D6%BE%D7%90%D7%91+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "ברכה", "desc": "טעות בב. אצל אדנ\"ע", "page": 12, "sichah": "ליל ש\"פ וירא, כ' מר־חשון תש\"ו", "excerpt": "כשהי' בן שלוש או ארבע, שאל פעם את אחותו דבורה לאה איזה ברכה לעשות על איזה מאכל, ואח\"כ נודע לו שהי' טעות, ובכה ואמר כי ישאל את אביו תיקון על זאת, וצחקה אחותו ואמרה שזה דבר פעוט, ואמר: זה כלל לא דבר פעוט, ומאז לא דיבר עמה.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Shabbos_Vayeira_20_MarCheshvan_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%A9%22%D7%A4+%D7%95%D7%99%D7%A8%D7%90%2C+%D7%9B%27+%D7%9E%D7%A8%D6%BE%D7%97%D7%A9%D7%95%D7%9F+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "ברכה", "desc": "ברכת המגיד לאדה\"ז - הארת חבד והצלחה בכמה ענינים", "page": 16, "sichah": "כ' כסלו תש\"ו", "excerpt": "מנהגם של מורנו הבעש\"ט והרב המגיד בזמן נשיאותם של כל אחד מהם הי', שאת ספירת העומר היו סופרים כעובר לפני התיבה בבית הכנסת. כשהרב המגיד ספר את ספירת העומר במנין לפני התיבה בתפילת ערבית, ליל התקדש הוד שבהוד, אדמו\"ר הזקן הרגיש את הגילוי חב\"ד שבנפשו. ומאז והלאה רבינו הזקן ראה במוחש את קיום תפילתו וברכתו של הרב המגיד - \"אל הוי' ויאר לנו\"; ותפילתו וברכתו של הרב המגיד שאצלו, אצל אדמו\"ר הזקן, יאיר חב\"ד שבנפשו בהתגלות בהצלחה מופלגה בזמן במחשבה ובכתיבה בסגנון קצר המחזיק את המרובה.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2F20_Kislev_5706.pdf&title=%D7%9B%27+%D7%9B%D7%A1%D7%9C%D7%95+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "ברכה", "desc": "הבעש\"ט הי' אומר כל יום ב. שיהודים יהיו בריאים בגו\"ר", "page": 38, "sichah": "יום ב' דחג השבועות תש\"ו", "excerpt": "הבעש\"ט היה אומר כל יום ברכה - שיהודים יהיו בריאים בגוף כפשוטו. וזהו אהבת ישראל עפ\"י חסידות.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FYom_Beis_Shavuos_5706.pdf&title=%D7%99%D7%95%D7%9D+%D7%91%27+%D7%93%D7%97%D7%92+%D7%94%D7%A9%D7%91%D7%95%D7%A2%D7%95%D7%AA+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "גאון", "desc": "אדה\"ז בגיל 13, בוויטבסק ידעו", "page": 17, "sichah": "פורים תש\"ו", "excerpt": "א. כשאדמו\"ר הזקן הגיע לוויטעבסק כבר החזיקו ממנו לגאון, ידוע שכבר בגיל 13 אדמו\"ר הזקן היה גאון.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FPurim_5706.pdf&title=%D7%A4%D7%95%D7%A8%D7%99%D7%9D+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "גביר", "desc": "לא נהנה ממה שיש לו", "page": 32, "sichah": "ליל אחרון של פסח תש\"ו", "excerpt": "ד. הקבצן תמיד עסוק בקבצנות ואינו יכול ליהנות כלל ממה שיש לו, הוא צריך תמיד לקבץ, וצריך לדאוג תמיד שיהיה ניכר בפניו שהוא קבצן, כי אם לא - לא יתנו לו, ואינו יכול ליהנות ממה שכן יש לו. כמו\"כ אצל גביר: עשיר שנותן אינו יכול ליהנות מעשירותו מאחר וחסר אצל הזולת, ואילו הגביר  שאינו נוהג לתת, אינו יכול ליהנות מעשירותו משום שמבקשים ממנו בכל עת.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2F21_Leil_Acharon_shel_Pesach_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%90%D7%97%D7%A8%D7%95%D7%9F+%D7%A9%D7%9C+%D7%A4%D7%A1%D7%97+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "גלות", "desc": "אדה\"ז קיבל הסדר של ג. מצרים", "page": 24, "sichah": "סדר השני של חג הפסח תש\"ו", "excerpt": "כשאדמו\"ר הזקן חזר לראשונה ממעזריטש, שאלו אותו מה הוא קיבל בפסח והוא ענה, שבמעזריטש הוא קיבל - מהו כל הסדר של גלות מצרים והגאולה, כוונת הגלות וכוונת הגאולה, שרעיון זה טמון בשלושת המילים: הא לחמא עניא.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FSeder_Sheni_Pesach_5706.pdf&title=%D7%A1%D7%93%D7%A8+%D7%94%D7%A9%D7%A0%D7%99+%D7%A9%D7%9C+%D7%97%D7%92+%D7%94%D7%A4%D7%A1%D7%97+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "גליא דתורה", "desc": "הבנה מחי' ההשכלה", "page": 5, "sichah": "ליל שמחת תורה תש\"ו", "excerpt": "נקודת ההשכלה של הענין הזה הוא: בגליא שבתורה הכוונה בהבנה היא שהמבין מחי' את ההשכלה, ובפנימיות התורה הכוונה של הבנה היא שההשכלה מחי' את הבנתו.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Simchas_Torah_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%A9%D7%9E%D7%97%D7%AA+%D7%AA%D7%95%D7%A8%D7%94+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "גליא דתורה", "desc": "ראב\"ע הי' מונח בו", "page": 24, "sichah": "סדר השני של חג הפסח תש\"ו", "excerpt": "אצל ראב\"ע היה 'ולא זכיתי' - לא האיר 'יציאת מצרים', 'בלילות' - בגלות, מדוע? כי ראב\"ע היה מונח רק בגליא שבתורה, למרות שגם מצד גליא שבתורה יש את ענין הגאולה, אבל זו גאולה גלותית. עד שדרשה בן זומא שזו פנימיות התורה, שפועלת שה'ימי חייך' יהיה כלי ל'כל ימי חייך להביא הלילות', להאיר את הגלות עד לענין של להביא לימות המשיח, לא רק שנדע את כוונת הגלות, אלא שגם כוונת הגאולה תאיר בגלות.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FSeder_Sheni_Pesach_5706.pdf&title=%D7%A1%D7%93%D7%A8+%D7%94%D7%A9%D7%A0%D7%99+%D7%A9%D7%9C+%D7%97%D7%92+%D7%94%D7%A4%D7%A1%D7%97+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "גפרור", "desc": "להצית אש גדולה", "page": 6, "sichah": "ש\"פ נח בסעודת הלילה", "excerpt": "אמר כ\"ק אד\"ש:) מזה מובן גם כן מה שנדבר בחג הסוכות העבר, שעם פתגם חסידות אפשר לחיות שנה שלימה, שזהו כמו גפרור שאיתו אפשר להצית אש גדולה.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Shabbos_Noach_5706.pdf&title=%D7%A9%22%D7%A4+%D7%A0%D7%97+%D7%91%D7%A1%D7%A2%D7%95%D7%93%D7%AA+%D7%94%D7%9C%D7%99%D7%9C%D7%94"}, {"t": "i", "topic": "גשמיות", "desc": "של יהודי זה רוחניות", "page": 14, "sichah": "ש\"פ וישלח, י\"ט כסלו תש\"ו", "excerpt": "ח. היום זה ראש השנה, שהקב\"ה יעזור שזה ימשך (\"נמשך ווערן\"). (ואמר הרש\"ל שי': ומה בנוגע לגשמיות? וענה כ\"ק אדמו\"ר שליט\"א:) גשמיות של יהודי היא רוחניות.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FShabbos_Vayishlach_19_Kislev_5706.pdf&title=%D7%A9%22%D7%A4+%D7%95%D7%99%D7%A9%D7%9C%D7%97%2C+%D7%99%22%D7%98+%D7%9B%D7%A1%D7%9C%D7%95+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "גשמיות", "desc": "צריך כוחות בגשמיות", "page": 43, "sichah": "ה' אלול תש\"ו", "excerpt": "אכן, צריך כוחות בגשמיות. (וסיפר): מלפנים היתה כל עיר ועיר נחשבת לפי מספר הבתי־כנסיות ובתי־מדרשות של החסידים אשר בעיר. היינו שעיר שהיו בה שתיים או שלוש בתי־כנסיות של אנ\"ש היתה נחשבת עיר קטנה ואם היו בה ארבע או חמש בתי־כנסיות של החסידים היתה נחשבת לעיר גדולה.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2F5_Elul_5706.pdf&title=%D7%94%27+%D7%90%D7%9C%D7%95%D7%9C+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "גשמיות", "desc": "צריך כוחות בגשמיות", "page": 44, "sichah": "ה' אלול תש\"ו", "excerpt": "אכן, צריך כוחות בגשמיות. (וסיפר): מלפנים היתה כל עיר ועיר נחשבת לפי מספר הבתי־כנסיות ובתי־מדרשות של החסידים אשר בעיר. היינו שעיר שהיו בה שתיים או שלוש בתי־כנסיות של אנ\"ש היתה נחשבת עיר קטנה ואם היו בה ארבע או חמש בתי־כנסיות של החסידים היתה נחשבת לעיר גדולה.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2F5_Elul_5706.pdf&title=%D7%94%27+%D7%90%D7%9C%D7%95%D7%9C+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "דא\"ח", "desc": "אדנ\"ע - כתיבת ד", "page": 7, "sichah": "ש\"פ נח בסעודת הלילה", "excerpt": "ח. קרה אצל כ\"ק אדנ\"ע שבאמצע כתיבת מאמר דא\"ח - שהיה כותב בכיפה (בלבד) - הי' מפסיק, מניח מטפחת על הכתב, לובש הכובע ומנגן. ואמר: זהו בשביל להגיע לכך שהענין יהי' מונח.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Shabbos_Noach_5706.pdf&title=%D7%A9%22%D7%A4+%D7%A0%D7%97+%D7%91%D7%A1%D7%A2%D7%95%D7%93%D7%AA+%D7%94%D7%9C%D7%99%D7%9C%D7%94"}, {"t": "i", "topic": "דג", "desc": "מסריח מהראש", "page": 14, "sichah": "ש\"פ וישלח, י\"ט כסלו תש\"ו", "excerpt": "ו. רב חסידי מסמיליאַן הגיע לאדמו\"ר המהר\"ש והתלונן על אלו ששומעים ממנו חסידות שהם לא מקשיבים, וזה לא מגיע אצלם לידי פועל. וענה לו אדמו\"ר מוהר\"ש: ומה קורה איתך? כשדג מסריח - הוא מסריח מהראש. הוא היה יהודי חסידי, וזה פעל עליו.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FShabbos_Vayishlach_19_Kislev_5706.pdf&title=%D7%A9%22%D7%A4+%D7%95%D7%99%D7%A9%D7%9C%D7%97%2C+%D7%99%22%D7%98+%D7%9B%D7%A1%D7%9C%D7%95+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "דרך החסידות", "clar": "", "sources": [{"s": "יום א' דחג הסוכות תש\"ו", "u": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FYom_Alef_Sukkos_5706.pdf&title=%D7%99%D7%95%D7%9D+%D7%90%27+%D7%93%D7%97%D7%92+%D7%94%D7%A1%D7%95%D7%9B%D7%95%D7%AA+%D7%AA%D7%A9%22%D7%95"}]}, {"t": "i", "topic": "דרך החסידות", "desc": "עמוק עמוק מי ימצאנו", "page": 6, "sichah": "ליל שמחת תורה תש\"ו", "excerpt": "ה. הוד כ\"ק אאמו\"ר אמר לי ששמע מאביו הוד כ\"ק אאזמו\"ר הרה\"ק, שקיבל רבי מפי רבי, שעל העבודה בדרך החסידות כתוב \"עמוק עמוק מי ימצאנו\". דרך החסידות הוא עומק אין סוף, ואדם שהוא בבחי' 'מי' של עבודה (אַ עבודה'דיקר \"מי\"), נותנים לו מלמעלה על פי הוראת בית דין של מעלה, שהוא יצליח בעבודתו ויהיה בבחי' \"ימצאנו\" (אַז ער זאָל זיין אַ ימצאנו'דיגער).", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Simchas_Torah_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%A9%D7%9E%D7%97%D7%AA+%D7%AA%D7%95%D7%A8%D7%94+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "דרך החסידות", "desc": "אדנ\"ע הדריך את אדמו\"ר הריי\"ץ", "page": 13, "sichah": "ש\"פ וישלח, י\"ט כסלו תש\"ו", "excerpt": "ב. אצלי היום הוא יו\"ט, זה חמישים שנה מאז ששמעתי בשנת תרנ\"ו מאבי - אדמו\"ר הרש\"ב נ\"ע - שאמר על י\"ט כסלו: \"יום זה קרוב להיות ראש השנה\".", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FShabbos_Vayishlach_19_Kislev_5706.pdf&title=%D7%A9%22%D7%A4+%D7%95%D7%99%D7%A9%D7%9C%D7%97%2C+%D7%99%22%D7%98+%D7%9B%D7%A1%D7%9C%D7%95+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "דרך החסידות", "desc": "שיהי' התגברות הצורה על החומר", "page": 39, "sichah": "כ\"א סיון תש\"ו", "excerpt": "זה מה שמלמדת אותנו דרך החסידות, כך הוא אפילו אצל אברכים, ובפרט כאשר נעשים מבוגרים יותר, ובפרט שכאשר נעשים מבוגרים יותר צריכה להיות התגברות הנשמה על החומר. כשמדברים עם הנוער והצעירים, הגם שבהתחלה צריך לדבר עימם בשפתם בהַברה 'הַה בַּה', אבל צריך לדבר עימם עד שילמדו לדבר כמו בן־אדם.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2F21_Sivan_5706.pdf&title=%D7%9B%22%D7%90+%D7%A1%D7%99%D7%95%D7%9F+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "דרכי החסידים", "clar": "", "sources": [{"s": "ליל א' דחג הסוכות תש\"ו", "u": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Alef_Sukkos_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%90%27+%D7%93%D7%97%D7%92+%D7%94%D7%A1%D7%95%D7%9B%D7%95%D7%AA+%D7%AA%D7%A9%22%D7%95"}]}, {"t": "i", "topic": "דרכי החסידים", "desc": "לא לנגן במהירות", "page": 40, "sichah": "י\"ב תמוז תש\"ו", "excerpt": "ד. כשיודעים את דרכי החסידים, יודעים שניגון צריך לשיר לא במהירות. ניגון אינו צעקה בקול, ניגון הוא חיות. כשחסידים בדורות הקודמים היו מנגנים ניגון, הניגון היה סוחף אותם לגמרי. לאחר מכן היו יוצאים בריקוד, לא סתם ריקוד אלא ריקוד עם מוחין, עם כל כוחות הנפש, הרגליים התרוממו מאליהן. ניגון הוא הכנה לעבודה, הוא עדיין אינו עבודה אלא הכנה לעבודה אמיתית.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2F12_Tammuz_5706.pdf&title=%D7%99%22%D7%91+%D7%AA%D7%9E%D7%95%D7%96+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "הלל", "desc": "אצל אצל אדמו\"ר הצ\"צ והמהר\"ש - בברכה או בלי", "page": 8, "sichah": "ש\"פ נח בסעודת הלילה", "excerpt": "יג (שאל השואל: מספרים כי הצ\"צ הי' יורד לפני התיבה ובפרט באמירת הלל. וענה כ\"ק אד\"ש:) לא בימי הנשיאות כי אם לפעמים, באמירת הלל בראש חודש. (שאל השואל: אם הטעם הוא מפני שרצה לברך בעצמו או רק כשהש\"ץ לא נשא חן בעיניו לצאת בברכתו, או ב' הטעמים. וענה:) רק טעם א' (לא רצה לאמר איזה, אבל נראה הי' שהוא הטעם הב'). יד. כ\"ק אאזמו\"ר מהר\"ש נ\"ע אמר: לאבא היה מורא מהברכה (ברכת הלל בימים שאין גומרים), אני לוקח זאת על עצמי.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Shabbos_Noach_5706.pdf&title=%D7%A9%22%D7%A4+%D7%A0%D7%97+%D7%91%D7%A1%D7%A2%D7%95%D7%93%D7%AA+%D7%94%D7%9C%D7%99%D7%9C%D7%94"}, {"t": "i", "topic": "הריון", "desc": "אדנ\"ע", "page": 11, "sichah": "ליל ש\"פ וירא, כ' מר־חשון תש\"ו", "excerpt": "א. כשאימי זקנתי הרבנית רבקה  הרתה עם כ\"ק אאמו\"ר נ\"ע היא  היתה חלושה, ושנתיים לפני כן ילדה את הרז\"א, ושנה לפני כן ילדה את ר' סענדער שהסתלק בן חמישה־שמונה שנים. - נכנס כ\"ק אדמו\"ר המהר\"ש אל הצ\"צ וסיפר לו אודות חולשתה. וציוה הצ\"צ שתיכנס אליו, ונכנסה ואמר לה: מז\"ט, יהי' ילד בריא. ונתן לה סדר איך להתנהג בימי עיבורה, וגם צוה להעלים את זה ככל האפשר. ואח\"כ אמר להמהר\"ש: זה יהיה בן, אבל אל תאמר זאת לאף אחד. בפ' נח התחילו מכאובים, ונכנסה חמותה הרבנית מוסיא לצ\"צ וסיפרה לו, ואמר: פרשת נח אינו הזמן, זהו דמיון. בשבת קודש לך לך אמר מאמר המדבר אודות חילוק שבין אברהם ובין יצחק, אברהם הי' התעוררות על ההמשכה ועל ידי יצחק נמשך אור הגילוי גם בעולמות. אח\"כ אמר: החייתי את נפשי, מוטב הי' אלו הי' [בדוגמת] אברהם אך כך גם טוב. הוא יהיה ילד בריא אבל הברית לא תהיה בזמנה.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Shabbos_Vayeira_20_MarCheshvan_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%A9%22%D7%A4+%D7%95%D7%99%D7%A8%D7%90%2C+%D7%9B%27+%D7%9E%D7%A8%D6%BE%D7%97%D7%A9%D7%95%D7%9F+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "השגח\"פ", "desc": "כל יהודי מאמין בהשגח\"פ", "page": 15, "sichah": "כ' כסלו תש\"ו", "excerpt": "א. כל יהודי מאמין באמונה פשוטה שכל מאורע שקורה בחיי האדם, אפילו בדבר יותר קל, הכל הוא בהשגחה פרטית.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2F20_Kislev_5706.pdf&title=%D7%9B%27+%D7%9B%D7%A1%D7%9C%D7%95+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "התבוננות", "desc": "הציוי ואהבת", "page": 8, "sichah": "ש\"פ נח בסעודת הלילה", "excerpt": "טו. (אמר הרש\"ל: בדא\"ח של מהרי\"א מהאָמיל מובא שאמר אדה\"ז בשם הה\"מ שציווי ואהבת הוא על ההתבוננות. וענה כ\"ק אד\"ש:) הענין מובא בדא\"ח, אך כדי שלא  להכביד.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Shabbos_Noach_5706.pdf&title=%D7%A9%22%D7%A4+%D7%A0%D7%97+%D7%91%D7%A1%D7%A2%D7%95%D7%93%D7%AA+%D7%94%D7%9C%D7%99%D7%9C%D7%94"}, {"t": "i", "topic": "התוועדות", "desc": "עם הרשב\"ץ אחרי ש\"פ 'לך', עם אדנ\"ע עם הצ\"צ", "page": 9, "sichah": "ליל ש\"פ לך", "excerpt": "א. בשנת תרנ\"ד כ\"ק אאמו\"ר התוועד בשבת פרשת לך לך, קוטב השיחה: התחלת עולם התיקון. בכלל, לא תמיד התוועדו בפ' לך לך. אחרי שבת הרשב\"ץ התוועד ואמר על אאמו\"ר: בוצינא קדישא אור העצמי, אילו היה לנו כזה מדריך בצעירותנו היינו לגמרי אחרת. בשנה ההיא הרשב\"ץ התוועד בכל עשי\"ת, גם בלילה שבערב יום כיפור. לפנות בוקר הוא אמר: צריך ללכת לתרנגול, לשליח, לתמורה.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Shabbos_Lech_Lecha_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%A9%22%D7%A4+%D7%9C%D7%9A"}, {"t": "i", "topic": "התוועדות", "desc": "אצל אדמו\"ר מהר\"ש ואמצעי - בקיצור", "page": 16, "sichah": "כ' כסלו תש\"ו", "excerpt": "מנהגם של מורנו הבעש\"ט והרב המגיד בזמן נשיאותם של כל אחד מהם הי', שאת ספירת העומר היו סופרים כעובר לפני התיבה בבית הכנסת. כשהרב המגיד ספר את ספירת העומר במנין לפני התיבה בתפילת ערבית, ליל התקדש הוד שבהוד, אדמו\"ר הזקן הרגיש את הגילוי חב\"ד שבנפשו. ומאז והלאה רבינו הזקן ראה במוחש את קיום תפילתו וברכתו של הרב המגיד - \"אל הוי' ויאר לנו\"; ותפילתו וברכתו של הרב המגיד שאצלו, אצל אדמו\"ר הזקן, יאיר חב\"ד שבנפשו בהתגלות בהצלחה מופלגה בזמן במחשבה ובכתיבה בסגנון קצר המחזיק את המרובה.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2F20_Kislev_5706.pdf&title=%D7%9B%27+%D7%9B%D7%A1%D7%9C%D7%95+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "התוועדות", "desc": "הרשב\"ץ הכיר טובה שנתנו לו להכנס לה., סיפור מה. בליובאוויטש", "page": 22, "sichah": "יום א' דחג הפסח תש\"ו", "excerpt": "ג. הרשב\"ץ תמיד הכיר טובה על הזכות שהניחו לו להכנס להתוועדויות של חסידים זקנים. פעם נתנו רק לאברכים להכנס להתוועדויות חסידיות - ולבחורי הישיבה - וכידוע שבליובאוויטש תמיד היתה ישיבה, וגם היו ה'יושבים' - לא נתנו להכנס. הרשב\"ץ, מאחר והיה תלמיד ומחונך של ר' מיכאל אָפּאָצקער, נתנו לו להכנס.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FYom_Alef_Pesach_5706.pdf&title=%D7%99%D7%95%D7%9D+%D7%90%27+%D7%93%D7%97%D7%92+%D7%94%D7%A4%D7%A1%D7%97+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "התוועדות", "desc": "הצ\"צ התוועד בחיי אדהאמ\"צ ולאחר מכן מתחיל בסיפור ואומר הבכן בחב\"ד חג\"ת נה\"י", "page": 29, "sichah": "ליל שביעי של פסח תש\"ו", "excerpt": "ב. הצ\"צ היה מתוועד עם החסידים בחיי אדה\"ז, בחיי אדהאמ\"צ, וגם מאוחר יותר בעת נשיאותו. הצ\"צ התחיל להתוועד עם החסידים בהיותו בגיל 15, מאוחר יותר בימי נשיאותו הוא היה מתוועד מאד בקיצור ובהתיישבות.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Shvii_shel_Pesach_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%A9%D7%91%D7%99%D7%A2%D7%99+%D7%A9%D7%9C+%D7%A4%D7%A1%D7%97+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "התוועדות", "desc": "אדנ\"ע היה מתוועד עם החסידים", "page": 33, "sichah": "ליל א' דחג השבועות תש\"ו", "excerpt": "", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Alef_Shavuos_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%90%27+%D7%93%D7%97%D7%92+%D7%94%D7%A9%D7%91%D7%95%D7%A2%D7%95%D7%AA+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "התוועדות", "desc": "בלי משקה, סיפור על ה. של ר' הענדל", "page": 41, "sichah": "י\"ב תמוז תש\"ו", "excerpt": "צריכים שהחסידים יתחילו להתוועד בינם לבין עצמם ובלי משקה, לנגן ניגון ולדבר דברי התעוררות. הרה\"ח ר' הענדל היה מתוועד הרבה מאוד, ונוהג היה שתכף אחר חג הפסח היה קונה בקבוק יי\"ש, ובכל התוועדות הוא היה מניח על השולחן את הבקבוק ההוא עם כוסיות, וכך היה מוריד מהשולחן. עד שבערב פסח הוא היה מבער אותו עם החמץ. ואז הוא היה אומר: יהי רצון שכשם שאני מבער את הבקבוק יי\"ש מביתי כן תבער את כל החמץ שיש לי - החמץ הפנימי (אייגענעם חמץ).", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2F12_Tammuz_5706.pdf&title=%D7%99%22%D7%91+%D7%AA%D7%9E%D7%95%D7%96+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "זריעה", "desc": "אצל חסידים הראשונים", "page": 9, "sichah": "ליל ש\"פ לך", "excerpt": "אצל החסידים הראשונים הייתה הזריעה והם אכן קלטו. הם קלטו את הנקודה, היה \"תן לחכם ויחכם עוד\", הם קלטו את הנקודה.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Shabbos_Lech_Lecha_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%A9%22%D7%A4+%D7%9C%D7%9A"}, {"t": "i", "topic": "חוש הציור", "desc": "אדמו\"ר הריי\"ץ צייר לעצמו הסיפורים, כח הציור הציל את אדמו\"ר הריי\"ץ", "page": 32, "sichah": "ליל אחרון של פסח תש\"ו", "excerpt": "כשרק התחלתי לדבר, כילד בן 3 בערך, אבי היה שואל אותי: מה אתה זוכר? - הייתי מצייר [מדמיין] לעצמי - והייתי עונה: אני זוכר את סבא - המהר\"ש נ\"ע - שהוא תמיד נשא שתי שרשראות זהב על הוועסט שלו - כידוע שהמהר\"ש נ\"ע נשא תמיד 2 שעונים בכיסו - והטלית קטן בלט מהוועסט שלו, ואבי היה אומר לי לצייר את זה לעצמי. הוא פיתח אצלי את חוש הציור. כשלמדתי אצל המלמד הראשון שלי, ר' יקותיאל, ודרכו היתה שאחרי הלימוד הוא היה מספר סיפורי מעשיות שהי' בהם עניני הפלאה, סיפורים שגם לגדולים היו פלא ומכל שכן לילדים, הייתי מצייר לעצמי את מה שסיפר. אח\"כ למדתי אצל המלמד ר' ניסן. וכמו\"כ בכל ענין בלימוד דא\"ח ציירתי לעצמי הענין. אבי אמר לי פעם: כח הציור הציל אותך. ועל ידי זה התפתח אצלי חוש הציור (עד שיש כמה דברים שהנני זוכר, ואיני יודע אם ראיתי את בעצמי הדבר או שזהו מה שציירתי לעצמי ממה ששמעתי).", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2F21_Leil_Acharon_shel_Pesach_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%90%D7%97%D7%A8%D7%95%D7%9F+%D7%A9%D7%9C+%D7%A4%D7%A1%D7%97+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "חוש הציור", "desc": "אדנ\"ע פיתח את ח.הצ. אל אדמו\"ר הריי\"ץ", "page": 31, "sichah": "ליל אחרון של פסח תש\"ו", "excerpt": "כשרק התחלתי לדבר, כילד בן 3 בערך, אבי היה שואל אותי: מה אתה זוכר? - הייתי מצייר [מדמיין] לעצמי - והייתי עונה: אני זוכר את סבא - המהר\"ש נ\"ע - שהוא תמיד נשא שתי שרשראות זהב על הוועסט שלו - כידוע שהמהר\"ש נ\"ע נשא תמיד 2 שעונים בכיסו - והטלית קטן בלט מהוועסט שלו, ואבי היה אומר לי לצייר את זה לעצמי. הוא פיתח אצלי את חוש הציור. כשלמדתי אצל המלמד הראשון שלי, ר' יקותיאל, ודרכו היתה שאחרי הלימוד הוא היה מספר סיפורי מעשיות שהי' בהם עניני הפלאה, סיפורים שגם לגדולים היו פלא ומכל שכן לילדים, הייתי מצייר לעצמי את מה שסיפר. אח\"כ למדתי אצל המלמד ר' ניסן. וכמו\"כ בכל ענין בלימוד דא\"ח ציירתי לעצמי הענין. אבי אמר לי פעם: כח הציור הציל אותך. ועל ידי זה התפתח אצלי חוש הציור (עד שיש כמה דברים שהנני זוכר, ואיני יודע אם ראיתי את בעצמי הדבר או שזהו מה שציירתי לעצמי ממה ששמעתי).", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2F21_Leil_Acharon_shel_Pesach_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%90%D7%97%D7%A8%D7%95%D7%9F+%D7%A9%D7%9C+%D7%A4%D7%A1%D7%97+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "חי'", "desc": "שיאיר בחב\"ד", "page": 15, "sichah": "כ' כסלו תש\"ו", "excerpt": "ה. השעה הקבועה שהרב המגיד בחר לחזור לאדמו\"ר הזקן את מאמרי התורה והסיפורים ממורנו הבעש\"ט, היתה שעה קבועה ומסודרת בחול, בשבת קודש ובמועד. לפני שהרב המגיד התחיל את הלימוד או את הסיפור, הוא היה אומר בקול תחינה ותפילה: \"אל הוי' ויאר לנו\". ובסוף הלימוד או הסיפור, בגמר השעה של לימוד, הרב המגיד הי' אומר: יהי רצון שיאיר ויתגלה אור חי' יחידה בחב\"ד שבנפש בגילוי ובהצלחה.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2F20_Kislev_5706.pdf&title=%D7%9B%27+%D7%9B%D7%A1%D7%9C%D7%95+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "חינוך", "desc": "להתאסף ולהתדבר בעניין הח. \"בכל לשון שאתה שומע\"", "page": 28, "sichah": "ד' דחוה\"מ פסח תש\"ו", "excerpt": "זהו בַעצם, וההתפשטות צריכה להיות \"בכל לשון שאתה שומע\". הרי ישנם כאן ילדים ואברכים שאינם מבינים אידיש, צריך לחפש עצות כיצד להביא אותם גם לתורה ויראת שמים, וכיצד להביא תורה ויראת שמים אליהם. צריכים לשאוף לעשות את הילדים האמריקאים היהודים ללמדנים, אבל קודם כמובן מאליו - צריכים לפשוט את הלבושים המלוכלכים ולהלביש אותם לבושים נקיים.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FDaled_Chol_HaMoed_Pesach_5706.pdf&title=%D7%93%27+%D7%93%D7%97%D7%95%D7%94%22%D7%9E+%D7%A4%D7%A1%D7%97+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "חכ' דאצי'", "desc": "נמשך בנָבַל", "page": 22, "sichah": "יום א' דחג הפסח תש\"ו", "excerpt": "ר' שלום יוסף היה יהודי זקן מחסידי אדמו\"ר הזקן, אבל הוא היה פשוט מאד, פרנסתו היתה מזה שהיה בנאי, פועל פשוט. כשר' הלל עוד היה אברך, ר' שלום יוסף כבר היה זקן מופלג. ר' שלום יוסף היה מתפלל הרבה. פעם אחת ר' הלל ראה את ר' שלום יוסף ממרר בבכי בתפילה, ולאחר מכן ר' הלל שאל אותו מדוע בכית בתפילה? ר' שלום יוסף ענה לו ששמע מאדמו\"ר הזקן שנשמתו של כל יהודי היא מחכמה דאצילות, והיום כשחשבתי על כך שחכמה דאצילות נמצאת בתוך נָבָל וא\"כ איזו רחמנות יש עליה, וזה גרם לי לבכות.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FYom_Alef_Pesach_5706.pdf&title=%D7%99%D7%95%D7%9D+%D7%90%27+%D7%93%D7%97%D7%92+%D7%94%D7%A4%D7%A1%D7%97+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "חכ' דאצי'", "desc": "מציאותו מצד הביטול, משל מחייל", "page": 23, "sichah": "יום א' דחג הפסח תש\"ו", "excerpt": "אבי אמר לי, שזהו הסבר לענין של חכמה דאצילות: עד שהחייל נעשה חייל מאומן היטב הוא חטף לא מעט מכות, כשהכפתור שלו לא היה מספיק מצוחצח חבטו בו וזרקו אותו לצינוק, ואיזה חשיבות יש לחייל הזה כלפי המנהיג שלו? כלום. הוא נחשב לגביו כעפרא דארעא. ועכשיו רואים את החייל הזה כמציאות, אבל כל מציאותו היא הרי מצד הביטול. וכמו\"כ הוא בענין חכמה דאצילות שכל המציאות שלה באה מצד הביטול.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FYom_Alef_Pesach_5706.pdf&title=%D7%99%D7%95%D7%9D+%D7%90%27+%D7%93%D7%97%D7%92+%D7%94%D7%A4%D7%A1%D7%97+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "חנוכה", "desc": "אדמו\"ר הצ\"צ והמהר\"ש התוועדות עם ילדיהם", "page": 16, "sichah": "ליל ש\"פ וישב, כ\"ו כסלו, שבת חנוכה תש\"ו", "excerpt": "ב. הוד כ\"ק אאזמו\"ר הרה\"ק הצ\"צ היה מתוועד עם ילדיו באחד מימות החנוכה. הוד כ\"ק אאזמו\"ר הרה\"ק מוהר\"ש גם כן היה עושה כן, אבל היה עושה זאת בקיצור.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Shabbos_Vayeishev_26_Kislev_Chanukah_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%A9%22%D7%A4+%D7%95%D7%99%D7%A9%D7%91%2C+%D7%9B%22%D7%95+%D7%9B%D7%A1%D7%9C%D7%95%2C+%D7%A9%D7%91%D7%AA+%D7%97%D7%A0%D7%95%D7%9B%D7%94+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "חסיד", "desc": "ענינו ללמוד", "page": 40, "sichah": "י\"ב תמוז תש\"ו", "excerpt": "ג. ענינו של חסיד הוא - ללמוד. צריכים ללמוד חסידות, על דרך לימוד הנגלה כך צריך להיות לימוד החסידות, אבי ייסד את תומכי־תמימים כדי שידעו מה זאת אומרת ללמוד וכיצד צריך ללמוד כדי שאור התורה יאיר את הלומד. את זאת צריכים אחר כך להוריד לתוך עבודת הלב, שלא יהיה ראש מנותק. חסידות אינה ע\"י מקיפים: הוא מסתפק במועט, הוא הרי יהודי, הוא חסיד, מתנהג במידות חסידות, הוא מתפלל, בשבת הוא מאריך קצת בתפילה, הוא מתאנח אנחה חסידית והוא רוקד. זה לא חסיד, אלא מוכרח להיות עבודה ויגיעה.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2F12_Tammuz_5706.pdf&title=%D7%99%22%D7%91+%D7%AA%D7%9E%D7%95%D7%96+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "חסידות", "desc": "הכח להפוך את האדם", "page": 5, "sichah": "ליל שמחת תורה תש\"ו", "excerpt": "ב. לחסידות יש בעזה\"י את הכח האלקי לגרום לאדם להתהפך על ידי עבודה - מבעל חסרון בכוחות הנפש לבעל מדריגה בעבודת ה', אבל לשם כך זקוקים לרצון נכון וחזק, לִרצות באמת להפסיק להיות בעל חסרון ולהפוך לבעל מעלה.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Simchas_Torah_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%A9%D7%9E%D7%97%D7%AA+%D7%AA%D7%95%D7%A8%D7%94+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "חסידות", "desc": "לשמוע ממי שעוסק בעבודת התפילה, ממי שלא - ה\"ז סקילה, תקנות לשמוע דוקא מהעוסק בעבודה", "page": 14, "sichah": "ש\"פ וישלח, י\"ט כסלו תש\"ו", "excerpt": "אצל אדמו\"ר האמצעי היו תקנות שלא ישמעו חסידות ממי שלא עוסק בעבודת התפילה, ור' הענדל הי' זוכר שכשהגיעו לעיר ופגשו מישהו אומר חסידות, היו שואלים: מותר לשמוע ממנו חסידות?", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FShabbos_Vayishlach_19_Kislev_5706.pdf&title=%D7%A9%22%D7%A4+%D7%95%D7%99%D7%A9%D7%9C%D7%97%2C+%D7%99%22%D7%98+%D7%9B%D7%A1%D7%9C%D7%95+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "חסידות", "desc": "מטהר טמאים", "page": 17, "sichah": "ליל ש\"פ וישב, כ\"ו כסלו, שבת חנוכה תש\"ו", "excerpt": "יא. חסידות מטהרת טמאים. מה זה טמאים, צריך לומר בחשאי. רק נשמה חדשה דאצילות - הכוונה להוד כ\"ק אדמו\"ר הזקן - יכל לפתוח את המעינות.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Shabbos_Vayeishev_26_Kislev_Chanukah_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%A9%22%D7%A4+%D7%95%D7%99%D7%A9%D7%91%2C+%D7%9B%22%D7%95+%D7%9B%D7%A1%D7%9C%D7%95%2C+%D7%A9%D7%91%D7%AA+%D7%97%D7%A0%D7%95%D7%9B%D7%94+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "חסידות", "desc": "ח. פעלה אהב\"י", "page": 37, "sichah": "יום ב' דחג השבועות תש\"ו", "excerpt": "אדמו\"ר הזקן ענה שהוא קיבל במעזריטש, מהו הקב\"ה ומהו יהודי, היוקר של היהודים אצל הקב\"ה והיוקר של הקב\"ה אצל היהודים. לפני\"ז גם כן היה אהבת ישראל אבל זה היה מצד יוקר התורה, אהבו יהודי מצד ידיעתו בתורה, ממילא היו שני דברים נפרדים: היהודי וידיעתו בתורה. חסידות פעלה אהבת ישראל - לאהוב יהודי כי הוא יהודי. במתן תורה הקב\"ה בחר ביהודים, עם סגולה לה' אלקיך, וזו היתה בחירה ביהודים מצד העצם, בגלל זה שהם יהודים, וכך צריכה להיות האהבת ישראל - לאהוב מצד זה שהוא יהודי.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FYom_Beis_Shavuos_5706.pdf&title=%D7%99%D7%95%D7%9D+%D7%91%27+%D7%93%D7%97%D7%92+%D7%94%D7%A9%D7%91%D7%95%D7%A2%D7%95%D7%AA+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "חסידים הראשונים", "desc": "זריעה", "page": 9, "sichah": "ליל ש\"פ לך", "excerpt": "אצל החסידים הראשונים הייתה הזריעה והם אכן קלטו. הם קלטו את הנקודה, היה \"תן לחכם ויחכם עוד\", הם קלטו את הנקודה.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Shabbos_Lech_Lecha_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%A9%22%D7%A4+%D7%9C%D7%9A"}, {"t": "i", "topic": "חסידים הראשונים", "desc": "סדר לימוד והתפילה אצלם", "page": 22, "sichah": "יום א' דחג הפסח תש\"ו", "excerpt": "ב. אצל חסידים בֶעבר (אַלטע חסידים) היה סדר ללמוד חסידות ולהתעסק בעבודת התפילה, זה היה אצלם בפשיטות, ובלי תפילה אי אפשר להיות חסיד כלל. אין הכוונה בלי תפילה כלל ח\"ו, אלא - בלי להתעסק בעבודת התפילה. פעם למדו פחות חסידות וידעו פחות, הכרתי חסידים זקנים שידעו רק מאמרים ספורים, אבל את מה שכן ידעו הם חיו בו, היום לומדים יותר ויודעים יותר, אבל חסרה עבודת התפילה, חסר ההרגש הפנימי, ידיעה וחיות הינם שתי דברים שונים.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FYom_Alef_Pesach_5706.pdf&title=%D7%99%D7%95%D7%9D+%D7%90%27+%D7%93%D7%97%D7%92+%D7%94%D7%A4%D7%A1%D7%97+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "חתונה", "desc": "אדנ\"ע", "page": 7, "sichah": "ש\"פ נח בסעודת הלילה", "excerpt": "- ויספר הרשד\"ב כל מאורע זה לכ\"ק אדנ\"ע בסיימו: נהיה אצלי נפילת הרוח שמשכיל יכול לדבר חמש שעות ואינו תופס שהוא בסכ\"ה מקשקש.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Shabbos_Noach_5706.pdf&title=%D7%A9%22%D7%A4+%D7%A0%D7%97+%D7%91%D7%A1%D7%A2%D7%95%D7%93%D7%AA+%D7%94%D7%9C%D7%99%D7%9C%D7%94"}, {"t": "i", "topic": "חתונה", "desc": "הר\"מ האָרענשטיין", "page": 6, "sichah": "ש\"פ נח בסעודת הלילה", "excerpt": "א. (הי' יאצ\"ט של הרג\"ד פּאַהאַרער). תרנ\"ב בעת חתונת ר\"מ האָרענשטיין הי' אז הרג\"ד בליובאַוויטש, א\"ל כ\"ק אאמו\"ר נ\"ע שאבקר אצלו ואסתכל במנהגיו ואשמע מה שיספר לי.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Shabbos_Noach_5706.pdf&title=%D7%A9%22%D7%A4+%D7%A0%D7%97+%D7%91%D7%A1%D7%A2%D7%95%D7%93%D7%AA+%D7%94%D7%9C%D7%99%D7%9C%D7%94"}, {"t": "i", "topic": "חתונה", "desc": "ר' אשר מניקאָלאַייעב הביא ניגונו מחתונת ר\"ש האָרענשטיין", "page": 26, "sichah": "סדר השני של חג הפסח תש\"ו", "excerpt": "ט. בתוך הסעודה נגנו את הניגון הידוע של ר' אשר מניקאָלאַייעוו וסיפר כ\"ק אדמו\"ר שליט\"א: המחבר של ניגון זה היה ר' משה חאַריטאָנאָוו. את הניגון (ב' בבות הראשונות) הביא ר' אשר הנ\"ל לאחר ששמעו בחתונת משפחת האָרענשטיין (חתונת ר' שלמה האָרענשטיין). וכשבא אח\"כ ר' אשר לליובאוויטש למסור פ\"ש מהחתונה, אמר לו כ\"ק אדמו\"ר נ\"ע שבטח יבוא לנאות הדשא בחו\"ל וכך הוה, ובא ר' אשר הנ\"ל לפורים תרס\"א לחו\"ל, וניגן את הניגון הנ\"ל כפי שתיקנו סידרו ושכללו ר' משה חאַריטאָנאָוו, ואמר כ\"ק אדמו\"ר נ\"ע: בניגון זה משתקף עד כמה חסיד מרגיש אבוד מצד מעשיו, וכל תקותו על הרבי.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FSeder_Sheni_Pesach_5706.pdf&title=%D7%A1%D7%93%D7%A8+%D7%94%D7%A9%D7%A0%D7%99+%D7%A9%D7%9C+%D7%97%D7%92+%D7%94%D7%A4%D7%A1%D7%97+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "טעמי הנגינה", "desc": "הרב\"ש קיבל מאדה\"ז, ההבדל בין הקריאות,", "page": 29, "sichah": "ליל שביעי של פסח תש\"ו", "excerpt": "א. שמעתי מאבי ששמע מאביו ששמע מהצ\"צ, שאדמו\"ר הזקן אמר לנכדו הרב\"ש: החיית אותי בכך שהקשבת היטב לטעמי הנגינה, ושיננת אותם.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Shvii_shel_Pesach_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%A9%D7%91%D7%99%D7%A2%D7%99+%D7%A9%D7%9C+%D7%A4%D7%A1%D7%97+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "יגיעה", "desc": "י. לשמוע", "page": 2, "sichah": "ליל א' דחג הסוכות תש\"ו", "excerpt": "כדי שתהיה 'אזן שומעת' צריך גם שיהיה ריבוי יגיעה ובפרט כדי שתהיה \"אזן מלין תבחן\" צריך רצון פנימי ועונג בכך שמתייגעים לקלוט מה ששומעים.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Alef_Sukkos_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%90%27+%D7%93%D7%97%D7%92+%D7%94%D7%A1%D7%95%D7%9B%D7%95%D7%AA+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "יהודי", "desc": "אדה\"ז קיבל במעזריטש את מעלת ויוקר יהודי", "page": 37, "sichah": "יום ב' דחג השבועות תש\"ו", "excerpt": "אדמו\"ר הזקן ענה שהוא קיבל במעזריטש, מהו הקב\"ה ומהו יהודי, היוקר של היהודים אצל הקב\"ה והיוקר של הקב\"ה אצל היהודים. לפני\"ז גם כן היה אהבת ישראל אבל זה היה מצד יוקר התורה, אהבו יהודי מצד ידיעתו בתורה, ממילא היו שני דברים נפרדים: היהודי וידיעתו בתורה. חסידות פעלה אהבת ישראל - לאהוב יהודי כי הוא יהודי. במתן תורה הקב\"ה בחר ביהודים, עם סגולה לה' אלקיך, וזו היתה בחירה ביהודים מצד העצם, בגלל זה שהם יהודים, וכך צריכה להיות האהבת ישראל - לאהוב מצד זה שהוא יהודי.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FYom_Beis_Shavuos_5706.pdf&title=%D7%99%D7%95%D7%9D+%D7%91%27+%D7%93%D7%97%D7%92+%D7%94%D7%A9%D7%91%D7%95%D7%A2%D7%95%D7%AA+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "יהודי פשוט", "desc": "קיום המצוות שלהם כלי לעצמות", "page": 1, "sichah": "ליל א' דחג הסוכות תש\"ו", "excerpt": "ידוע המאמר קודש שאדמו\"ר הזקן היה אומר בשם הבעש\"ט, שקיום המצות של היהודים הפשוטים - המקיימין אותן מצד אמונתם בעצמות, הוא כלי לעצמות וגורם נחת רוח לעצמות. פשיטות העצמות שורה בכלי של קיום המצות בפשיטות.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Alef_Sukkos_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%90%27+%D7%93%D7%97%D7%92+%D7%94%D7%A1%D7%95%D7%9B%D7%95%D7%AA+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "יהודי פשוט", "desc": "שאומר 'אלקי נשמה'", "page": 10, "sichah": "ליל ש\"פ לך", "excerpt": "ט. כשיהודי פשוט אומר \"אלקי נשמה\" מתוך ניגון כראוי, ויהודי אחר אומר עם כוונת גדולות, הרי הם בהשוואה.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Shabbos_Lech_Lecha_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%A9%22%D7%A4+%D7%9C%D7%9A"}, {"t": "i", "topic": "יהודי פשוט", "desc": "אין דבר כזה יהודים פשוטים", "page": 14, "sichah": "ש\"פ וישלח, י\"ט כסלו תש\"ו", "excerpt": "(הרש\"ל שי' סיפר שהוא ראה יהודים פשוטים אומרים את סדר תיקון חצות במנין. ואמר כ\"ק אדמו\"ר שליט\"א:) אצל יהודים אין מושג כזה \"פשוטים\".", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FShabbos_Vayishlach_19_Kislev_5706.pdf&title=%D7%A9%22%D7%A4+%D7%95%D7%99%D7%A9%D7%9C%D7%97%2C+%D7%99%22%D7%98+%D7%9B%D7%A1%D7%9C%D7%95+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "יהודי פשוט", "desc": "אדה\"ז קירב אותם בשובו ממעזריטש, פשיטותם מפשיטות הנשמה שמפשיטות העצמות", "page": 21, "sichah": "יום א' דחג הפסח תש\"ו", "excerpt": "כשחזר ממעזריטש בפעם הראשונה הביתה - לויטעבסק - בידעו את האחריות הגדולה שבשליחות נשמתו, אדמו\"ר הזקן ייקר כל רגע ורגע והתחיל לפעול ולקרב יהודים, לא רק אלו השייכים לחב\"ד, ולא רק אלו השייכים למידות חג\"ת, אלא גם אלו השייכים לנה\"י, יהודים שלמים בתורה ומצוות, יהודים לגמרי פשוטים, שהפשטות של יהודים פשוטים נלקחת מפשיטות הנשמה, ולפשיטות הנשמה יש שרש בפשיטות העצמות.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FYom_Alef_Pesach_5706.pdf&title=%D7%99%D7%95%D7%9D+%D7%90%27+%D7%93%D7%97%D7%92+%D7%94%D7%A4%D7%A1%D7%97+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "יהודי פשוט", "desc": "הוא בן תורה, הם היו \"וכל העם רואים\"", "page": 34, "sichah": "ליל א' דחג השבועות תש\"ו", "excerpt": "ב. אבי אמר פעם בהתוועדות בשבועות: \"וכל העם רואים את הקולות וגו'\", במתן תורה היה \"רואים את הנשמע ושומעים את הנראה\", אצל מי זה היה? אצל \"וכל העם\" - אנשים פשוטים. הלמדנים והגאונים - במתן תורה חיכו לשמוע חידוש, פלפול, שהרי היו למדנים גם לפני מתן תורה, כמו שחז\"ל אומרים: \"אברהם כו' יושב בישיבה כו' היו במצרים ישיבה עמהם\" - למדנים במצרים אבל \"למדנים מצריים\", כשהם הגיעו למתן תורה הם חשבו שישמעו חידוש, פלפול.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Alef_Shavuos_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%90%27+%D7%93%D7%97%D7%92+%D7%94%D7%A9%D7%91%D7%95%D7%A2%D7%95%D7%AA+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "יחידה", "desc": "שתאיר בחב\"ד", "page": 15, "sichah": "כ' כסלו תש\"ו", "excerpt": "ה. השעה הקבועה שהרב המגיד בחר לחזור לאדמו\"ר הזקן את מאמרי התורה והסיפורים ממורנו הבעש\"ט, היתה שעה קבועה ומסודרת בחול, בשבת קודש ובמועד. לפני שהרב המגיד התחיל את הלימוד או את הסיפור, הוא היה אומר בקול תחינה ותפילה: \"אל הוי' ויאר לנו\". ובסוף הלימוד או הסיפור, בגמר השעה של לימוד, הרב המגיד הי' אומר: יהי רצון שיאיר ויתגלה אור חי' יחידה בחב\"ד שבנפש בגילוי ובהצלחה.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2F20_Kislev_5706.pdf&title=%D7%9B%27+%D7%9B%D7%A1%D7%9C%D7%95+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "יחידות", "desc": "לפני ואחרי", "page": 4, "sichah": "יום שבת חוה\"מ סוכות תש\"ו", "excerpt": "קול מעורר הכוונה. לחסידי רבינו הזקן, לחסידי אדמו\"ר האמצעי ולחסידי הסבא, היה ניגון מיוחד לכל ענין בעבודת החסידות והחסידים, ניגון התעוררות לפני שמיעת חסידות ואחרי שמיעת חסידות, לפני יחידות ואחרי יחידות…", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FShabbos_Chol_HaMoed_Sukkos_5706.pdf&title=%D7%99%D7%95%D7%9D+%D7%A9%D7%91%D7%AA+%D7%97%D7%95%D7%94%22%D7%9E+%D7%A1%D7%95%D7%9B%D7%95%D7%AA+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "יחידות", "desc": "אדה\"ז חזר המאמר דחנוכה", "page": 16, "sichah": "ליל ש\"פ וישב, כ\"ו כסלו, שבת חנוכה תש\"ו", "excerpt": "א. בכלל המאמרים של חנוכה נאמרו בש\"ק חנוכה ולא בימות החול. אבל לעיתים קרה שהוד כ\"ק אאמו\"ר הרה\"ק חזר בפני ביחידות בימות החול של חנוכה את המאמר עם ביאורים.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Shabbos_Vayeishev_26_Kislev_Chanukah_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%A9%22%D7%A4+%D7%95%D7%99%D7%A9%D7%91%2C+%D7%9B%22%D7%95+%D7%9B%D7%A1%D7%9C%D7%95%2C+%D7%A9%D7%91%D7%AA+%D7%97%D7%A0%D7%95%D7%9B%D7%94+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "יחידות", "desc": "אדנ\"ע קיבל בי. יותר מברבים", "page": 17, "sichah": "ליל ש\"פ וישב, כ\"ו כסלו, שבת חנוכה תש\"ו", "excerpt": "י. הוד כ\"ק אאמו\"ר הרה\"ק אמר, שהוא קיבל מהוד כ\"ק אאזמו\"ר הרה\"ק מוהר\"ש ביחידות יותר מברבים, אבל הוא לא כתב זאת, מאחר והוא סמך על זכרונו, מאוחר יותר מאד כאב לו על כך שלא רשם.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Shabbos_Vayeishev_26_Kislev_Chanukah_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%A9%22%D7%A4+%D7%95%D7%99%D7%A9%D7%91%2C+%D7%9B%22%D7%95+%D7%9B%D7%A1%D7%9C%D7%95%2C+%D7%A9%D7%91%D7%AA+%D7%97%D7%A0%D7%95%D7%9B%D7%94+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "כוונה עליונה", "desc": "היא בכל דבר", "page": 15, "sichah": "כ' כסלו תש\"ו", "excerpt": "מורנו הבעש\"ט אומר שאפילו זה שקש מתתגלגל ברחוב ממקום אחד למקום אחר, הרי זה בהשגחה פרטית לשם כוונה עליונה, ויהודי צריך ללמוד מזה הרבה לחייו.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2F20_Kislev_5706.pdf&title=%D7%9B%27+%D7%9B%D7%A1%D7%9C%D7%95+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "כפרות", "desc": "הרשב\"ץ", "page": 9, "sichah": "ליל ש\"פ לך", "excerpt": "בשנה ההיא הרשב\"ץ התוועד בכל עשי\"ת, גם בלילה שבערב יום כיפור. לפנות בוקר הוא אמר: צריך ללכת לתרנגול, לשליח, לתמורה.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Shabbos_Lech_Lecha_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%A9%22%D7%A4+%D7%9C%D7%9A"}, {"t": "i", "topic": "כתיבה", "desc": "הסגנון אצל אדה\"ז", "page": 16, "sichah": "כ' כסלו תש\"ו", "excerpt": "מנהגם של מורנו הבעש\"ט והרב המגיד בזמן נשיאותם של כל אחד מהם הי', שאת ספירת העומר היו סופרים כעובר לפני התיבה בבית הכנסת. כשהרב המגיד ספר את ספירת העומר במנין לפני התיבה בתפילת ערבית, ליל התקדש הוד שבהוד, אדמו\"ר הזקן הרגיש את הגילוי חב\"ד שבנפשו. ומאז והלאה רבינו הזקן ראה במוחש את קיום תפילתו וברכתו של הרב המגיד - \"אל הוי' ויאר לנו\"; ותפילתו וברכתו של הרב המגיד שאצלו, אצל אדמו\"ר הזקן, יאיר חב\"ד שבנפשו בהתגלות בהצלחה מופלגה בזמן במחשבה ובכתיבה בסגנון קצר המחזיק את המרובה.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2F20_Kislev_5706.pdf&title=%D7%9B%27+%D7%9B%D7%A1%D7%9C%D7%95+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "לידה", "desc": "אדנ\"ע", "page": 11, "sichah": "ליל ש\"פ וירא, כ' מר־חשון תש\"ו", "excerpt": "א. כשאימי זקנתי הרבנית רבקה  הרתה עם כ\"ק אאמו\"ר נ\"ע היא  היתה חלושה, ושנתיים לפני כן ילדה את הרז\"א, ושנה לפני כן ילדה את ר' סענדער שהסתלק בן חמישה־שמונה שנים. - נכנס כ\"ק אדמו\"ר המהר\"ש אל הצ\"צ וסיפר לו אודות חולשתה. וציוה הצ\"צ שתיכנס אליו, ונכנסה ואמר לה: מז\"ט, יהי' ילד בריא. ונתן לה סדר איך להתנהג בימי עיבורה, וגם צוה להעלים את זה ככל האפשר. ואח\"כ אמר להמהר\"ש: זה יהיה בן, אבל אל תאמר זאת לאף אחד. בפ' נח התחילו מכאובים, ונכנסה חמותה הרבנית מוסיא לצ\"צ וסיפרה לו, ואמר: פרשת נח אינו הזמן, זהו דמיון. בשבת קודש לך לך אמר מאמר המדבר אודות חילוק שבין אברהם ובין יצחק, אברהם הי' התעוררות על ההמשכה ועל ידי יצחק נמשך אור הגילוי גם בעולמות. אח\"כ אמר: החייתי את נפשי, מוטב הי' אלו הי' [בדוגמת] אברהם אך כך גם טוב. הוא יהיה ילד בריא אבל הברית לא תהיה בזמנה. (שאלה: אם נולד בשבת, וענה כ\"ק אדמו\"ר שליט\"א) לא, באמצע השבוע.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Shabbos_Vayeira_20_MarCheshvan_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%A9%22%D7%A4+%D7%95%D7%99%D7%A8%D7%90%2C+%D7%9B%27+%D7%9E%D7%A8%D6%BE%D7%97%D7%A9%D7%95%D7%9F+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "לימוד", "desc": "הבדל בין חסידות לנגלה", "page": 5, "sichah": "ליל שמחת תורה תש\"ו", "excerpt": "ד. משמעות המילה \"לימוד\" אינה זהה בלימוד החסידות ובלימוד הנגלה. מהות  המילה \"לימוד\" בנגלה הוא ללמוד, אבל בחסידות מהות המילה \"לימוד\" הוא - חוויה.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Simchas_Torah_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%A9%D7%9E%D7%97%D7%AA+%D7%AA%D7%95%D7%A8%D7%94+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "לימוד חסי'", "desc": "בלי עבודה - כמכופף ראש המלך", "page": 9, "sichah": "ליל ש\"פ לך", "excerpt": "ח. (שאל הרמ\"ש שיחי': א\"כ לימוד חסידות בלי עבודה אינה שווה כלום, ומדוע לא יהי' כמו נגלה? והשיב כ\"ק אדמו\"ר שליט\"א:) יעקב מרדכי מפּאָלטאַווע כשהיה מבאר ענין בחסידות היה מסבירו, וכשלא היו לו יותר אותיות הוא היה אומר: כך הוא הענין (\"אזוי אזוי איז דער ענין\").", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Shabbos_Lech_Lecha_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%A9%22%D7%A4+%D7%9C%D7%9A"}, {"t": "i", "topic": "לימוד חסי'", "desc": "לא בריבוי - העיקר שמביא לעבודה", "page": 12, "sichah": "ליל ש\"פ וירא, כ' מר־חשון תש\"ו", "excerpt": "ג. כ\"ק אאמו\"ר לא החזיק מלימוד ריבוי חסידות, אלא ללמוד אפי' קצת אבל שיהיה מביא לעבודה, להתפלל עם הלימוד. ההזלה מלמעלה, טיפה אחת מלמעלה היא יותר מאשר דלי מלמטה.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Shabbos_Vayeira_20_MarCheshvan_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%A9%22%D7%A4+%D7%95%D7%99%D7%A8%D7%90%2C+%D7%9B%27+%D7%9E%D7%A8%D6%BE%D7%97%D7%A9%D7%95%D7%9F+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "לימוד חסי'", "desc": "בלי עבודה - מקבלים סנוקרת, חוצפה, כצלם בהיכל", "page": 14, "sichah": "ש\"פ וישלח, י\"ט כסלו תש\"ו", "excerpt": "ד. בי\"ט כסלו תרנ\"ו אבי התוועד, ואמר, שאדמו\"ר האמצעי אמר שמללמוד חסידות בלי עבודת התפילה \"מקבלים סנוקרת (\"אַ שנעל\") מאבא\" (אדמו\"ר הזקן), זוהי חוצפה, וקרוב הדבר לאמר שהעמיד צלם בהיכל, ואאמו\"ר ביאר מה המשמעות של לטיפה מרבי ומכה (\"אַ שנעל\") מרבי. ושאל ר' הענדל: עם מה מתפללים? והראה אאמו\"ר באצבעו על ליבו, ואמר: עם זה.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FShabbos_Vayishlach_19_Kislev_5706.pdf&title=%D7%A9%22%D7%A4+%D7%95%D7%99%D7%A9%D7%9C%D7%97%2C+%D7%99%22%D7%98+%D7%9B%D7%A1%D7%9C%D7%95+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "לימוד חסי'", "desc": "התאחדות עם הל., פעם לה הי' ריבוי ל", "page": 18, "sichah": "פורים תש\"ו", "excerpt": "(והתחיל ואמר:) אנחנו חסידי חב\"ד ב\"ה נמצאים היום במעמד טוב, אבל יש עוד הרבה שחסר. חסידים של פעם היו מאוחדים עם החסידות שהם למדו, הם והחסידות שלמדו היו דבר אחד. הם לא למדו הרבה וגם הבינו פחות; רק ליחידים היתה בהירות בהרבה חסידות ובריבוי ההשכלה, אבל רובם של החסידים לא ידעו הרבה חסידות, אבל מה שהם כן למדו היה דבר אחד איתם, לא שני דברים. חסיד היה נוסע לרבי פעם אחת בשנה, פעם בשנתיים פעם בשלוש שנים; כשהוא שמע מהרבי פתגם - הוא חי את הפתגם, הוא היה דבר אחד עם החסידות. כשהיה ברחוב, בשוק, וכשאכל הוא חי עם הפתגם.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FPurim_5706.pdf&title=%D7%A4%D7%95%D7%A8%D7%99%D7%9D+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "לימוד חסי'", "desc": "היום יש הרבה אבל נשארים נפרדים", "page": 19, "sichah": "פורים תש\"ו", "excerpt": "אבל היום יש שמבין הרבה יותר, לומד חסידות, אבל החסידות לא מלמדת אותו כלום - הוא והחסידות הם שני דברים נפרדים. כשמתפלל אינו חוסך נקישת אצבעות והכאה על השולחן - אבל זה 'לא נגע ולא פגע'. וצריכים לדעת שזה היפך הכוונה.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FPurim_5706.pdf&title=%D7%A4%D7%95%D7%A8%D7%99%D7%9D+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "לימוד חסי'", "desc": "היום יותר אבל חסר החיות", "page": 22, "sichah": "יום א' דחג הפסח תש\"ו", "excerpt": "ב. אצל חסידים בֶעבר (אַלטע חסידים) היה סדר ללמוד חסידות ולהתעסק בעבודת התפילה, זה היה אצלם בפשיטות, ובלי תפילה אי אפשר להיות חסיד כלל. אין הכוונה בלי תפילה כלל ח\"ו, אלא - בלי להתעסק בעבודת התפילה. פעם למדו פחות חסידות וידעו פחות, הכרתי חסידים זקנים שידעו רק מאמרים ספורים, אבל את מה שכן ידעו הם חיו בו, היום לומדים יותר ויודעים יותר, אבל חסרה עבודת התפילה, חסר ההרגש הפנימי, ידיעה וחיות הינם שתי דברים שונים.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FYom_Alef_Pesach_5706.pdf&title=%D7%99%D7%95%D7%9D+%D7%90%27+%D7%93%D7%97%D7%92+%D7%94%D7%A4%D7%A1%D7%97+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "מאמר", "desc": "הוראה מלמעלה", "page": 16, "sichah": "ליל ש\"פ וישב, כ\"ו כסלו, שבת חנוכה תש\"ו", "excerpt": "ד. בכלל, מאמר הוא הוראה מלמעלה. יום שלישי יום רביעי הרי שייך לשבת. אבל צריכים ביום שלישי רביעי חמישי ושישי להתייגע שיהיה בא בימים, דהיינו לבוא בימים, ולא שהימים יבואו אל האדם. דהיינו שייעשה מבוגר יותר.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Shabbos_Vayeishev_26_Kislev_Chanukah_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%A9%22%D7%A4+%D7%95%D7%99%D7%A9%D7%91%2C+%D7%9B%22%D7%95+%D7%9B%D7%A1%D7%9C%D7%95%2C+%D7%A9%D7%91%D7%AA+%D7%97%D7%A0%D7%95%D7%9B%D7%94+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "מאסר", "desc": "של אדה\"ז ביקור הבעש\"ט והמגיד", "page": 20, "sichah": "פורים תש\"ו", "excerpt": "ה. כשאדמו\"ר הזקן היה במאסר במבצר פּעטעראָפּאַוואָלסקי בפּעטערבורג, הגיעו אליו הבעש\"ט והמגיד לבקר אותו ולחזקו. הרבי אמר להם: אינני צריך שום חיזוק כי קיבלתי על עצמי מסירת הגוף, אלא שבמסירות הנפש שלי אני רוצה לפעול שכל אלו שירצו ללכת בדרך הזו יצליחו, ושלדרך הזו תהיה הצלחה עד ביאת המשיח, ועל זה אני צריך חיזוק; והם הבטיחו לו. וכשאדמו\"ר הזקן חזר מפּעטערבורג הוא אמר, את ההבטחה יש לי מהם, אבל יש לי בקשה, שלא להתווכח כלל עם המתנגדים ושלא להתפאר בפניהם.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FPurim_5706.pdf&title=%D7%A4%D7%95%D7%A8%D7%99%D7%9D+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "מבול", "desc": "פתגם על היונה", "page": 23, "sichah": "יום א' דחג הפסח תש\"ו", "excerpt": "ד. (ישנו פתגם מקובל רבי מפי רבי, ש)כשנודע לאדמו\"ר הזקן האחריות שבשליחותו, הוא לא נח עד שהיה לו מנין משלו, וכשהיה לו מנין אברכים משלו הוא ידע שכבר פעל משהו בדרכו החדשה. ב\"ה, לנו באמריקא כבר יש מקום מנוחה, אמנם ישנו ה'הו־האַ' של חיי הגשם האמריקאיים, הרעש וכו', אבל ב\"ה כבר יש לנו מקום מנוחה, אבל אסור לנו להסתפק בזאת, עכשיו צריך להתחיל לפעול. ע\"ד שכתוב אחרי המבול ש\"ולא מצאה היונה מנוח לכף רגלה\", לכאורה - כיצד יכול להיות מנוחה לכף הרגל, לכאורה המנוחה מגיעה מהתענוג, גילוי עצם הנפש, א\"כ כיצד יכול להיות לעקב מנוחה? אלא הענין הוא שכל הכוונה במנוחה היא שהמנוחה תרד עד לכף הרגל היינו שתרד לבפועל ממש. מעלת הרגל היא הרי שהיא מעמידה את כל הציור־אדם, בלי הרגל אפשר ליפול ולהכשל, אבל ע\"י הרגל ציור האדם הוא על מקומו, אבל הכוונה היא להוריד את מדריגת המנוחה לכף הרגל, למדריגה הנמוכה ביותר דהיינו למעשה בפועל ממש, וזאת היא מנוחה ורגיעה.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FYom_Alef_Pesach_5706.pdf&title=%D7%99%D7%95%D7%9D+%D7%90%27+%D7%93%D7%97%D7%92+%D7%94%D7%A4%D7%A1%D7%97+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "מוחין", "desc": "גילוי המ. של המגיד הפך אדה\"ז לחסיד", "page": 15, "sichah": "כ' כסלו תש\"ו", "excerpt": "הרבי - הכוונה לאדמו\"ר הזקן - הגאון מקובל וחקרן הלטאי, נהיה חסיד מסור לא על  ידי  ההתפעלות  מהאופנים  ושרפים,  אלא על ידי גילוי המוחין של המגיד ממעזריטש.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2F20_Kislev_5706.pdf&title=%D7%9B%27+%D7%9B%D7%A1%D7%9C%D7%95+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "מידות", "desc": "תיקון המ", "page": 2, "sichah": "ליל א' דחג הסוכות תש\"ו", "excerpt": "הרבה יותר קל לפעול מוחין דגדלות לחדש בתורה, מאשר לפעול תיקון המידות.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Alef_Sukkos_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%90%27+%D7%93%D7%97%D7%92+%D7%94%D7%A1%D7%95%D7%9B%D7%95%D7%AA+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "מידות טובות", "desc": "עבודת החסידות", "page": 40, "sichah": "י\"ב תמוז תש\"ו", "excerpt": "ענינו של עבודת החסידות הוא, להכיר את עצמך ולפעול עם עצמך. לא רק לקנות מידות־טובות, שבמידות־טובות אין הכוונה רק למידות הטובות על פי דיני התורה, אלא למידות הטובות על פי חסידות. אכן זה באמת טוב מאוד, אבל זה עדיין לא חסיד - עבודתו של חסיד הוא להכיר את עצמו, וזה בא על ידי ניגון. ניגון מראה לחסיד היכן הוא נמצא, כיצד צריך הוא להיות והיכן מסוגל הוא להיות. וזהו על ידי התגלות העצם - עצם הנשמה. ניגון הוא פתח ושער שעל ידו אפשר להגיע להיכן שצריכים להיות. בנגינה לא מתכוונים רק לנגן אלא לבטא את הנפש בניגון (אויסזינגען זיך), שהתגלות העצם מתנגנת (מתבטאת) בניגון.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2F12_Tammuz_5706.pdf&title=%D7%99%22%D7%91+%D7%AA%D7%9E%D7%95%D7%96+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "מלאך מיכאל", "desc": "עבודה קלה אחרי הבעש\"ט, מביא לבבות המס\"נ", "page": 32, "sichah": "ליל אחרון של פסח תש\"ו", "excerpt": "אבל היום, כשהוא מביא את הלבבות של מס\"נ, אפילו של כאלו שאינם שומרי שבת ואינם מניחי תפילין ר\"ל, שאינם אשמים בכך, זה הרי רק מצד העם־ארצות של אלו שמסיתים ומדיחים. האמת היא שכשהמנהיגים יעשו תשובה היהודים יֵרָאו לגמרי אחרת, אבל אפילו אלו אומרים: \"מה שאנו - אנו, אבל יהודים הננו\"; המס\"נ שהתגלה אצלם להלחם ולהגן הרי זה מצד העצם, כשהשונא רצה ש\"ולא יזכר שם ישראל עוד\" ח\"ו, זה נגע אצלם בעצם והם הלכו במס\"נ - אם כן למלאך מיכאל יש עבודה קלה, שהרי היהודים עברו את כל סוגי הנסיונות. די למשחקים! הגיע הזמן לגאולה ע\"י משיח בקרוב.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2F21_Leil_Acharon_shel_Pesach_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%90%D7%97%D7%A8%D7%95%D7%9F+%D7%A9%D7%9C+%D7%A4%D7%A1%D7%97+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "מלך", "desc": "שכל שלו", "page": 4, "sichah": "ליל שמיני עצרת תש\"ו", "excerpt": "א. בחיים של 'עבודה' יש הפרש בין העבודה של שמיני עצרת לעבודה של שמחת תורה, וההפרש הוא: שמיני עצרת הוא כמו מלך בהיכלו, שלא כולם יכולים להכנס להיכל המלך, וכשכן נכנסים להיכל המלך אפילו השר מתבטל כמו (\"אזוי ווי\") עבד. ביטולו של השר אינו יותר מאשר \"כמו\" ביטולו של העבד. כשאומרים \"ווי\" הכוונה - כמו זהו עדיין לא ביטול בכל עצמותו. לשר יש שכל, לעבד אין שום שכל משלו, המלך נותן לו את שכלו. הביטול של העבד והשכל של המלך הם צמד נאה. וזה ההפרש בין אם מתחילים את העבודה בקבלת עול ואחר כך מבינים, לבין אם מתחילים בהבנה ולאחר מכן עושים. ההפרש מובן לכל.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Shmini_Atzeres_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%A9%D7%9E%D7%99%D7%A0%D7%99+%D7%A2%D7%A6%D7%A8%D7%AA+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "מלמד", "desc": "ר' יקותיאל סיפר סיפורים", "page": 31, "sichah": "ליל אחרון של פסח תש\"ו", "excerpt": "כשרק התחלתי לדבר, כילד בן 3 בערך, אבי היה שואל אותי: מה אתה זוכר? - הייתי מצייר [מדמיין] לעצמי - והייתי עונה: אני זוכר את סבא - המהר\"ש נ\"ע - שהוא תמיד נשא שתי שרשראות זהב על הוועסט שלו - כידוע שהמהר\"ש נ\"ע נשא תמיד 2 שעונים בכיסו - והטלית קטן בלט מהוועסט שלו, ואבי היה אומר לי לצייר את זה לעצמי. הוא פיתח אצלי את חוש הציור. כשלמדתי אצל המלמד הראשון שלי, ר' יקותיאל, ודרכו היתה שאחרי הלימוד הוא היה מספר סיפורי מעשיות שהי' בהם עניני הפלאה, סיפורים שגם לגדולים היו פלא ומכל שכן לילדים, הייתי מצייר לעצמי את מה שסיפר. אח\"כ למדתי אצל המלמד ר' ניסן. וכמו\"כ בכל ענין בלימוד דא\"ח ציירתי לעצמי הענין. אבי אמר לי פעם: כח הציור הציל אותך. ועל ידי זה התפתח אצלי חוש הציור (עד שיש כמה דברים שהנני זוכר, ואיני יודע אם ראיתי את בעצמי הדבר או שזהו מה שציירתי לעצמי ממה ששמעתי).", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2F21_Leil_Acharon_shel_Pesach_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%90%D7%97%D7%A8%D7%95%D7%9F+%D7%A9%D7%9C+%D7%A4%D7%A1%D7%97+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "מנהגים", "desc": "אצל אדנ\"ע היו גלויים ונסתרים", "page": 37, "sichah": "יום ב' דחג השבועות תש\"ו", "excerpt": "א. אצל אבא (אדמו\"ר הרש\"ב) היו מנהגים גלויים ומנהגים נסתרים, ענינים כאלו שהוא היה עושה אותם בסתר באופן שאף אחד לא ידע ולא ירגיש כלל, היות שיש סוג של סוד שעל אף שלא יודעים אותו, עדיין מרגישים שישנו איזה דבר הנעלם, אבל אצל אבא לא הרגישו שום דבר, מאחר והוא לא רצה שימשכו אחרי ענינים חיצוניים. הוא דרש אמת.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FYom_Beis_Shavuos_5706.pdf&title=%D7%99%D7%95%D7%9D+%D7%91%27+%D7%93%D7%97%D7%92+%D7%94%D7%A9%D7%91%D7%95%D7%A2%D7%95%D7%AA+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "מסירות־נפש", "desc": "לאדה\"ז", "page": 1, "sichah": "ליל א' דחג הסוכות תש\"ו", "excerpt": "ב. דבר ידוע הוא בקרב החסידים, שלאדמו\"ר הזקן היתה מסירות נפש בפועל על מנהגי קודש הקודשים מורנו הבעש\"ט.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Alef_Sukkos_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%90%27+%D7%93%D7%97%D7%92+%D7%94%D7%A1%D7%95%D7%9B%D7%95%D7%AA+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "מסירות־נפש", "desc": "של אדה\"ז על תיקון חב\"ד", "page": 13, "sichah": "ש\"פ וישלח, י\"ט כסלו תש\"ו", "excerpt": "ג. יש לי סוד לגלות לכם, בח\"י אלול תרנ\"ה אבי קרא לי שאכנס אליו ולמד איתי (ההדרכה בדרכי החסידות), ואמר לי שאצל הרביים זה התחיל בגיל עשר אבל אצלי (כ\"ק אדמו\"ר שליט\"א) זה הי' בגיל חמש עשרה, בגלל הנסיעות. ואבי גילה לי סוד - שלאדמו\"ר הזקן היה מידי שנה בשלושת החודשים מח\"י אלול עד י\"ט כסלו מסירות נפש על תיקון החב\"ד.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FShabbos_Vayishlach_19_Kislev_5706.pdf&title=%D7%A9%22%D7%A4+%D7%95%D7%99%D7%A9%D7%9C%D7%97%2C+%D7%99%22%D7%98+%D7%9B%D7%A1%D7%9C%D7%95+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "מסירות־נפש", "desc": "מסירת הרצון", "page": 15, "sichah": "כ' כסלו תש\"ו", "excerpt": "עבודת מסירת הגוף הוא להכשיר את הגוף על ידי קיום המצוות, שהגוף ירצה לעשות את כל מה שצריך לעשות בקיום מצוות מעשיות ובמידות טובות, ולא ירצה לעשות את מה שאסור לעשות על פי התורה, ומסירות הנפש הוא למסור את הרצון לאלוקות, זאת אומרת למסור את הלמעלה מן השכל לאלוקות.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2F20_Kislev_5706.pdf&title=%D7%9B%27+%D7%9B%D7%A1%D7%9C%D7%95+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "מסירות־נפש", "desc": "של אדה\"ז בשביל הצלחת החסידים", "page": 20, "sichah": "פורים תש\"ו", "excerpt": "ה. כשאדמו\"ר הזקן היה במאסר במבצר פּעטעראָפּאַוואָלסקי בפּעטערבורג, הגיעו אליו הבעש\"ט והמגיד לבקר אותו ולחזקו. הרבי אמר להם: אינני צריך שום חיזוק כי קיבלתי על עצמי מסירת הגוף, אלא שבמסירות הנפש שלי אני רוצה לפעול שכל אלו שירצו ללכת בדרך הזו יצליחו, ושלדרך הזו תהיה הצלחה עד ביאת המשיח, ועל זה אני צריך חיזוק; והם הבטיחו לו. וכשאדמו\"ר הזקן חזר מפּעטערבורג הוא אמר, את ההבטחה יש לי מהם, אבל יש לי בקשה, שלא להתווכח כלל עם המתנגדים ושלא להתפאר בפניהם.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FPurim_5706.pdf&title=%D7%A4%D7%95%D7%A8%D7%99%D7%9D+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "מסירות־נפש", "desc": "לבבות המס\"נ היום אפי' שלא שומרים שבת וכו'", "page": 32, "sichah": "ליל אחרון של פסח תש\"ו", "excerpt": "אבל היום, כשהוא מביא את הלבבות של מס\"נ, אפילו של כאלו שאינם שומרי שבת ואינם מניחי תפילין ר\"ל, שאינם אשמים בכך, זה הרי רק מצד העם־ארצות של אלו שמסיתים ומדיחים. האמת היא שכשהמנהיגים יעשו תשובה היהודים יֵרָאו לגמרי אחרת, אבל אפילו אלו אומרים: \"מה שאנו - אנו, אבל יהודים הננו\"; המס\"נ שהתגלה אצלם להלחם ולהגן הרי זה מצד העצם, כשהשונא רצה ש\"ולא יזכר שם ישראל עוד\" ח\"ו, זה נגע אצלם בעצם והם הלכו במס\"נ - אם כן למלאך מיכאל יש עבודה קלה, שהרי היהודים עברו את כל סוגי הנסיונות. די למשחקים! הגיע הזמן לגאולה ע\"י משיח בקרוב.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2F21_Leil_Acharon_shel_Pesach_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%90%D7%97%D7%A8%D7%95%D7%9F+%D7%A9%D7%9C+%D7%A4%D7%A1%D7%97+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "מסירת הגוף", "desc": "מצוות מעשיות במידות טובות", "page": 15, "sichah": "כ' כסלו תש\"ו", "excerpt": "עבודת מסירת הגוף הוא להכשיר את הגוף על ידי קיום המצוות, שהגוף ירצה לעשות את כל מה שצריך לעשות בקיום מצוות מעשיות ובמידות טובות, ולא ירצה לעשות את מה שאסור לעשות על פי התורה, ומסירות הנפש הוא למסור את הרצון לאלוקות, זאת אומרת למסור את הלמעלה מן השכל לאלוקות.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2F20_Kislev_5706.pdf&title=%D7%9B%27+%D7%9B%D7%A1%D7%9C%D7%95+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "מעמד", "desc": "מצד הרוחני בזה", "page": 39, "sichah": "כ\"א סיון תש\"ו", "excerpt": "כמו כן גם בענין המעמד, אף שצריכים לממון עבור ענין ההוצאה, ועבור ענינים כאלו שלא רוצים לא צריכים ולא יכולים לדבר אודותם, מכל מקום העיקר צריך להיות הצד הרוחני שבזה והגשמיות הוא בדרך ממילא.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2F21_Sivan_5706.pdf&title=%D7%9B%22%D7%90+%D7%A1%D7%99%D7%95%D7%9F+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "מצודות", "desc": "אדה\"ז חיבב", "page": 5, "sichah": "ליל שמחת תורה תש\"ו", "excerpt": "ג. כל אחד צריך לקבוע שיעור ללמוד את פירוש המילות של התפילה. צריך ללמוד את פסוקי התורה במקור, רש\"י ורמב\"ם או אבן עזרא וכמו כן ללמוד את פסוקי הנ\"ך במקור. הרבי חיבב את המצודות.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Simchas_Torah_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%A9%D7%9E%D7%97%D7%AA+%D7%AA%D7%95%D7%A8%D7%94+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "מרירות", "desc": "אצל רחד\"ל", "page": 6, "sichah": "ש\"פ נח בסעודת הלילה", "excerpt": "ב. (הרש\"ל סיפר שזקנו הרג\"ד התארח בהיותו בנעוועל אצל השו\"ב ר' חיים דוד ליין - העיר כ\"ק אד\"ש: בנערותו למד בסלוצק ואח\"כ התקרב לעדת החסידים - בתחלה לא נשא חן בעיניהם בהיותו במרירות וכו' והם היו מורגלים בהתפשטות וכו', ואח\"כ שמעוהו קורא תהלים: \"עד אנא תשכחני וגו'\" וזה עשה עליהם רושם גדול.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Shabbos_Noach_5706.pdf&title=%D7%A9%22%D7%A4+%D7%A0%D7%97+%D7%91%D7%A1%D7%A2%D7%95%D7%93%D7%AA+%D7%94%D7%9C%D7%99%D7%9C%D7%94"}, {"t": "i", "topic": "משכיל", "desc": "מורד בעצמות", "page": 42, "sichah": "עש\"ק פ' שופטים, כ\"ו מנחם־אב תש\"ו", "excerpt": "ג. כ\"ק אדמו\"ר שליט\"א ממשיך לספר: שכ\"ק אאמו\"ר היה מספר לו הרבה סיפורים מלבד מה שסיפר ברבים, הי' מספר לו ביחידות הרבה סיפורים. ושמע פעם מכ\"ק אאמו\"ר, ש\"עצמוּת נשבע שלמשכיל הוא לא יתגלה\", אלא יתגלה רק על ידי עבודה, בלימוד החסידות בעבודה מתגלה עצמותו. ופעם אמר כ\"ק אאמו\"ר שהמשכיל מורד בעצמות (ומבאר כ\"ק אדמו\"ר שליט\"א, שמורד גרוע מפוגם, מורד הוא עניין של זדון).", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FErev_Shabbos_Shoftim_26_Menachem_Av_5706.pdf&title=%D7%A2%D7%A9%22%D7%A7+%D7%A4%27+%D7%A9%D7%95%D7%A4%D7%98%D7%99%D7%9D%2C+%D7%9B%22%D7%95+%D7%9E%D7%A0%D7%97%D7%9D%D6%BE%D7%90%D7%91+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "מתינות", "desc": "בכל דבר וגם בניגון", "page": 7, "sichah": "ש\"פ נח בסעודת הלילה", "excerpt": "ז. צוה לנגן ואמר שכ\"ק אדנ\"ע אמר שאוהב הוא בכל ענין מתינות וגם בנגינה צריך להיות כן. ח. קרה אצל כ\"ק אדנ\"ע שבאמצע כתיבת מאמר דא\"ח - שהיה כותב בכיפה (בלבד) - הי' מפסיק, מניח מטפחת על הכתב, לובש הכובע ומנגן. ואמר: זהו בשביל להגיע לכך שהענין יהי' מונח.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Shabbos_Noach_5706.pdf&title=%D7%A9%22%D7%A4+%D7%A0%D7%97+%D7%91%D7%A1%D7%A2%D7%95%D7%93%D7%AA+%D7%94%D7%9C%D7%99%D7%9C%D7%94"}, {"t": "i", "topic": "מתן תורה", "desc": "הקב\"ה בחר ביהודים מצד עצמם", "page": 38, "sichah": "יום ב' דחג השבועות תש\"ו", "excerpt": "אדמו\"ר הזקן ענה שהוא קיבל במעזריטש, מהו הקב\"ה ומהו יהודי, היוקר של היהודים אצל הקב\"ה והיוקר של הקב\"ה אצל היהודים. לפני\"ז גם כן היה אהבת ישראל אבל זה היה מצד יוקר התורה, אהבו יהודי מצד ידיעתו בתורה, ממילא היו שני דברים נפרדים: היהודי וידיעתו בתורה. חסידות פעלה אהבת ישראל - לאהוב יהודי כי הוא יהודי. במתן תורה הקב\"ה בחר ביהודים, עם סגולה לה' אלקיך, וזו היתה בחירה ביהודים מצד העצם, בגלל זה שהם יהודים, וכך צריכה להיות האהבת ישראל - לאהוב מצד זה שהוא יהודי.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FYom_Beis_Shavuos_5706.pdf&title=%D7%99%D7%95%D7%9D+%D7%91%27+%D7%93%D7%97%D7%92+%D7%94%D7%A9%D7%91%D7%95%D7%A2%D7%95%D7%AA+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "מתנגדים", "desc": "לא להתווכח עם המ", "page": 20, "sichah": "פורים תש\"ו", "excerpt": "והתחיל לדבר כ\"ק אדמו\"ר שליט\"א, שכמו\"כ צריכים להתנהג: צריך לא להתווכח כלל עם המתנגדים; צריכים להתנהג באופן שיראו את דרך הטוב. אם הזולת מאפשר - צריך לעשות טובה ליהודי. ואם הוא שוטה וטיפש, ובמילא הוא גם מה שכתוב בהמשך (רשע וגס רוח), לא צריך. עם שוטה פתי - גם אחרי ק\"כ שנה בג\"ע לא נוח להיות.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FPurim_5706.pdf&title=%D7%A4%D7%95%D7%A8%D7%99%D7%9D+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "ניגון", "desc": "צריך לחדור בפנימיות", "page": 1, "sichah": "ליל א' דחג הסוכות תש\"ו", "excerpt": "זהו ניגון פנימי; ניגון פנימי צריך לחדור (דורכנעמען) בפנימיות, ואינו צריך להיות ניכר בחיצוניות. הוא צריך לתפוס את הפנימיות, ובחיצוניות אינו צריך להיות ניכר.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Alef_Sukkos_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%90%27+%D7%93%D7%97%D7%92+%D7%94%D7%A1%D7%95%D7%9B%D7%95%D7%AA+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "ניגון", "desc": "בתפילה, געגועים תקווה", "page": 3, "sichah": "יום א' דחג הסוכות תש\"ו", "excerpt": "הוד כ\"ק אאמו\"ר הרה\"ק ענה: הנגינה היא מעמד הנפש המתבטאת בניגון. יש ניגון שמגיע מהגעגועים שיש למנגן, יש ניגוני תקווה ויש ניגוני התמרמרות, וכך ישנם ניגונים מסוגים שונים המתארים את מעמד נפש של המנגן. חסידים מנגנים בתפילה כי הקול מעורר הכוונה. בכדי להבין ענין פנימי צריך לנגן, ואצל חסיד, כשבשעת התפילה ענין מסויים", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FYom_Alef_Sukkos_5706.pdf&title=%D7%99%D7%95%D7%9D+%D7%90%27+%D7%93%D7%97%D7%92+%D7%94%D7%A1%D7%95%D7%9B%D7%95%D7%AA+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "ניגון", "desc": "מעורר לעבודה, נ. מיוחד לכל ענין", "page": 4, "sichah": "יום שבת חוה\"מ סוכות תש\"ו", "excerpt": "קול מעורר הכוונה. לחסידי רבינו הזקן, לחסידי אדמו\"ר האמצעי ולחסידי הסבא, היה ניגון מיוחד לכל ענין בעבודת החסידות והחסידים, ניגון התעוררות לפני שמיעת חסידות ואחרי שמיעת חסידות, לפני יחידות ואחרי יחידות…", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FShabbos_Chol_HaMoed_Sukkos_5706.pdf&title=%D7%99%D7%95%D7%9D+%D7%A9%D7%91%D7%AA+%D7%97%D7%95%D7%94%22%D7%9E+%D7%A1%D7%95%D7%9B%D7%95%D7%AA+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "ניגון", "desc": "פעל על חסידים הראשונים", "page": 6, "sichah": "ש\"פ נח בסעודת הלילה", "excerpt": "סיפר לי: שמעתי מחסידים הראשונים (של אדמו\"ר הזקן), שנתקרבו לחסידות על ידי התפילה בנגינה - הניגונים החסידיים פעלו עליהם. וסיים (הרג\"ד): הנני מתמרמר על שאיני מנגן - אף שהנני גם כן כבד פה אין זה נוגע לי כל כך - והנני חושב זה לי לעונש. וזלגו עיני דמעות.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Shabbos_Noach_5706.pdf&title=%D7%A9%22%D7%A4+%D7%A0%D7%97+%D7%91%D7%A1%D7%A2%D7%95%D7%93%D7%AA+%D7%94%D7%9C%D7%99%D7%9C%D7%94"}, {"t": "i", "topic": "ניגון", "desc": "פותח כל המנעולים, במתינות", "page": 7, "sichah": "ש\"פ נח בסעודת הלילה", "excerpt": "ו. אמר כ\"ק אדנ\"ע: לכל חותם (מנעול) יש מפתח המיוחד לו. אצל האומן יש כלי שבאמצעותו יכול לפתוח כל החותמות וזהו ענין הנגינה.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Shabbos_Noach_5706.pdf&title=%D7%A9%22%D7%A4+%D7%A0%D7%97+%D7%91%D7%A1%D7%A2%D7%95%D7%93%D7%AA+%D7%94%D7%9C%D7%99%D7%9C%D7%94"}, {"t": "i", "topic": "ניגון", "desc": "לנגן בתפילה בפַּשטות", "page": 10, "sichah": "ליל ש\"פ לך", "excerpt": "ז. על המשפיעים מונח החוב ללמד את התלמידים להתפלל, לא מאמרים על התפילה, אלא ללמד אותם כיצד להתפלל. צריך לנגן ניגון, לא עם חזנות אלא לנגן בפשטות. לאו דוקא ניגון שלם, אפילו תנועה אחת שוב ושוב.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FLeil_Shabbos_Lech_Lecha_5706.pdf&title=%D7%9C%D7%99%D7%9C+%D7%A9%22%D7%A4+%D7%9C%D7%9A"}, {"t": "i", "topic": "ניגון", "desc": "בתפילה ע\"מ לתפוס", "page": 14, "sichah": "ש\"פ וישלח, י\"ט כסלו תש\"ו", "excerpt": "ט. פעם שאלו את אדמו\"ר הזקן מדוע חסידים מנגנים בתפילה? וענה: בתפילה נדרש שהיא \"תתפוס\" את המתפלל, שהוא יתעורר, וכאשר התפילה \"תתפוס\" אותו, אזי הניגון יבוא מאליו (\"זינגט זיך\"). וסיים כ\"ק אדמו\"ר שליט\"א: צריך לשיר ניגון באופן שהניגון \"יתפוס\". כשמנגנים אין צורך לצעוק את הניגון, זהו \"קול כסיל\", אלא לנגן ניגון פנימי, שהוא \"יתפוס\".", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FShabbos_Vayishlach_19_Kislev_5706.pdf&title=%D7%A9%22%D7%A4+%D7%95%D7%99%D7%A9%D7%9C%D7%97%2C+%D7%99%22%D7%98+%D7%9B%D7%A1%D7%9C%D7%95+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "ניגון", "desc": "לשיר באופן שיתפוס - לא לצעוק", "page": 15, "sichah": "ש\"פ וישלח, י\"ט כסלו תש\"ו", "excerpt": "וסיים כ\"ק אדמו\"ר שליט\"א: צריך לשיר ניגון באופן שהניגון \"יתפוס\". כשמנגנים אין צורך לצעוק את הניגון, זהו \"קול כסיל\", אלא לנגן ניגון פנימי, שהוא \"יתפוס\".", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FShabbos_Vayishlach_19_Kislev_5706.pdf&title=%D7%A9%22%D7%A4+%D7%95%D7%99%D7%A9%D7%9C%D7%97%2C+%D7%99%22%D7%98+%D7%9B%D7%A1%D7%9C%D7%95+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "ניגון", "desc": "ענין הנ", "page": 18, "sichah": "פורים תש\"ו", "excerpt": "והוא קיבל במעזריטש גם את הענין של ניגון. ניגון הוא על מנת לצאת מהיכן שנמצאים כעת ולהגיע למקום שבו צריכים להיות.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FPurim_5706.pdf&title=%D7%A4%D7%95%D7%A8%D7%99%D7%9D+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "ניגון", "desc": "אדה\"ז שר בשובו ממעזריטש ותירץ הקושיות", "page": 19, "sichah": "פורים תש\"ו", "excerpt": "כשאדמו\"ר הזקן חזר ממעזריטש לוויטעבסק, והוא רצה לתפוס את האברכים הלמדנים הוא שר להם ניגון. כידוע שלאדמו\"ר הזקן היו עשר ניגונים, ובהניגון הזה שהוא שר להם הם הגיעו לדביקות והם כלו כמו נר, ואז האיר אצלם אור התורה, ובדרך ממילא תורצו להם כל השאלות וקושיות. ולאח\"ז בהמשך הזמן הם נרדמו באמצע.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FPurim_5706.pdf&title=%D7%A4%D7%95%D7%A8%D7%99%D7%9D+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "ניגון", "desc": "אדה\"ז קיבל במעזריטש ענין הנ. בנ. משתקף האני החסידי", "page": 21, "sichah": "סדר הראשון של חג הפסח תש\"ו", "excerpt": "כאשר אדמו\"ר הזקן חזר בפעם הראשונה ממעזריטש - בחזרתו ממעזריטש הוא היה באופן אחר לגמרי - לוויטעבסק מקום מגורו, היה - ותהום כל העיר. כששאלו את אדמו\"ר הזקן מה הוא קיבל במעזריטש הוא ענה. שבמעזריטש נודעו לו שלושה דברים: מהו הקב\"ה, מהם יהודים, ישראל אורייתא וקוב\"ה כולא חד, ומה זה ניגון. בפסח הראשון לאחר שחזר ממעזריטש הוא ניגן הרבה מאד.", "url": "https://sichotmeturgamot.github.io/read.html?file=pdfs%2FSeder_Rishon_Pesach_5706.pdf&title=%D7%A1%D7%93%D7%A8+%D7%94%D7%A8%D7%90%D7%A9%D7%95%D7%9F+%D7%A9%D7%9C+%D7%97%D7%92+%D7%94%D7%A4%D7%A1%D7%97+%D7%AA%D7%A9%22%D7%95"}, {"t": "i", "topic": "ניגון", "desc": "המציא כדי לקרב היהודים הפשוטים ולגלות שרש נשמתם, אדה\"ז שר נ. ל
