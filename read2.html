<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<!-- מאפשר צביטה להגדלה (pinch-zoom) של הדפדפן -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>קריאה — ספר השיחות מתורגם ללה״ק</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Heebo:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #525659; font-family: 'Heebo', sans-serif; }

  /* סרגל עליון */
  .bar {
    position: sticky; top: 0; z-index: 10;
    background: #1a2942; color: #fff;
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; border-bottom: 2px solid #b8933e;
  }
  .bar .title {
    font-family: 'Frank Ruhl Libre', serif; font-size: 1rem;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1;
  }
  .bar a {
    color: #fff; text-decoration: none; font-size: .85rem;
    background: #b8933e; border-radius: 8px; padding: 6px 14px; white-space: nowrap;
  }
  .bar a.line { background: transparent; border: 1px solid rgba(255,255,255,.55); }

  #hint { color: #cfd3da; text-align: center; font-size: .8rem; padding: 10px 20px 0; }

  /* העמודים — זה מתחת לזה, מותאמים לרוחב */
  #pages { padding: 12px 8px 28px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  #pages canvas {
    background: #fff; box-shadow: 0 4px 18px rgba(0,0,0,.4);
    width: 100%; max-width: 820px; height: auto; display: block;
  }

  #msg { color: #fff; text-align: center; padding: 60px 20px; font-size: 1.05rem; }
  #msg a { color: #d4b56a; }
</style>
</head>
<body>

<div class="bar">
  <span class="title" id="title">טוען…</span>
  <a id="dl" download>הורדה ⬇</a>
  <a class="line" href="index.html">לאתר</a>
</div>

<div id="hint">להגדלה — צביטה עם שתי אצבעות</div>
<div id="pages"></div>
<div id="msg" style="display:none"></div>

<script type="module">
import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.7.76/build/pdf.min.mjs';

const PDFJS_BASE = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.7.76/';
pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_BASE + 'build/pdf.worker.min.mjs';

const params = new URLSearchParams(location.search);
const file  = params.get('file') || '';
const title = params.get('title') || 'קריאת השיחה';
const startPage = parseInt((params.get('page') || '').replace(/[^0-9]/g, ''), 10) || 0;

const $ = id => document.getElementById(id);
$('title').textContent = title;
document.title = title + ' — ספר השיחות מתורגם ללה״ק';
$('dl').href = file;

function showError(html){
  $('pages').style.display = 'none';
  $('hint').style.display = 'none';
  $('msg').style.display = 'block';
  $('msg').innerHTML = html;
}

// הגנה: מציגים רק קבצי PDF מתוך האתר עצמו
if (!file || file.indexOf('//') !== -1 || file.indexOf('..') !== -1 || !/\.pdf$/i.test(file)) {
  showError('לא נמצא קובץ להצגה.');
} else {
  start();
}

// מעקב קריאה (נשמר רק בדפדפן של הגולש)
try {
  const readSet = JSON.parse(localStorage.getItem('sichos-read') || '{}');
  readSet[file] = Date.now();
  localStorage.setItem('sichos-read', JSON.stringify(readSet));
  localStorage.setItem('sichos-last', JSON.stringify({ file: file, title: title, at: Date.now() }));
} catch (e) {}

// גבולות גודל קנבס בטוחים (אייפון מגביל נמוך; אנדרואיד גבוה)
const IS_IOS = /iphone|ipad|ipod/i.test(navigator.userAgent) ||
               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const MAX_SIDE = IS_IOS ? 4000 : 8192;
const MAX_AREA = (IS_IOS ? 16 : 60) * 1024 * 1024;

async function start(){
  $('msg').style.display = 'block';
  $('msg').textContent = 'טוען את השיחה…';
  try {
    const task = pdfjsLib.getDocument({
      url: file,
      // ציור האותיות ישירות מהגופן המוטמע — מתקן את פיזור העברית בטלפון
      disableFontFace: true,
      useSystemFonts: false
    });
    const pdf = await task.promise;
    $('msg').style.display = 'none';

    const dpr = window.devicePixelRatio || 1;
    // רוחב התצוגה של כל עמוד (מותאם לרוחב, עד 820px)
    const availCss = Math.min($('pages').clientWidth - 16, 820);

    let target = null;
    for (let n = 1; n <= pdf.numPages; n++){
      const page = await pdf.getPage(n);
      const base = page.getViewport({ scale: 1 });

      const fitScale = availCss / base.width;
      // מרנדרים בפי-2 מצפיפות המסך — כדי שגם בצביטה להגדלה הטקסט יישאר חד
      let renderScale = fitScale * dpr * 2;
      let w = base.width * renderScale, h = base.height * renderScale;
      const clamp = Math.min(MAX_SIDE / w, MAX_SIDE / h, Math.sqrt(MAX_AREA / (w * h)), 1);
      renderScale *= clamp;

      const vp = page.getViewport({ scale: renderScale });
      const canvas = document.createElement('canvas');
      canvas.width  = Math.floor(vp.width);
      canvas.height = Math.floor(vp.height);
      // התצוגה מותאמת לרוחב (ה-CSS מטפל); הצביטה של הדפדפן מגדילה בלי לאבד חדות
      $('pages').appendChild(canvas);
      await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;

      if (startPage && n === startPage) target = canvas;
    }

    // אם התבקש עמוד מסוים (קישור ממפתח) — גוללים אליו
    if (target) target.scrollIntoView({ block: 'start' });
  } catch (err) {
    showError('לא ניתן להציג את הקובץ כרגע. אפשר <a href="' + file + '">להוריד אותו ישירות</a>.<br><small style="opacity:.6">' + (err && err.message ? err.message : '') + '</small>');
  }
}
</script>
</body>
</html>
