<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>קריאה — ספר השיחות מתורגם ללה״ק</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Heebo:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #525659;
    font-family: 'Heebo', sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .bar {
    flex: 0 0 auto;
    background: #1a2942;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    border-bottom: 2px solid #b8933e;
    flex-wrap: wrap;
  }
  .bar .title {
    font-family: 'Frank Ruhl Libre', serif;
    font-size: 1rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1 1 120px;
    min-width: 0;
  }
  .bar a, .bar button {
    color: #fff;
    text-decoration: none;
    font-size: .85rem;
    font-family: 'Heebo', sans-serif;
    background: #b8933e;
    border: none;
    border-radius: 8px;
    padding: 7px 12px;
    white-space: nowrap;
    cursor: pointer;
    min-height: 36px;
  }
  .bar a.line, .bar button.line {
    background: transparent;
    border: 1px solid rgba(255,255,255,.55);
  }
  #hint {
    flex: 0 0 auto;
    color: #cfd3da;
    text-align: center;
    font-size: .78rem;
    padding: 8px 16px;
    line-height: 1.45;
  }
  #viewer {
    flex: 1 1 auto;
    overflow: auto;
    direction: ltr;
    touch-action: pan-x pan-y;
    -webkit-overflow-scrolling: touch;
  }
  #pagesInner {
    margin: 0 auto;
    padding: 12px 0 110px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  .page { position: relative; width: 100%; }
  .page canvas {
    width: 100%;
    height: auto;
    display: block;
    background: #fff;
    box-shadow: 0 4px 18px rgba(0,0,0,.4);
    position: relative;
    z-index: 1;
  }
  .textLayer {
    position: absolute;
    inset: 0;
    overflow: clip;
    opacity: 1;
    line-height: 1;
    text-align: initial;
    text-size-adjust: none;
    forced-color-adjust: none;
    transform-origin: 0 0;
    z-index: 2;
    user-select: none;
    -webkit-user-select: none;
  }
  .textLayer :is(span, br) {
    color: transparent;
    position: absolute;
    white-space: pre;
    transform-origin: 0 0;
  }
  .textLayer span.markedContent { top: 0; height: 0; }
  .textLayer span.w {
    position: static;
    white-space: pre;
    color: transparent;
    pointer-events: auto;
    cursor: pointer;
    border-radius: 3px;
    -webkit-tap-highlight-color: transparent;
  }
  .textLayer span.w.sel { background: rgba(184,147,62,.45); }
  .textLayer span.w.anchor { background: rgba(184,147,62,.65); }
  .textLayer span.fn { pointer-events: none; }

  #actions {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: max(18px, env(safe-area-inset-bottom));
    z-index: 60;
    display: none;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 96vw;
  }
  #actions.show { display: flex; }
  #actions button {
    background: #b8933e;
    color: #fff;
    border: none;
    border-radius: 26px;
    padding: 13px 20px;
    font-size: .95rem;
    font-family: 'Heebo', sans-serif;
    font-weight: 500;
    box-shadow: 0 6px 20px rgba(0,0,0,.45);
    cursor: pointer;
    white-space: nowrap;
  }
  #share { background: #1a2942; border: 1px solid #b8933e; }
  #clearSel { background: #444; border: 1px solid #888; }

  #toast {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: max(18px, env(safe-area-inset-bottom));
    z-index: 70;
    background: #1a2942;
    color: #fff;
    border: 1px solid #b8933e;
    border-radius: 24px;
    padding: 12px 22px;
    font-size: .95rem;
    box-shadow: 0 6px 20px rgba(0,0,0,.45);
    display: none;
    max-width: 90vw;
    text-align: center;
  }
  #toast.show { display: block; }

  #msg {
    color: #fff;
    text-align: center;
    padding: 60px 20px;
    font-size: 1.05rem;
    margin: auto;
    line-height: 1.7;
  }
  #msg a { color: #d4b56a; }
</style>
</head>
<body>

<div class="bar">
  <a class="line" href="sichos.html">חזרה</a>
  <span class="title" id="title">טוען…</span>
  <button type="button" class="line" id="zoomOut" aria-label="הקטן">−</button>
  <button type="button" class="line" id="zoomIn" aria-label="הגדל">+</button>
  <a id="dl" download>הורדה</a>
</div>

<div id="hint">
  לציטוט: הקישו על המילה הראשונה ואז על האחרונה · להגדלה: צביטה או +/−
</div>

<div id="viewer"><div id="pagesInner"></div></div>
<div id="msg" style="display:none"></div>

<div id="actions">
  <button type="button" id="cite">העתק ציטוט</button>
  <button type="button" id="share">שתף ציטוט</button>
  <button type="button" id="clearSel">ביטול</button>
</div>
<div id="toast"></div>

<!-- data.js נטען דינמית כדי לשאוב שם שיחה רשמי מהקטלוג -->
<script>
(function () {
  var s = document.createElement('script');
  s.src = 'data.js?v=' + Date.now();
  s.onerror = function () {};
  document.head.appendChild(s);
})();
</script>

<script type="module">
/**
 * קורא שיחות — PDF.js (CDN) + ציטוט בהקשה
 * מספיק להעלות את הקובץ הזה; אין חובה בתיקיית pdfjs/ מקומית.
 */

const PDFJS_CDN = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.7.76/';
import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.7.76/build/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_CDN + 'build/pdf.worker.min.mjs';

const params = new URLSearchParams(location.search);
const file = params.get('file') || '';
const titleFromUrl = params.get('title') || 'קריאת השיחה';
const startPage = parseInt((params.get('page') || '').replace(/\D/g, ''), 10) || 0;

/** שם רשמי מהקטלוג (data.js → YEARS) אם נמצא; אחרת מה־URL */
function titleFromCatalog(pdfFile) {
  try {
    if (typeof YEARS === 'undefined' || !Array.isArray(YEARS)) return null;
    for (const y of YEARS) {
      for (const s of y.sichos || []) {
        if (s.file === pdfFile) return s.title || null;
      }
    }
  } catch (_) {}
  return null;
}

function resolveTitle() {
  return titleFromCatalog(file) || titleFromUrl;
}

let displayTitle = titleFromUrl;

const $ = (id) => document.getElementById(id);
const viewer = $('viewer');
const inner = $('pagesInner');
const toastEl = $('toast');
const actionsEl = $('actions');

function setTitleUI(t) {
  displayTitle = t;
  $('title').textContent = t;
  document.title = t + ' — ספר השיחות מתורגם ללה״ק';
}
setTitleUI(displayTitle);
$('dl').href = file;

// אם data.js נטען אחרינו — נעדכן כותרת ברגע שהוא מוכן
(function waitCatalog() {
  let n = 0;
  const t = setInterval(() => {
    n++;
    const cat = titleFromCatalog(file);
    if (cat) {
      setTitleUI(cat);
      clearInterval(t);
    } else if (n > 40) clearInterval(t);
  }, 50);
})();

function showError(html) {
  viewer.style.display = 'none';
  $('hint').style.display = 'none';
  $('msg').style.display = 'block';
  $('msg').innerHTML = html;
}

if (!file || file.includes('//') || file.includes('..') || !/\.pdf$/i.test(file)) {
  showError('לא נמצא קובץ להצגה.');
} else {
  try {
    const rs = JSON.parse(localStorage.getItem('sichos-read') || '{}');
    rs[file] = Date.now();
    localStorage.setItem('sichos-read', JSON.stringify(rs));
    localStorage.setItem(
      'sichos-last',
      JSON.stringify({ file, title: displayTitle, at: Date.now() })
    );
  } catch (_) {}
  start();
}

const IS_IOS =
  /iphone|ipad|ipod/i.test(navigator.userAgent) ||
  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const MAX_SIDE = IS_IOS ? 4000 : 8192;
const MAX_AREA = (IS_IOS ? 16 : 60) * 1024 * 1024;

// ---------- זום ----------
let baseW = 300;
let Z = 1;
const MINZ = 1;
const MAXZ = 4;
const clamp = (v, a, b) => Math.min(Math.max(v, a), b);

function applyZoom() {
  inner.style.width = baseW * Z + 'px';
  document.querySelectorAll('.page').forEach((p) => {
    const tl = p.querySelector('.textLayer');
    const bw = parseFloat(p.dataset.bw);
    if (tl && bw) tl.style.setProperty('--scale-factor', (baseW * Z) / bw);
  });
}

function setZoom(z, fx, fy) {
  z = clamp(z, MINZ, MAXZ);
  const r = viewer.getBoundingClientRect();
  const cx = viewer.scrollLeft + (fx - r.left);
  const cy = viewer.scrollTop + (fy - r.top);
  const s = z / Z;
  Z = z;
  applyZoom();
  viewer.scrollLeft = cx * s - (fx - r.left);
  viewer.scrollTop = cy * s - (fy - r.top);
}

const distOf = (e) =>
  Math.hypot(
    e.touches[0].clientX - e.touches[1].clientX,
    e.touches[0].clientY - e.touches[1].clientY
  );
const midOf = (e) => ({
  x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
  y: (e.touches[0].clientY + e.touches[1].clientY) / 2,
});

let pinch = null;
viewer.addEventListener(
  'touchstart',
  (e) => {
    if (e.touches.length === 2) {
      pinch = { d0: distOf(e), z0: Z };
      e.preventDefault();
    }
  },
  { passive: false }
);
viewer.addEventListener(
  'touchmove',
  (e) => {
    if (pinch && e.touches.length === 2) {
      e.preventDefault();
      const m = midOf(e);
      setZoom((pinch.z0 * distOf(e)) / pinch.d0, m.x, m.y);
    }
  },
  { passive: false }
);
viewer.addEventListener(
  'touchend',
  (e) => {
    if (e.touches.length < 2) pinch = null;
  },
  { passive: true }
);
viewer.addEventListener(
  'wheel',
  (e) => {
    if (e.ctrlKey) {
      e.preventDefault();
      setZoom(Z * (e.deltaY < 0 ? 1.1 : 0.9), e.clientX, e.clientY);
    }
  },
  { passive: false }
);

$('zoomIn').onclick = () => {
  const r = viewer.getBoundingClientRect();
  setZoom(Z * 1.15, r.left + r.width / 2, r.top + r.height / 2);
};
$('zoomOut').onclick = () => {
  const r = viewer.getBoundingClientRect();
  setZoom(Z / 1.15, r.left + r.width / 2, r.top + r.height / 2);
};

// ---------- בחירת ציטוט בהקשה ----------
const tokens = [];
let anchor = null;
let focus = null;

function highlight() {
  const lo = Math.min(anchor, focus == null ? anchor : focus);
  const hi = Math.max(anchor, focus == null ? anchor : focus);
  tokens.forEach((t, i) => {
    t.el.classList.toggle('sel', focus != null && i >= lo && i <= hi);
    t.el.classList.toggle('anchor', focus == null && i === anchor);
  });
}

function clearSel() {
  anchor = null;
  focus = null;
  tokens.forEach((t) => t.el.classList.remove('sel', 'anchor'));
  actionsEl.classList.remove('show');
}

function onWordTap(idx) {
  if (anchor === null || focus !== null) {
    anchor = idx;
    focus = null;
  } else {
    focus = idx;
  }
  highlight();
  actionsEl.classList.toggle('show', focus != null);
}

let pd = null;
inner.addEventListener(
  'pointerdown',
  (e) => {
    pd = { w: e.target.closest('.w'), x: e.clientX, y: e.clientY };
  },
  { passive: true }
);
inner.addEventListener(
  'pointerup',
  (e) => {
    if (!pd) return;
    const w = e.target.closest('.w');
    const moved = Math.hypot(e.clientX - pd.x, e.clientY - pd.y);
    if (moved > 12) {
      pd = null;
      return;
    }
    if (w && w === pd.w) onWordTap(parseInt(w.dataset.idx, 10));
    else if (!w && !e.target.closest('#actions')) clearSel();
    pd = null;
  },
  { passive: true }
);

const SUPER_RE = /[⁰¹²³⁴⁵⁶⁷⁸⁹₀₁₂₃₄₅₆₇₈₉]/g;

function currentCitation() {
  if (anchor === null || focus === null) return null;
  const lo = Math.min(anchor, focus);
  const hi = Math.max(anchor, focus);
  const sel = tokens.slice(lo, hi + 1);
  if (!sel.length) return null;

  let out = '';
  for (let i = 0; i < sel.length; i++) {
    const t = sel[i];
    if (i > 0) {
      const pr = sel[i - 1];
      const lh = t.lineH || 14;
      const dTop = t.top - pr.top;
      if (t.page !== pr.page) out += '\n\n';
      else if (t.item === pr.item) out += ' ';
      else if (Math.abs(dTop) < lh * 0.6) {
        const gap = pr.ix - t.ixe;
        out += Math.abs(gap) > lh * 0.1 ? ' ' : '';
      } else if (dTop > lh * 1.7 || dTop < -lh * 2) out += '\n\n';
      else out += ' ';
    }
    out += t.text;
  }

  // ניקוי: ספרות עיליות שנדבקו למילה + רווחים
  out = out
    .replace(SUPER_RE, '')
    .replace(/\u00ad/g, '')
    .replace(/[ \t]+/g, ' ')
    .replace(/ +([.,;:!?״"»])/g, '$1')
    .replace(/ *\n */g, '\n')
    .replace(/\n{3,}/g, '\n\n')
    .trim();
  if (!out) return null;

  const pageStart = sel[0].page;
  const pageEnd = sel[sel.length - 1].page;
  const pageLabel =
    pageStart === pageEnd
      ? 'עמ׳ ' + pageStart
      : 'עמ׳ ' + pageStart + '–' + pageEnd;

  const name = resolveTitle().replace(/^שיחת\s+/, '').trim();
  const link =
    location.origin +
    location.pathname +
    '?file=' +
    encodeURIComponent(file) +
    '&title=' +
    encodeURIComponent(name) +
    (pageStart ? '&page=' + pageStart : '');

  // גרשיים רגילים (לא « »)
  return (
    '"' +
    out +
    '"\n\n' +
    name +
    ', ' +
    pageLabel +
    '\nספר השיחות מתורגם ללשון הקודש\n' +
    link
  );
}

function toast(t) {
  actionsEl.classList.remove('show');
  toastEl.textContent = t;
  toastEl.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toastEl.classList.remove('show'), 2200);
}

async function copyText(c) {
  try {
    await navigator.clipboard.writeText(c);
    return true;
  } catch (_) {
    try {
      const ta = document.createElement('textarea');
      ta.value = c;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand('copy');
      ta.remove();
      return ok;
    } catch (_) {
      return false;
    }
  }
}

$('cite').addEventListener('click', async () => {
  const c = currentCitation();
  if (!c) return;
  toast((await copyText(c)) ? 'הציטוט הועתק ✓' : 'לא ניתן להעתיק במכשיר זה');
  clearSel();
});

$('share').addEventListener('click', async () => {
  const c = currentCitation();
  if (!c) return;
  await copyText(c);
  if (navigator.share) {
    try {
      await navigator.share({ text: c, title: resolveTitle() });
    } catch (_) {}
    clearSel();
  } else {
    toast('הועתק ✓ (שיתוף לא נתמך במכשיר זה)');
    clearSel();
  }
});

$('clearSel').addEventListener('click', clearSel);

function buildWords(div, pageNum, top, lineH, itemId, ix, ixe) {
  let text = div.textContent || '';
  // הסרת עיליות מתוך יחידת הטקסט לפני פיצול למילים
  text = text.replace(SUPER_RE, '');
  if (!text.trim()) return;

  div.textContent = '';
  for (const part of text.split(/(\s+)/)) {
    if (part === '') continue;
    if (/^\s+$/.test(part)) {
      div.appendChild(document.createTextNode(part));
    } else {
      // דילוג על טוקן שהוא רק ספרות עיליות / רק מספר הפניה קצר אחרי ניקוי
      if (/^[⁰¹²³⁴⁵⁶⁷⁸⁹]+$/.test(part)) continue;
      const w = document.createElement('span');
      w.className = 'w';
      w.textContent = part;
      w.dataset.idx = String(tokens.length);
      tokens.push({
        el: w,
        page: pageNum,
        text: part,
        top,
        lineH,
        item: itemId,
        ix,
        ixe,
      });
      div.appendChild(w);
    }
  }
}

/**
 * הפניית הערה = ספרות עיליות, או מספר רגיל קצר עם גופן קטן מהגוף
 */
function isFootnoteRef(it, bodySize) {
  if (!it || !it.str) return true;
  const s = it.str.trim();
  if (!s) return true;

  // יוניקוד עילאי בלבד
  if (/^[⁰¹²³⁴⁵⁶⁷⁸⁹]+$/.test(s)) return true;
  if (/[⁰¹²³⁴⁵⁶⁷⁸⁹]/.test(s) && s.replace(SUPER_RE, '').trim() === '') return true;

  const fh = it.height || 0;
  const loneNum = /^[\d]{1,3}$/.test(s);
  // ספרה רגילה קצרה + קטן מהגוף → כנראה superscript שעוצב בלי יוניקוד
  if (loneNum && bodySize && fh > 0 && fh < bodySize - 1) return true;

  return false;
}

function estimateBodySize(items) {
  const hc = {};
  let total = 0;
  items.forEach((it) => {
    if (it.str && it.str.trim()) {
      total++;
      const h = Math.round(it.height || 0);
      if (h > 0) hc[h] = (hc[h] || 0) + 1;
    }
  });
  let bodySize = 0;
  const need = Math.max(5, total * 0.06);
  for (const h in hc) {
    if (hc[h] >= need && +h > bodySize) bodySize = +h;
  }
  return bodySize || 14;
}

function reorderRtlRuns() {
  let a = 0;
  while (a < tokens.length) {
    let z = a + 1;
    const lh = tokens[a].lineH || 14;
    while (
      z < tokens.length &&
      tokens[z].page === tokens[a].page &&
      Math.abs(tokens[z].top - tokens[a].top) < lh * 0.6
    ) {
      z++;
    }
    const run = tokens.slice(a, z);
    run.forEach((t, k) => {
      t._o = k;
    });
    run.sort((x, y) => y.ixe - x.ixe || x._o - y._o);
    for (let k = a; k < z; k++) tokens[k] = run[k - a];
    a = z;
  }
  tokens.forEach((t, i) => {
    t.el.dataset.idx = String(i);
  });
}

async function start() {
  $('msg').style.display = 'block';
  $('msg').textContent = 'טוען את השיחה…';

  try {
    const pdf = await pdfjsLib.getDocument({
      url: file,
      cMapUrl: PDFJS_CDN + 'cmaps/',
      cMapPacked: true,
      standardFontDataUrl: PDFJS_CDN + 'standard_fonts/',
    }).promise;

    $('msg').style.display = 'none';

    const dpr = window.devicePixelRatio || 1;
    baseW = Math.min(Math.max(viewer.clientWidth - 16, 100), 820);
    inner.style.width = baseW * Z + 'px';

    let target = null;

    for (let n = 1; n <= pdf.numPages; n++) {
      const page = await pdf.getPage(n);
      const base = page.getViewport({ scale: 1 });

      const pageEl = document.createElement('div');
      pageEl.className = 'page';
      pageEl.dataset.page = String(n);
      pageEl.dataset.bw = String(base.width);

      let rs = (baseW / base.width) * dpr * 2;
      let w = base.width * rs;
      let h = base.height * rs;
      rs *= Math.min(MAX_SIDE / w, MAX_SIDE / h, Math.sqrt(MAX_AREA / (w * h)), 1);

      const vp = page.getViewport({ scale: rs });
      const canvas = document.createElement('canvas');
      canvas.width = Math.floor(vp.width);
      canvas.height = Math.floor(vp.height);
      pageEl.appendChild(canvas);

      const tlDiv = document.createElement('div');
      tlDiv.className = 'textLayer';
      tlDiv.style.setProperty('--scale-factor', String((baseW * Z) / base.width));
      pageEl.appendChild(tlDiv);
      inner.appendChild(pageEl);

      await page.render({
        canvasContext: canvas.getContext('2d', { alpha: false }),
        viewport: vp,
      }).promise;

      const tc = await page.getTextContent();
      const textLayer = new pdfjsLib.TextLayer({
        textContentSource: tc,
        container: tlDiv,
        viewport: page.getViewport({ scale: 1 }),
      });
      await textLayer.render();

      const items = tc.items;
      const bodySize = estimateBodySize(items);

      textLayer.textDivs.forEach((div, i) => {
        const it = items[i];
        if (!it || !it.str || !it.str.trim()) return;

        if (isFootnoteRef(it, bodySize)) {
          div.classList.add('fn');
          return;
        }

        const top = base.height - it.transform[5];
        const fh = it.height || bodySize;
        const ix = it.transform[4];
        const ixe = ix + (it.width || 0);
        buildWords(div, n, top, fh, n * 100000 + i, ix, ixe);
      });

      if (startPage && n === startPage) target = pageEl;
    }

    reorderRtlRuns();
    if (target) target.scrollIntoView({ block: 'start' });
  } catch (err) {
    console.error(err);
    showError(
      'לא ניתן להציג את הקובץ כרגע. אפשר <a href="' +
        file +
        '">להוריד אותו ישירות</a>.' +
        (err && err.message
          ? '<br><small style="opacity:.65">' + err.message + '</small>'
          : '')
    );
  }
}
</script>
</body>
</html>
