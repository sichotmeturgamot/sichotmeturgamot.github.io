<script>
(function () {
  const app = document.getElementById('app');
  const LANG = { yi: 'אידיש', he: 'לשון הקודש', mixed: 'אידיש ולה״ק' };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  // ---------- גימטריא ושנים ----------
  const G = { א: 1, ב: 2, ג: 3, ד: 4, ה: 5, ו: 6, ז: 7, ח: 8, ט: 9, י: 10, כ: 20, ל: 30, מ: 40, נ: 50, ס: 60, ע: 70, פ: 80, צ: 90, ץ: 90, ך: 20, ם: 40, ן: 50, ף: 80, ק: 100, ר: 200, ש: 300, ת: 400 };
  const yn = id => id.replace(/^ה׳/, '').split('').reduce((n, c) => n + (G[c] || 0), 0);
  const YEAR_SEC = /^(ה׳)?(תר|תש|ש״ת)/;
  const YEAR_IN = /(?:ה׳)?(?:ש״ת|ת[רש][א-ת]?״[א-ת])/;
  const yearOfTitle = t => { const m = YEAR_IN.exec(t); if (!m) return null; const b = m[0].replace(/^ה׳/, ''); return (yn(b) >= 700 ? 'ה׳' : '') + b; };
  // ---------- חודשים ----------
  const MONTHS = [
    ['תשרי', /תשרי|ראש השנה|ר״ה|יום כפור|יום כיפור|הכיפורים|יו״כ|סוכות|הושענא|שמיני עצרת|שמחת תורה|שמח״ת|שמע״צ|שבת שובה|שבת תשובה|עשי״ת|חה״ס|חוהמ״ס|דחה״ש|דחגה״ש|שבת בראשית/],
    ['חשון', /מרחשון|חשון|(?:^|[\s,.])מ״ח(?=[\s,.]|$)/],
    ['כסלו', /כסלו|חנוכה/],
    ['טבת', /טבת/],
    ['שבט', /שבט/],
    ['אדר', /אדר|(?<!כי)פורים/],
    ['ניסן', /ניסן|פסח(?!\s*שני)|חה״פ|חוהמ״פ|אחרון של פסח/],
    ['אייר', /אייר|ל״?ג בעומר|פסח שני/],
    ['סיון', /סיון|שבועות/],
    ['תמוז', /תמוז|יום הגאולה|קיץ/],
    ['אב', /מנחם[־\s]?אב|מנ״א|תשעה באב|ט״ו באב|(?:^|[\s־,])אב(?=[\s,.]|$)/],
    ['אלול', /אלול|ש״[קפ] ראה/]
  ];
  const NOM = MONTHS.length; // 12 = ללא חודש
  // פרשות השבוע → החודש שבו הן חלות בדרך כלל (אומדן; משמש רק כשאין בכותרת חודש או חג)
  const PARASHOT = { 0: 'בראשית|וילך|האזינו|וזאת הברכה', 1: 'נח|לך לך|וירא|חיי שרה|חיי|תולדות', 2: 'ויצא|וישלח|וישב|מקץ', 3: 'ויגש|ויחי|שמות', 4: 'וארא|בא|בשלח|יתרו|משפטים', 5: 'תרומה|תצוה|כי תשא|ויקהל|פקודי|ויקהל־פקודי', 6: 'ויקרא|צו|שמיני|תזריע|מצורע|תזריע־מצורע', 7: 'אחרי מות|אחרי|קדושים|אמור|בהר|בחוקותי|בחקותי|בהר־בחוקותי', 8: 'במדבר|נשא|בהעלותך|שלח|קרח', 9: 'חקת|חוקת|בלק|פינחס|פנחס|חוקת־בלק', 10: 'מטות|מסעי|מטות־מסעי|דברים|ואתחנן', 11: 'עקב|ראה|שופטים|שפטים|כי תצא|כי תבוא|נצבים|ניצבים|נצבים־וילך' };
  const PAR = MONTHS.map((m, i) => PARASHOT[i] ? [i, new RegExp('(?:ש״[קפ]|פרשת|מוצש״ק|עש״ק|שבת קודש|שבת|יום [א-ו]׳|[א-ו]׳)\\s+(?:פרשת\\s+)?(?:' + PARASHOT[i] + ')(?![א-ת])')] : null).filter(Boolean);
  const monthMatch = t => { const r = monthMatch0(t); if (r) return r; for (const [i, re] of PAR) { const m = re.exec(t); if (m) return { i, idx: m.index, text: m[0] }; } return null; };
  const monthMatch0 = t => { let best = null; MONTHS.forEach((m, i) => { const r = m[1].exec(t); if (r && (!best || r.index < best.idx)) best = { i, idx: r.index, text: r[0].replace(/^[\s,.]+/, '') }; }); return best; };
  const monthOf = t => { const m = monthMatch(t); return m ? m.i : NOM; };
  // מספרי ימים בחודש (א–ל), עם או בלי גרשיים — לזיהוי "י״ב", "יב", "כ׳" וכו'
  const DAYS = (() => { const o = 'אבגדהוזחט', t = { 10: 'י', 20: 'כ', 30: 'ל' }, r = []; for (let n = 1; n <= 30; n++) { let w; if (n === 15) w = 'טו'; else if (n === 16) w = 'טז'; else if (n < 10) w = o[n - 1]; else if (n % 10 === 0) w = t[n]; else w = t[Math.floor(n / 10) * 10] + o[n % 10 - 1]; if (n === 18) r.push('ח״?י'); r.push(w.length > 1 ? w[0] + '״?' + w[1] : w + '[׳״]?'); } return r.sort((a, b) => b.length - a.length).join('|'); })();
  const DAY_END = new RegExp('(?:^|[\\s־–-])((?:' + DAYS + ')(?:\\s*[־–-]\\s*(?:' + DAYS + '))?)(?:\\s+[בד])?\\s*$');
  // תיבת התאריך בכרטיס: [שורה עליונה, שורה תחתונה]
  function dateBox(x) {
    if (x.d) return x.d;
    const m = monthMatch(x.t), yr = x.year && x.year !== 'ללא שנה' ? x.year.replace(/^ה׳/, '') : '';
    if (!m) return [yr || '•', ''];
    const txt = m.text, isMonthName = MONTHS.some(mm => mm[0] === txt) || txt === 'מרחשון' || /^(?:מנחם[\s־]?)?אב$/.test(txt);
    const dm = isMonthName ? DAY_END.exec(x.t.slice(0, m.idx)) : null;
    if (dm) return [dm[1].replace(/\s+/g, ''), MONTHS[m.i][0]];
    if (isMonthName) return [MONTHS[m.i][0], yr];
    const w = txt.split(/\s+/);
    if (w.length > 1) return [w[0], w.slice(1).join(' ')];
    return [txt, MONTHS[m.i][0]];
  }
  // ---------- בניית הנתונים ----------
  const ITEMS = [], SERIES = [], ALL = [];
  const serOf = b => b.series || (b.id.indexOf('ld-') === 0 ? 'לקוטי דיבורים' : 'ספר השיחות');
  const cleanPart = s => s.replace(/^(לקוטי דיבורים|ספר השיחות|ספר הזכרונות|אגרות קודש)\s*-?\s*/, '').trim();
  let seq = 0;
  RAYATZ.books.forEach(b => {
    const sname = serOf(b);
    let S = SERIES.find(s => s.name === sname); if (!S) { S = { name: sname, parts: [] }; SERIES.push(S); }
    b.sections.forEach(sec => {
      const isYear = YEAR_SEC.test(sec.id);
      // כל הוספה מוצגת בכרך שבו היא מודפסת — החלק הוא הכרך
      const label = cleanPart(b.title).replace(/\s*\(לה״ק\)\s*$/, '') || b.title;
      const extra = false;
      let P = S.parts.find(p => p.name === label); if (!P) { P = { name: label, extra, first: seq, items: [] }; S.parts.push(P); }
      sec.sichos.forEach(x => {
        const it = Object.assign({}, x, { ro: !!b.ro, book: b.id, series: sname, part: label, year: isYear ? sec.id : yearOfTitle(x.t), seq: seq++ });
        it.month = x.m != null ? x.m : monthOf(x.t); if (!b.undated && !x.nd) ITEMS.push(it); P.items.push(it); ALL.push(it);
      });
    });
  });
  SERIES.forEach(S => S.parts.sort((a, b) => (a.extra - b.extra) || (S.name === 'ספר השיחות' && !a.extra ? Math.min(...a.items.map(i => i.year ? yn(i.year) : 9e3)) - Math.min(...b.items.map(i => i.year ? yn(i.year) : 9e3)) : a.first - b.first)));
  const YEARS = []; ITEMS.forEach(i => { if (i.year && YEARS.indexOf(i.year) < 0) YEARS.push(i.year); });
  YEARS.sort((a, b) => yn(a) - yn(b));
  if (ITEMS.some(i => !i.year)) YEARS.push('ללא שנה');
  const yearKey = i => i.year || 'ללא שנה';
  const SER_DESC = { 'שיחות מתורגמות': 'שיחות הריי״ץ שתורגמו בעמוד זה לעברית, מתוך הקובצים המתורגמים באתר', 'ספר השיחות': 'שיחות הריי״ץ לפי שנים, מתוך כרכי קה״ת — ביידיש ובלשון הקודש', 'לקוטי דיבורים': 'חמשת חלקי לקוטי דיבורים בתרגום ללשון הקודש, וההוספות', 'אגרות קודש': 'אגרות קודש כ״ק אדמו״ר מוהריי״צ, כל אגרת לפי תאריך' };
  const noun = n => n === 1 ? 'פריט אחד' : n + ' פריטים';
  // ---------- מצב (נשמר רק בתוך הביקור) ----------
  const st = { mode: 'years', year: null, month: null, series: null, part: null };
  try { Object.assign(st, JSON.parse(sessionStorage.getItem('rayatz-ui2') || '{}')); } catch (e) {}
  const save = () => { try { sessionStorage.setItem('rayatz-ui2', JSON.stringify(st)); } catch (e) {} };
  const href = x => x.href ? x.href : 'rayatz-read.html?book=' + x.book + '&page=' + x.pdf + '&title=' + encodeURIComponent(x.t);
  // כותרת לתצוגה: בלי שם הסדרה (מופיע בתגית/בכותרת) ובלי השנה בסוגריים בסוף
  function showTitle(x, inPart) {
    let t = x.t.replace(/\s*\((?:ה׳)?(?:ש״ת|ת[רש][א-ת]?״[א-ת])\)\s*$/, '');
    if (x.series === 'לקוטי דיבורים') t = inPart ? t.replace(/^לקוטי דיבורים ח״[א-ה],\s*/, '') : t.replace(/^לקוטי דיבורים\s+/, '');
    return t;
  }
  const serLabel = n => (n === 'לקוטי דיבורים' || n === 'ספר הזכרונות') ? n + ' מתורגם' : n;
  const volName = x => { const p = x.part.replace(/\s*\(לה״ק\)\s*$/, ''); return serLabel(x.series) + ' ' + p; };
  const CHEV = '<svg class="rz-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>';
  function card(x, opt) {
    const meta = [];
    if (opt.year && x.year) meta.push(esc(x.year));
    if (!opt.inPart) meta.push(esc(volName(x)));
    if (!x.d && x.series !== 'לקוטי דיבורים' && x.series !== 'אגרות קודש') meta.push('<span class="rz-lang">' + (LANG[x.lang] || LANG.yi) + '</span>');
    const tr = !x.ro && x.lang !== 'he' ? '<br><span class="rz-tr">זמין תרגום לעברית</span>' : '';
    const d = dateBox(x);
    return '<div class="rz-item"><span class="rz-main"><h3>' + esc(showTitle(x, opt.inPart)) + '</h3><span class="rz-sub">' + meta.join(' · ') + tr + '</span></span><a class="rz-date" href="' + href(x) + '" aria-label="פתח"><b' + (d[0].length > 6 ? ' class="sm"' : '') + '>' + esc(d[0]) + '</b>' + (d[1] ? '<span>' + esc(d[1]) + '</span>' : '') + '</a></div>';
  }
  // ---------- לפי שנים ----------
  function viewYears() {
    const yi = YEARS.indexOf(st.year);
    let h = '<div class="rz-years" id="rzy">';
    YEARS.forEach(y => { h += '<button class="year-chip' + (y === st.year ? ' active' : '') + '" data-y="' + esc(y) + '">' + esc(y) + '</button>'; });
    h += '</div>';
    if (yi < 0) {
      const sers = SERIES.map(s => s.name).join(' ו');
      app.innerHTML = h + '<div class="rz-intro"><b>בחרו שנה</b>' + ITEMS.length + ' פריטים מ־' + YEARS.filter(y => y !== 'ללא שנה').length + ' שנים · ' + esc(sers) + '</div>';
      return bind();
    }
    const all = ITEMS.filter(i => yearKey(i) === st.year);
    const months = []; for (let m = 0; m <= NOM; m++) { const n = all.filter(i => i.month === m).length; if (n) months.push([m, n]); }
    if (!months.some(([m]) => m === st.month)) st.month = months[0][0];
    const list = all.filter(i => i.month === st.month).sort((a, b) => a.seq - b.seq);
    h += '<div class="rz-body"><div class="rz-rail rz-months">';
    months.forEach(([m, n]) => { h += '<button class="year-chip' + (m === st.month ? ' active' : '') + '" data-m="' + m + '">' + (m === NOM ? 'ללא חודש' : MONTHS[m][0]) + '<small>' + n + '</small></button>'; });
    h += '</div><div class="rz-area">';
    list.forEach(x => { h += card(x, { series: true }); });
    app.innerHTML = h + '</div></div>';
    bind();
    const on = document.querySelector('#rzy .active'); if (on) on.scrollIntoView({ block: 'nearest', inline: 'center' });
  }
  // ---------- לפי סדרות ----------
  // סדרות מתוכננות שעדיין אין בהן כרכים — מוצגות ככפתור עם הודעת "בקרוב"
  const PLANNED = ['אגרות קודש', 'ספר הזכרונות', 'רשימות'];
  function viewSeries() {
    const names = SERIES.map(s => s.name).concat(PLANNED.filter(n => !SERIES.some(s => s.name === n)));
    if (names.indexOf(st.series) < 0) st.series = names[0];
    const S = SERIES.find(s => s.name === st.series);
    let h = '<div class="rz-years" id="rzs">';
    names.forEach(n => { h += '<button class="year-chip' + (n === st.series ? ' active' : '') + '" data-sr="' + esc(n) + '">' + esc(serLabel(n)) + '</button>'; });
    h += '</div>';
    if (!S) { app.innerHTML = h + '<div class="rz-intro"><b>' + esc(st.series) + '</b>הכרכים יתווספו בקרוב</div>'; return bind(); }
    const P = S.parts.find(p => p.name === st.part) || S.parts[0];
    st.part = P.name;
    h += '<div class="rz-body"><div class="rz-rail rz-parts">';
    S.parts.forEach(p => { h += '<button class="year-chip' + (p === P ? ' active' : '') + '" data-p="' + esc(p.name) + '">' + esc(p.name) + '<small>' + p.items.length + '</small></button>'; });
    h += '</div><div class="rz-area">';
    const multiY = new Set(P.items.map(i => i.year)).size > 1;
    P.items.slice().sort((a, b) => a.pdf - b.pdf || a.seq - b.seq).forEach(x => { h += card(x, { year: multiY, inPart: true }); });
    app.innerHTML = h + '</div></div>';
    bind();
  }
  function bind() {
    app.querySelectorAll('[data-y]').forEach(b => b.onclick = () => { st.year = b.dataset.y; st.month = null; go(); });
    app.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { st.month = +b.dataset.m; go(); });
    app.querySelectorAll('[data-sr]').forEach(b => b.onclick = () => { if (st.series !== b.dataset.sr) st.part = null; st.series = b.dataset.sr; go(); });
    app.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { st.part = b.dataset.p; go(); });
  }
  function go() {
    save(); draw();
    const top = app.getBoundingClientRect().top + scrollY - 70;
    if (scrollY > top) scrollTo({ top: Math.max(top, 0), behavior: 'smooth' });
  }
  function draw() {
    document.querySelectorAll('.seg-btn').forEach(b => b.classList.toggle('on', b.dataset.mode === st.mode));
    if (st.mode === 'series') viewSeries(); else viewYears();
  }
  document.querySelectorAll('.seg-btn').forEach(b => b.onclick = () => { st.mode = b.dataset.mode; save(); draw(); });
  // ---------- חיפוש ----------
  // מנרמל: בלי ניקוד וגרשיים; מפרידים לרווח. כך "רנ״ז" = "רנז" ו"י״א כסלו" = "יא כסלו"
  const NQ = s => String(s).replace(/[֑-ׇ]/g, '').replace(/[״׳"'`]/g, '').replace(/[־\-–—,.:;()\[\]?!/]/g, ' ').replace(/\s+/g, ' ').trim().replace(/(^| )(?:שפ|שק|שבק)(?= |$)/g, '$1שבת');   // ש״פ / ש״ק / שבת קודש = שבת
  const STOP = new Set(['פרשת', 'פרשה', 'בפרשת', 'שיחת']);
  ALL.forEach(it => {
    let alias = '';
    const am = /^אגרת\s+([א-ת״׳"']+)/.exec(it.t);
    if (am) { it.num = yn(am[1].replace(/[״׳"']/g, '')); alias = 'אגרת ' + it.num; }
    else if (it.d && it.d[0] === 'פרק' && it.d[1]) { it.num = yn(String(it.d[1]).replace(/[״׳"']/g, '')); alias = 'פרק ' + it.num; }
    it.tq = ' ' + NQ(it.t) + ' ';
    it.q = ' ' + NQ([it.t, it.series, it.part, it.year || '', (it.d || []).join(' '), alias].join(' ')) + ' ';
  });
  const hit = (q, tok) => tok.length <= 2 ? q.indexOf(' ' + tok) >= 0 : q.indexOf(tok) >= 0;
  function runSearch(raw) {
    const rts = raw.trim().split(/\s+/), toks = [], nv = [], strict = [];
    rts.forEach((r, i) => {
      const t = NQ(r); if (!t || STOP.has(t)) return;
      const pre = i > 0 ? NQ(rts[i - 1]) : '', isH = /^[א-ת]+$/.test(t) && t.length <= 4;
      const cand = isH && (/[״׳"']/.test(r) || pre === 'פרק' || pre === 'אגרת');
      toks.push(t); nv.push(cand ? yn(t) : 0); strict.push(cand && (pre === 'פרק' || pre === 'אגרת'));
    });
    const seg = document.querySelector('.seg-toggle');
    if (!toks.length) { if (seg) seg.style.display = ''; draw(); return; }
    if (seg) seg.style.display = 'none';
    const res = [];
    ALL.forEach(it => {
      let sc = 0;
      for (let k = 0; k < toks.length; k++) {
        const t = toks[k];
        if (/^\d+$/.test(t) && it.num === +t) { sc += 6; continue; }
        if (nv[k] && it.num != null) { if (it.num === nv[k]) { sc += 6; continue; } if (strict[k]) return; }
        else if (nv[k] && strict[k]) return;
        if (hit(it.tq, t)) sc += 2; else if (hit(it.q, t)) sc += 1; else return;
      }
      res.push([sc, it]);
    });
    res.sort((a, b) => b[0] - a[0] || a[1].seq - b[1].seq);
    const MAXR = 100;
    let h = '<div class="rz-intro" style="padding:8px 0 12px">' + (res.length ? '<b style="font-size:1rem">' + (res.length === 1 ? 'תוצאה אחת' : res.length + ' תוצאות') + '</b>' + (res.length > MAXR ? 'מוצגות ' + MAXR + ' הראשונות. דייקו את החיפוש.' : '') : '<b>לא נמצאו תוצאות</b>נסו מילה אחרת, למשל שם פרשה, חודש או מספר אגרת.') + '</div>';
    res.slice(0, MAXR).forEach(r => { h += card(r[1], { year: true }); });
    app.innerHTML = h; app.scrollTop = 0;
  }
  const qi = document.getElementById('rzq'), qb = document.getElementById('rzqb'); let qt = null;
  const qopen = on => { qi.hidden = !on; qb.classList.toggle('on', on); qb.setAttribute('aria-expanded', on); if (on) qi.focus(); };
  qb.onclick = () => { if (qi.hidden) qopen(true); else if (qi.value) { qi.value = ''; runSearch(''); qi.focus(); } else qopen(false); };
  qi.addEventListener('blur', () => { if (!qi.value) setTimeout(() => qopen(false), 150); });
  qi.addEventListener('input', () => { clearTimeout(qt); qt = setTimeout(() => runSearch(qi.value), 140); });
  qi.addEventListener('keydown', e => { if (e.key === 'Escape') { qi.value = ''; runSearch(''); qopen(false); } });
  draw();
})();
</script>
<script>
  // חשיפה הדרגתית של הכרטיסים (כמו בשאר האתר)
  (function () {
    if (!('IntersectionObserver' in window)) return;
    const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { threshold: .08 });
    const hook = () => document.querySelectorAll('#app .rz-item:not(.reveal), #app .rz-card:not(.reveal)').forEach((el, i) => { el.classList.add('reveal'); el.style.transitionDelay = (Math.min(i, 6) * 60) + 'ms'; io.observe(el); });
    hook(); new MutationObserver(hook).observe(document.getElementById('app'), { childList: true, subtree: true });
  })();
</script>
<script src="nav.js"></script>
<script src="morenav.js" defer></script>
</body>
