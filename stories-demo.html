<style>
  .sp-head { text-align: center; padding: 38px 20px 4px; }
  .sp-head .bsd { font-size: .72rem; letter-spacing: .3em; color: var(--gold); margin-bottom: 14px; }
  .sp-head h1 { font-size: clamp(1.8rem, 4.6vw, 2.5rem); line-height: 1.25; }
  .sp-head h1::before { content: ""; display: block; width: 60px; height: 1px; background: var(--gold); margin: 0 auto 18px; }
  .sp-head .sub { font-family: 'Frank Ruhl Libre', serif; color: var(--muted); font-size: 1.05rem; margin-top: 8px; }
  .demo-note { max-width: 640px; margin: 10px auto 0; padding: 0 16px; text-align: center; font-size: .8rem; color: var(--muted); }
  .sp-tabs { display: flex; gap: 4px; max-width: 460px; margin: 18px 16px 0; margin-inline: auto; padding: 4px; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; }
  .sp-tabs button { flex: 1; white-space: nowrap; border: 0; background: transparent; border-radius: 10px; padding: 10px 6px; font: 500 .98rem 'Heebo', sans-serif; color: var(--navy); cursor: pointer; }
  .sp-tabs button.on { background: var(--navy); color: var(--cream); }
  .sp-tools { max-width: 680px; margin: 16px auto 0; padding: 0 16px; display: grid; gap: 10px; }
  .sp-row { display: flex; gap: 8px; }
  .sp-row input { flex: 1; min-width: 0; height: 46px; padding: 0 14px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--paper); font: 1.05rem 'Frank Ruhl Libre', serif; color: var(--text); }
  .sp-row input:focus { outline: none; border-color: var(--gold); }
  .sp-row .rand { border: 1.5px solid var(--gold); background: var(--paper); color: var(--gold-dark); border-radius: 12px; padding: 0 14px; font: 500 .9rem 'Heebo', sans-serif; cursor: pointer; white-space: nowrap; }
  .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; border: 1px solid var(--line); background: var(--paper); color: var(--navy); border-radius: 999px; padding: 6px 13px; font: .86rem 'Heebo', sans-serif; cursor: pointer; }
  .chip.on { background: var(--navy); color: var(--cream); border-color: var(--navy); }
  .chip-label { font: 500 .75rem 'Heebo', sans-serif; color: var(--muted); margin-bottom: -4px; }
  .sp-count { max-width: 680px; margin: 12px auto 0; padding: 0 16px; font-size: .82rem; color: var(--muted); }
  .sp-list { max-width: 680px; margin: 8px auto 30px; padding: 0 16px; display: grid; gap: 14px; }
  .st { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 18px 18px 14px; border-top: 3px solid var(--gold); }
  .st h3 { font-size: 1.3rem; margin: 0 0 6px; }
  .st .sum b { font: 500 .85rem 'Heebo', sans-serif; color: var(--gold-dark); }
  .st .sum { font-family: 'Frank Ruhl Libre', serif; font-size: 1.03rem; line-height: 1.7; color: var(--text); margin: 0 0 10px; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .tag { font: .74rem 'Heebo', sans-serif; background: #efe9db; color: #7a6a42; border-radius: 999px; padding: 2px 10px; }
  .tag.who { background: var(--navy); color: var(--cream); }
  .full { font-family: 'Frank Ruhl Libre', serif; font-size: 1.07rem; line-height: 1.9; text-align: justify; white-space: pre-line; border-inline-start: 3px solid var(--gold-soft); padding-inline-start: 12px; margin: 10px 0 6px; }
  .src { font: .82rem 'Heebo', sans-serif; color: var(--muted); margin-top: 6px; }
  .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .acts a, .acts button { border: 1px solid var(--line); background: transparent; color: var(--navy); border-radius: 999px; padding: 7px 14px; font: 500 .85rem 'Heebo', sans-serif; cursor: pointer; text-decoration: none; }
  .acts .main { background: var(--navy); color: var(--cream); border-color: var(--navy); }
  .sy { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 20px 20px 14px; position: relative; }
  .sy .q { font-family: 'Frank Ruhl Libre', serif; font-size: 1.2rem; line-height: 1.8; color: var(--navy); text-align: justify; }
  .sy .q::before { content: '”'; float: right; font-size: 3.4rem; line-height: .95; height: 2.1rem; color: var(--gold); opacity: .55; margin-inline-end: 8px; margin-top: -2px; }
  .sy .who-line { margin-top: 10px; font: 500 .88rem 'Heebo', sans-serif; color: var(--gold-dark); }
  .empty { text-align: center; color: var(--muted); padding: 30px 0; }
</style>
</head>

<div class="sp-head">
  <div class="bsd">ב״ה</div>
  <h1>סיפורים ופתגמים</h1>
  <div class="sub">מתוך שיחות כ״ק אדמו״ר הריי״צ — לפי דמות, נושא וזמן</div>
</div>
<p class="demo-note">טיוטה לבדיקה — כל הסיפורים והפתגמים מהשיחות. המספר (#) ליד המקור — לציון פריטים להסרה או לתיקון.</p>
<div class="sp-tabs"><button type="button" data-tab="story" class="on">סיפורים</button><button type="button" data-tab="saying">פתגמים ואמרות</button></div>
<div class="sp-tools">
  <div class="sp-row"><input id="q" type="search" placeholder="חפשו סיפור או פתגם…" autocomplete="off"><button type="button" class="rand" id="rand">🎲 אקראי</button></div>
  <div class="chip-label" id="who-label">מי במרכז</div>
  <div class="chips" id="who"></div>
  <div class="chip-label">נושא</div>
  <div class="chips" id="theme"></div>
</div>
<div class="sp-count" id="count"></div>
<main class="sp-list" id="list"></main>
<nav class="bottomnav">
  <a href="https://sichotmeturgamot.com/index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg><span>ראשי</span></a>
  <a href="https://sichotmeturgamot.com/sichos.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5c-2-1.5-5-2-8-2v16c3 0 6 .5 8 2 2-1.5 5-2 8-2V3c-3 0-6 .5-8 2z"/><path d="M12 5v16"/></svg><span>קריאה</span></a>
  <a href="https://sichotmeturgamot.com/milon.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5a2 2 0 012-2h13v18H6a2 2 0 01-2-2z"/><path d="M9 7h6M9 11h6"/></svg><span>מילון</span></a>
  <a href="ask.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><span>חיפוש</span></a>
  <a href="#more" id="more-tab"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg><span>עוד</span></a>
</nav>
<script src="quote-img.js"></script>
<script>
let ITEMS = [];
const WHO = ['הבעש"ט','המגיד ממעזריטש','אדמו"ר הזקן','אדמו"ר האמצעי','הצמח צדק','אדמו"ר מהר"ש','אדמו"ר הרש"ב','אדמו"ר הריי"צ','חסידים','אחר'];
let tab = 'story', who = '', theme = '', q = '', only = null;
const $ = id => document.getElementById(id);
function el(t, c, x){ const e = document.createElement(t); if(c) e.className = c; if(x != null) e.textContent = x; return e; }
function link(it){ return 'read.html?file=' + encodeURIComponent('pdfs/' + it.f + '.pdf') + '&title=' + encodeURIComponent(it.t); }
function norm(s){ return s.replace(/[\u0591-\u05C7"'״׳]/g, ''); }
function chips(){
  const pool = ITEMS.filter(i => i.type === tab);
  const ws = WHO.filter(w => pool.some(i => i.who === w));
  const ts = [...new Set(pool.flatMap(i => i.themes))];
  $('who-label').textContent = tab === 'story' ? 'מי במרכז הסיפור' : 'מי אמר';
  for (const [id, arr, cur, set] of [['who', ws, who, v => who = v], ['theme', ts, theme, v => theme = v]]){
    const box = $(id); box.textContent = '';
    ['', ...arr].forEach(v => { const b = el('button', 'chip' + (v === cur ? ' on' : ''), v || 'הכל'); b.type = 'button';
      b.onclick = () => { set(v); only = null; chips(); render(); }; box.appendChild(b); });
  }
}
function render(){
  const n = norm(q.trim());
  let list = ITEMS.filter(i => i.type === tab && (!who || i.who === who) && (!theme || i.themes.includes(theme))
    && (!n || norm(i.title + ' ' + i.summary + ' ' + i.text + ' ' + i.who + ' ' + i.themes.join(' ')).includes(n)));
  if (only) list = [only];
  $('count').textContent = only ? 'סיפור אקראי · ' : (list.length + (tab === 'story' ? ' סיפורים' : ' פתגמים'));
  if (only){ const b = el('a', null, 'הצג הכל'); b.href = '#'; b.onclick = e => { e.preventDefault(); only = null; render(); }; $('count').appendChild(b); }
  const box = $('list'); box.textContent = '';
  if (!list.length){ box.appendChild(el('div', 'empty', 'לא נמצאו תוצאות')); return; }
  list.forEach(it => box.appendChild(it.type === 'story' ? story(it) : saying(it)));
}
function tags(it){
  const t = el('div', 'tags'); t.appendChild(el('span', 'tag who', it.who));
  it.themes.forEach(x => t.appendChild(el('span', 'tag', x))); if (it.occasion) t.appendChild(el('span', 'tag', it.occasion)); return t;
}
function actions(it, extra){
  const a = el('div', 'acts'); if (extra) a.appendChild(extra);
  const r = el('a', null, 'לשיחה'); r.href = link(it); a.appendChild(r);
  const im = el('button', null, '🖼 תמונה'); im.type = 'button';
  im.onclick = () => window.QuoteImage && QuoteImage.open({ text: it.text, name: it.t, link: new URL(link(it), location.href).href });
  a.appendChild(im);
  const w = el('a', null, 'ווטסאפ'); w.target = '_blank'; w.rel = 'noopener';
  w.href = 'https://wa.me/?text=' + encodeURIComponent((it.type === 'story' ? it.title + '\n\n' : '') + it.text + '\n\n(מתוך שיחת ' + it.t + ')\n' + new URL(link(it), location.href).href);
  a.appendChild(w); return a;
}
function story(it){
  const c = el('article', 'st'); c.appendChild(el('h3', null, it.title)); c.appendChild(tags(it));
  const sm = el('p', 'sum', ''); const lb = el('b', null, 'תקציר: '); sm.appendChild(lb); sm.appendChild(document.createTextNode(it.summary)); c.appendChild(sm);
  const full = el('div', 'full', it.text); full.hidden = true; c.appendChild(full);
  const src = el('div', 'src', 'מתוך שיחת ' + it.t + ' · #' + it.n); src.hidden = true; c.appendChild(src);
  const tg = el('button', 'main', 'לקריאת הסיפור'); tg.type = 'button';
  tg.onclick = () => { full.hidden = !full.hidden; src.hidden = full.hidden; tg.textContent = full.hidden ? 'לקריאת הסיפור' : 'סגירה'; };
  c.appendChild(actions(it, tg)); return c;
}
function saying(it){
  const c = el('article', 'sy'); c.appendChild(el('div', 'q', it.text));
  c.appendChild(el('div', 'who-line', it.who + ' · ' + it.title));
  c.appendChild(tags(it)); c.appendChild(el('div', 'src', 'מתוך שיחת ' + it.t + ' · #' + it.n));
  c.appendChild(actions(it)); return c;
}
document.querySelectorAll('.sp-tabs button').forEach(b => b.onclick = () => {
  tab = b.dataset.tab; who = theme = ''; only = null;
  document.querySelectorAll('.sp-tabs button').forEach(x => x.classList.toggle('on', x === b));
  $('q').placeholder = tab === 'story' ? 'חפשו סיפור…' : 'חפשו פתגם…'; chips(); render();
});
$('q').addEventListener('input', e => { q = e.target.value; only = null; render(); });
$('rand').onclick = () => { const pool = ITEMS.filter(i => i.type === tab); only = pool[Math.floor(Math.random() * pool.length)]; render();
  if (only.type === 'story'){ const b = $('list').querySelector('.acts .main'); if (b) b.click(); } window.scrollTo({ top: $('count').offsetTop - 80, behavior: 'smooth' }); };
fetch('stories.json?v=4').then(r => r.json()).then(d => { ITEMS = d; chips(); render(); });
</script>
<script src="nav.js"></script>
<script src="morenav.js" defer></script>
<script src="install.js" defer></script>
