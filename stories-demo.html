<script>
const ITEMS = [{"type": "story", "title": "נרות הקרח", "summary": "כשלא נמצאו נרות, ציווה הבעש\"ט להדליק את נטיפי הקרח – והם דלקו, האירו וחיממו.", "who": "הבעש\"ט", "themes": ["אמונה ובטחון"], "occasion": "פסח", "text": "הסיפור של ה\"נרות\"־קרח הוא כזה: הבעש\"ט מאד אהב אור, הוא אהב אור וחום, אפילו בקיץ הוא היה מצווה להסיק את התנור שיהיה חם ועוד יותר חם, ואהב מאד שיהיה מואר.\n— פעם היו מדליקים נרות חֵלב ונרות חֵלב היו סימן עשירוּת, והיה סוג מסויים של נרות שעווה קלועים שהיה רק אצל עשירים -\nפעם אחת התלמידים ישבו בבית המדרש וחיכו לבעש\"ט, הוא היה צריך להגיע מיד, והתלמידים היו מאד מודאגים מאחר ולא היה להם שום נרות להדליק, בחוץ היתה סערה חזקה ולא ניתן היה להשיג נרות.\nהתלמידים רצו למשכן את המעילים שלהם אבל לא היה ניתן להשיג נרות, והי' הדבר לפלא גדול אצל התלמידים. לבנתיים הבעש\"ט נכנס, והתלמידים סיפרו לו שלא השיגו נרות, ואמר הבעש\"ט: אבל חייב להיות מואר. וציוה הבעש\"ט לתלמידים שישברו מתקרת הבית את ה\"נרות־קרח\" שתלויים ושידליקו אותם. התלמידים עשו כך ו\"נרות־הקרח\" אכן דלקו.\nכשסבי אדמו\"ר המהר\"ש סיפר את סיפור זה לאבי הוא סיים: לא רק שהקרח לא נמס, אלא שהוא האיר וחימם.", "chunk": "21_Leil_Acharon_shel_Pesach_5706#0.1", "t": "ליל אחרון של פסח תש\"ו", "f": "21_Leil_Acharon_shel_Pesach_5706"}, {"type": "story", "title": "ברכת כהנים לילד בן שלוש", "summary": "הבעש\"ט בירך את אדמו\"ר הזקן הפעוט בברכת כהנים וציווה להחזירו מיד, כי \"הוא שייך למגיד\".", "who": "הבעש\"ט", "themes": ["התקשרות", "חינוך"], "occasion": "י\"ט כסלו", "text": "רבינו הזקן היה נשמה חדשה, והבעש\"ט רצה שרבינו הזקן לא יכירו, לפי שהוא שייך למגיד, וכשהיה בן ג' שנים והביאוהו לבעל שם טוב, ציווה שתעמוד מחוץ לעיר עגלה מוכנה להסיעו מיד הביתה. וכשהביאוהו לבעש\"ט הניח ידיו הקדושות עליו ובירכו בברכת כהנים, וציווה להסיעו מיד, ואמר: הוא שייך למגיד ממעזריטש.", "chunk": "19_kislev_5707#0.22", "t": "שיחת י\"ט כסלו תש\"ז", "f": "19_kislev_5707"}, {"type": "story", "title": "לשם מה צריכים אותך?", "summary": "לחסיד עשיר שירד מנכסיו השיב אדמו\"ר הזקן: סיפרת מה אתה צריך, אך לא לשם מה צריכים אותך; החסיד התמסר לתורה ותפילה, ולבסוף שלחו הרבי הביתה בברכת הצלחה.", "who": "אדמו\"ר הזקן", "themes": ["פרנסה", "עבודת המידות"], "occasion": "", "text": "זקני החסידים היו מספרים את מה שקיבלו מזקני החסידים הראשונים מליאזנא — הסיפור הידוע על אחד מן החסידים שהי' גביר, אותו החסיד היה מקושר מאוד להוד כ\"ק רבינו הזקן, והי' נותן סכומי כסף גדולים לרבינו הזקן עבור החזקת ארצנו הקדושה ועבור פדיון שבויים.\nהחסיד, שהיה עשיר גדול, כבר השיא את ילדיו, וילדיו היו במצב טוב; לקח על עצמו להשיא את ילדי קרוביו והבטיח להם נדוניות נאות, ובכלל ניהל את ביתו בעשירות. אך לפתע נהפך הגלגל והוא ירד מנכסיו ר\"ל, נשאר אביון גדול ובנוסף לכך בעל חוב גדול. הוא נסע אל אדמו\"ר הזקן ושפך לפניו את לבו המר.\nבשומעו את מצבו, הרים אדמו\"ר הזקן את ראשו ואמר, בניגון, כדרכו בקודש הקדשים: אתה סיפרת מה שאתה צריך, ולשם מה צריכים אותך אינך אומר כלום!\nהחסיד איבד את הכרתו, והמשרת הוציאו מחדרו של הרבי. כשחזר לעצמו הוא החל להרהר במה שהרבי אמר לו, הוא שכח מכל עיסוקיו והתמסר לתורה ותפילה כראוי.\nכעבור זמן־מה קרא לו הוד כ\"ק רבינו הזקן.\nוכאשר החסיד שמע שהוד כ\"ק רבינו הזקן קורא לו, הוא נעשה ממש שבור בעצמו, בזכרו שוב ושוב את המאמר הקדוש שאמר לו כ\"ק רבינו הזקן: \"אתה אמרת מה שאתה צריך, אבל לשם מה צריכים אותך לא אמרת\", הוא בכה בבכי שליש, צם ועסק בענייני עבודה.\nוכאשר נכנס אל הוד כ\"ק רבינו הזקן, הוא הי' בשברון לב כחרס הנשבר, אמר לו הוד כ\"ק רבינו הזקן:\nכעת, כשאתה יודע ומרגיש את האמת הוי' לעולם, שהאמת היא שהיה הוה ויהיה כאחד, ולאותה אמת באה הנשמה אל הגוף, יכול אתה לנסוע הביתה, והשם יתברך יצליחך.\nוכך היה.", "chunk": "lag_baomer_5707#0.1", "t": "ל\"ג בעומר תש\"ז", "f": "lag_baomer_5707"}, {"type": "story", "title": "דמעות של שמחה", "summary": "אדמו\"ר האמצעי והצמח צדק שאלו מדוע אדמו\"ר הזקן בוכה בראש השנה, והוא השיב שאלו דמעות שמחה לבלבל את המקטרגים.", "who": "אדמו\"ר הזקן", "themes": ["שמחה", "תפילה"], "occasion": "ראש השנה", "text": "פעם אחת אדמו\"ר האמצעי ואדמו\"ר הצ\"צ נכנסו לאדמו\"ר הזקן בליל ראש השנה לומר לו לשנה טובה תכתב ותחתם. הם שאלו: הרי בר\"ה צריכים להיות בשמחה, א\"כ מדוע הדמעות? והשיב אדמו\"ר הזקן: אלו דמעות של שמחה, מאחר שעצם הנשמה רואה, ממילא היא בשמחה, והדמעות הן בכדי לבלבל את המלאכים הלא טובים.", "chunk": "leyl_1_rosh_hashana_5707_laramash#0.0", "t": "אחר תפילת ערבית בליל א' דראש השנה תש''ז", "f": "leyl_1_rosh_hashana_5707_laramash"}, {"type": "story", "title": "\"יבוא החץ בי\"", "summary": "הרבנית דבורה לאה שמעה את אדמו\"ר הזקן מתפלל \"יבוא החץ בי\" ובכתה, והוא בירך את בנה הצמח צדק שיאיר את העולם בתורה ועבודה.", "who": "אדמו\"ר הזקן", "themes": ["מסירות נפש", "אהבת ישראל"], "occasion": "ראש השנה", "text": "כשיצאה ההתנגדות לצורת ועבודת החסידות, ובערים רבות בליטא חוו החסידים רדיפות, שמעו מקורביו של אדה\"ז כיצד הוא אומר בסוף תפילת שמונה עשרה, יבא החץ בי.\nבערב ראש השנה תק\"ן, הרבי הצמח צדק הי' בן שלוש שנים, אמו הרבנית דבורה לאה הביאהאותו לאדמו\"ר הזקן בכדי שיברך אותו.\nכשהיא נכנסה לאדמו\"ר הזקן הוא הי' עדיין התפלל, והיא שמעה אותו אומר יבוא החץ בי, והיא נרעשה מאד ומיררה בבכי.\nלאחר מכן כשהיא הכניסה את הרבי הצמח צדק לאדמו\"ר הזקן היא בכתה מאד. אדמו\"ר הזקן הושיב את הצמח צדק על כיסא, והניח את ידיו הק' על ראש הילד וברכו.\nהרבנית דבורה לאה שהייתה שם מיררה בבכי, הרבי שאל, מה את בוכה? בנך יאיר את העולם בתורה ועבודה על פי דרך החסידות באריכותימים ושנים.", "chunk": "Yom_Alef_Sukkos_5706#0.6", "t": "יום א' דחג הסוכות תש\"ו", "f": "Yom_Alef_Sukkos_5706"}, {"type": "story", "title": "הלוואה לפני התפילה", "summary": "הצמח צדק, שהתגעגע לראות את אדמו\"ר הזקן, חזר מבית הכנסת לשוק לתת הלוואה ליהודי פשוט לפני התפילה, ואז נגלה אליו אדמו\"ר הזקן.", "who": "הצמח צדק", "themes": ["אהבת ישראל", "פרנסה", "יהודי פשוט"], "occasion": "י\"ט כסלו", "text": "ידוע הסיפור מכ\"ק אאזמו\"ר הרה\"ק צמח צדק זצוקללה\"ה נבג\"מ זי\"ע:\nהוד כ\"ק הרה\"ק הצמח צדק היה רגיל לראות את הוד כ\"ק זקנו רבינו הזקן, אחרי הסתלקותו, בהקיץ או בחזיון לילה, והיה פותר לו את כל ספיקותיו בנגלה ובנסתר.\nבזמן ידוע, ורבינו הצמח צדק יושב סגור בחדרו ושוקד בלימודו, נתקבצו אצלו כמה שאלות שלא ידע להכריע בהן והשתוקק במאוד לראות את הוד כ\"ק זקנו רבינו הזקן כרגילותו, אבל לא עלה בידו, והיה בצער גדול מזה.\nפעם בהשכמה הלך הרה\"ק צמח צדק להתפלל לבהכנ\"ס של הוד כ\"ק חותנו אדמו\"ר האמצעי זצוקללה\"ה נבג\"מ זי\"ע, ובעברו דרך השוק פגע באחד מאנשי השוק, ר' מרדכי אלי' שמו, איש פשוט וירא שמים, נהנה מיגיע כפו במסחר השוק, והיום היה יום השוק, ויבקש האיש מאת הרה\"ק צמח צדק להלוות לו גמ\"ח איזה רו\"כ עד הערב או מחרת בקר, כי ביום הזה הוא יכול להרויח בשוק, ויענהו הרה\"ק צמח צדק, כי אחרי התפילה כשיחזור לביתו ייכנס אליו וייתן לו את הגמ\"ח.\nכשנכנס הרה\"ק צמח צדק לבית הכנסת נפל ברעיונו הקדוש המאמר ר' אלעזר יהיב פרוטה לעני והדר מצלי, וגם המאמר גדול גמ\"ח מצדקה, ויתבונן הרה\"ק צמח צדק אשר לא טוב עשה שלא נתן תיכף להרמ\"א הנ\"ל את הגמ\"ח שביקש, ויחזור הרה\"ק צמח צדק לביתו, ויקח את הסכום וילך אל השוק לחפש את הרמ\"א, וביני לביני כבר נתקבצו אנשי הכפר עם עגלותיהם וסחורותיהם אל השוק, ועלה לו בטורח רב למצוא את הרמ\"א ביניהם, וכשמצאו נתן לו את הגמ\"ח, ויחזור לבית הכנסת להתפלל.\nכשנתעטף הוד כ\"ק הרה\"ק צמח צדק בטלית ותפילין, ראה פתאום את הוד כ\"ק רבינו הזקן בפנים צהובות, ויאמר לו: הנותן גמ\"ח לאיש ישראל בלבב שלם בלי שום פני', והעושה טובה לישראל באהבה כצווי ואהבת לרעך כמוך, שערי היכלי מעלה פתוחים לפניו.\nכשסיפר הוד כ\"ק הרה\"ק צמח צדק את הסיפור הזה לבנו הוד כ\"ק אאזמו\"ר הרה\"ק מוהר\"ש — בשנת תרט\"ז — אמר לו: בכך שעוזרים ליהודי בפרנסה, אפילו בלהרוויח שבעים קופיקות ממסחר בעגל, פותחים לפניו כל שערי ההיכלות העליונים.\nבשנת תרל\"ט סיפר הוד כ\"ק אאזמו\"ר הרה\"ק מוהר\"ש את כל הנ\"ל לבנו הוד כ\"ק אאמו\"ר הרה\"ק ויסיים:\nאפילו שצריך לדעת את הדרך אל ההיכלות העליונים, אבל אין זה משנה, העיקר צריך להיות לעזור בלב שלם מתוך רגש, ולהרגיש עריבות בעשיית טובה ליהודי.", "chunk": "19_kislev_5707#0.20", "t": "שיחת י\"ט כסלו תש\"ז", "f": "19_kislev_5707"}, {"type": "story", "title": "דג מסריח מהראש", "summary": "לרב שהתלונן ששומעיו אינם מקיימים, השיב אדמו\"ר מהר\"ש: ומה איתך?", "who": "אדמו\"ר מהר\"ש", "themes": ["עבודת המידות", "חינוך"], "occasion": "י\"ט כסלו", "text": "רב חסידי מסמיליאַן הגיע לאדמו\"ר המהר\"ש והתלונן על אלו ששומעים ממנו חסידות שהם לא מקשיבים, וזה לא מגיע אצלם לידי פועל. וענה לו אדמו\"ר מוהר\"ש: ומה קורה איתך? כשדג מסריח — הוא מסריח מהראש. הוא היה יהודי חסידי, וזה פעל עליו.", "chunk": "Shabbos_Vayishlach_19_Kislev_5706#0.4", "t": "ש\"פ וישלח, י\"ט כסלו תש\"ו", "f": "Shabbos_Vayishlach_19_Kislev_5706"}, {"type": "story", "title": "וכי האצבעות אינן חסידיות?", "summary": "אדמו\"ר הרש\"ב נכווה ממים רותחים בהגעלת הסמובר לפסח, והשיב שחסיד אינו נעצר מפני קור או חום.", "who": "אדמו\"ר הרש\"ב", "themes": ["מסירות נפש"], "occasion": "פסח", "text": "פעם, לפני פסח, נכנס הוד כ\"ק אאמו\"ר הרה\"ק לחדר שבו הכשירו את הכלים לפסח, הכשירו את כלי חג הפסח גם כן. בשעת ההכשרה הוד כ\"ק אאמו\"ר הרה\"ק שם לב לסדר ואופן ההגעלה.\nכאשר הכשירו את הסמובר*, השליך הוד כ\"ק אאמו\"ר הרה\"ק לתוך המים כמה אבנים מלובנות, כדי שירתחו, ופתח את הברז שממנו יוצאים המים; ניתזו המים החמים הרותחים על ידו של הוד כ\"ק אאמו\"ר הרה\"ק. ר' מיכאל שי', שעמד שם, צעק: אוי רבי! אתה כוֹוה את האצבעות!\nענה לו הוד כ\"ק אאמו\"ר הרה\"ק בפניו הקדושות, פנים צהובות: וכי האצבעות אינן חסידיות? חסיד – בין אם קר ובין אם חם – אין זה צריך לעכב אותו ממה שצריך.\nכ\"ק אדמו\"ר שליט\"א פנה לחסיד ר' מיכאל דוואָרקין שי' ואמר: אני מחזיק לך טובה מאוד מאוד, שזוכרים אמרה כזו ומוסרים אותה עם אותו הרגש פנימי כמו בשעה ששמעו אותה; הדבר מביא רוח טהרה מסוימת ואור בהיר ומבהיק לדורי דורות.", "chunk": "yom_1_pesach_5708#0.6", "t": "שיחת יום שבת קודש א' דחג הפסח תש\"ח", "f": "yom_1_pesach_5708"}, {"type": "story", "title": "שכחת שאתה אוכל דייסה", "summary": "חסיד שהתענג על דברי חסידות על חיבת המצוה אכל בהנאה את דייסת י\"ט כסלו, ואדמו\"ר הרש\"ב אמר לו: שכחת שאתה אוכל דייסה – פתגם \"עצמי\" שנזכר גם אחרי עשרות שנים.", "who": "אדמו\"ר הרש\"ב", "themes": ["עבודת המידות", "התוועדות"], "occasion": "י\"ט כסלו", "text": "אז בי\"ט כסלו ההוא אבי אמר פתגם, שממנו רואים שפתגם של אחד שהוא \"עצמי\" לא נאבד בריבוי השנים, זה היה פתגם לגמרי בדרך הצחות – הרביים בכלל לא אמרו שום הלצות וצחות, רק אצל אדמו\"ר האמצעי מוצאים זאת במאמרים, ואצל אבי גם כן – וכן היה אז.\nבהתוועדות ההיא דובר אודות צדיקי פולין (\"פּוילישע גוטע אידן\"), ואודות הרב הצדיק ר' לוי יצחק מברדיטשוב שהיה מנשק את האתרוג בליל סוכות.\nהדיבור סבב אודות – מניין נלקח הנשיקה, וביאר מעניין חיבת המצוה, התענוג במצוה, וזה היה תענוג לשמוע. בין המסובין ישב יהודי חסידי ששמע והבין את מה שדובר, והקשיב בהנאה.\nבעת ההיא אכלו את הדייסה הידועה של י\"ט כסלו- דייסת כוסמת.\n– כפי המנהג, שבי\"ט כסלו מכינים דייסת כוסמת – לכל מדינה יש את המאכל שלה שמחבבים יותר ממאכלים אחרים, בליטא המאכל הוא דיסת כוסמת -\nהיהודי ההוא ששמע את הדיבור אודות חיבת המצווה עם תענוג – אכל את הדיסה בהנאה.\nאבי הרגיש שהתענוג מהדיבור הועבר לאכילת הדייסה, שהוא אכל בהנאה (לא כפי שיהודי חסידי אמור לאכול).\nאבי אמר לו: שכחת שאתה אוכל דייסה.\nוכ\"ק אדמו\"ר הסביר: עונג המוחין בהסבר על חיבת המצוה – והוא היה מונח בזה – גרם שיהיה תענוג דנפש הטבעית באכילת הדייסה. והאוכל לא הרגיש כלל, כי לא היה עסוק באכילה אלא רק בעניין ששמע, ובכל זאת הנפש הטבעית עשה את שלו. והאוכל לא הרגיש, שהנפש הטבעית העבירה את התענוג גם לדיסה. וזהו מה שאמר לו שכחת שאתה אוכל גדיסת כוסמת.\nבין הנֹכחים בהתוועדות ההיא היה בחור שאז היה בן 19, במשך שנים רבות לא פגשתי אותו, ובשנת תר\"צ פגשתי אותו באמריקה, אני לא זכרתי את המעשה הנ\"ל, וכאשר שוחחנו הוא הזכיר לי את המילים של אבא שצריך לזכור שאוכלים דיסת כוסמת. אלו מילים של \"עצמי\".", "chunk": "19_Kislev_5698#0.3", "t": "י\"ט כסלו תרצ\"ח", "f": "19_Kislev_5698"}, {"type": "story", "title": "שליחות בליל שבת", "summary": "הריי\"צ נשלח על ידי אביו לפגישה מסוכנת בליל שבת מחוץ לפטרבורג – והכל נעשה בלי הרגש, כי כשצריך כך עושים.", "who": "אדמו\"ר הריי\"צ", "themes": ["מסירות נפש", "התקשרות"], "occasion": "", "text": "וסיפר כ\"ק אדמו\"ר שליט\"א: אשר פעם היה אצל אאמו\"ר נ\"ע, אשר היו צריכים להתראות עם איש א' בפּעטערבורג, והוא היה דר מחוץ לעיר. זמן ההתראות הוקבע על ליל שבת קודש אשר דוקא אז הייתי צריך להתראות איתו. שם לא היו בתי מלון, רק בתי מרזח, והוכרחתי לבוא לשם בערב שבת קודש ושילמתי להם כמובן עבור השבת קודש ועוד יותר עבור ההליכה, כי היה רחוק משם מהלך איזה שעות, ואחר כך בלילה הלכתי לשם ע\"י איזה ליוי ושהיתי שם איזה שעות, ודברנו מה שדברנו.\nכל זה היה בלי הרגש, הן מצד המשלח — אף שהיה אבא, ובנו היה בנו יחידו, והוא בוודאי ידע מה המשמעות של בן ובמיוחד בן יחיד, ומכל מקום היה בלי הרגש, לא אצלו ולא אצלי. כי כשכך צריך להֵעשות כך עושים, מאחר והיה התגברות הצורה על החומר.\nכך היה בליובאוויטש וכך הוא דרך החסידות.", "chunk": "21_Sivan_5706#0.1", "t": "כ\"א סיון תש\"ו", "f": "21_Sivan_5706"}, {"type": "story", "title": "הקנאה בשלום יוסף הבנאי", "summary": "ר' הלל מפאריטש קינא בבנאי פשוט שבכה בתפילה מרחמנות על \"חכמה דאצילות\" שבתוך הגוף, ור' אייזיל קינא בר' הלל על קנאתו זו.", "who": "חסידים", "themes": ["יהודי פשוט", "תפילה"], "occasion": "פסח", "text": "הרשב\"ץ סיפר את שראה באחת ההתועדויות החסידיות בליובאוויטש: בהתוועדות ישבו ר' הלל מפאַריטש ור' אייזיל מהאָמיל, ור' הלל התבטא שהוא מקנא בשלום יוסף הבונה (פּלאָטניק).\nר' שלום יוסף היה יהודי זקן מחסידי אדמו\"ר הזקן, אבל הוא היה פשוט מאד, פרנסתו היתה מזה שהיה בנאי, פועל פשוט. כשר' הלל עוד היה אברך, ר' שלום יוסף כבר היה זקן מופלג. ר' שלום יוסף היה מתפלל הרבה. פעם אחת ר' הלל ראה את ר' שלום יוסף ממרר בבכי בתפילה, ולאחר מכן ר' הלל שאל אותו מדוע בכית בתפילה? ר' שלום יוסף ענה לו ששמע מאדמו\"ר הזקן שנשמתו של כל יהודי היא מחכמה דאצילות, והיום כשחשבתי על כך שחכמה דאצילות נמצאת בתוך נָבָל וא\"כ איזו רחמנות יש עליה, וזה גרם לי לבכות.\nבהתוועדות כשר' הלל אמר שהוא מקנא בר' שלום יוסף, הוא מירר בבכי. כשהרשב\"ץ חזר עבורי את הסיפור הזה הוא אמר שבכייתו של ר' הלל היתה על דרך געה בבכיה וכו'.\nר' אייזיל הגיב: אני מקנא בר' הלל, כזה משכיל, כזה ידען — כידוע שר' הלל היה בקי בכתבי האריז\"ל באותיותיהם — וכזה עובד, ועל אף זאת הוא מקנא בפשטות של שלום יוסף הבונה.\nויאמר ר' הלל לר' אייזיל, נו.. וענה ר' אייזיל: את זה לא ניתן לייצר, למי שיש יש ולמי שאין אין. זהו רק מצד געגועי הנשמה שנמשכת לאלוקות, ועל זאת אנו מתייגעים, שנזכה לזה.", "chunk": "Yom_Alef_Pesach_5706#0.3", "t": "יום א' דחג הפסח תש\"ו", "f": "Yom_Alef_Pesach_5706"}, {"type": "story", "title": "יין ודגים לפני התפילה", "summary": "ר' יקותיאל לעפלער אכל מיד את סעודת השבת שקיבל מבית הצמח צדק, בטוח שאם הרבי שלח לפני התפילה – זה נוגע לתפילה.", "who": "חסידים", "themes": ["תפילה", "התקשרות"], "occasion": "", "text": "סעודת ליל שבת קודש היתה אצל הצ\"צ בשעה מאוחרת, ובניו היה דרכם לבוא לומר \"שבת־שלום\", ואצלם היה כבר תש\"ח", "f": "tishrey_5708"}, {"type": "saying", "title": "טוב ועוד יותר טוב", "summary": "", "who": "אדמו\"ר מהר\"ש", "themes": ["ניגון", "חינוך"], "occasion": "", "text": "כ\"ק אדמו\"ר שליט\"א ביקש את הר' מיכאל דוואָרקין שי' שילמד את התמימים דפה את הניגונים הליובאוויטשאיים הישנים.\nאמר הר\"מ שי': הם בטוחים מאוד בדעתם, ואומרים שהם יודעים היטב.\nויאמר כ\"ק אדמו\"ר שליט\"א:\nהרי ידוע הפתגם של סבא הוד כ\"ק אאזמו\"ר הרה\"ק מהר\"ש — יש \"טוב\", ויש \"עוד יותר טוב\"; שכן אם \"טוב\" הוא טוב, ה\"יותר טוב\" אינו טוב יותר?", "chunk": "achron_shel_pesach_5707#0.11", "t": "אחרון של פסח תש\"ז", "f": "achron_shel_pesach_5707"}, {"type": "saying", "title": "מה מספרים נרות החנוכה", "summary": "", "who": "אדמו\"ר מהר\"ש", "themes": ["התקשרות"], "occasion": "חנוכה", "text": "הוד כ\"ק אאמו\"ר הרה\"ק סיפר, שפעם הוד כ\"ק אאזמו\"ר הרה\"ק מוהר\"ש אמר לו: צריך להקשיב לנרות החנוכה מה הם מספרים.", "chunk": "Leil_Shabbos_Vayeishev_26_Kislev_Chanukah_5706#0.7", "t": "ליל ש\"פ וישב, כ\"ו כסלו, שבת חנוכה תש\"ו", "f": "Leil_Shabbos_Vayeishev_26_Kislev_Chanukah_5706"}, {"type": "saying", "title": "האמת שבתפילה", "summary": "", "who": "אדמו\"ר הרש\"ב", "themes": ["תפילה"], "occasion": "", "text": "פעם אחת שאל הרי\"מ מפּאָטלטאַווע: כיצד מגיעים לאמת בתפילה? וענה כ\"ק אאמו\"ר נ\"ע: כיצד לא מגיעים לאמת בתפילה? אם לא מגיעים לאמת זה סימן שלא התפללת.", "chunk": "Leil_Shabbos_Vayeira_20_MarCheshvan_5706#0.2", "t": "ליל ש\"פ וירא, כ' מר־חשון תש\"ו", "f": "Leil_Shabbos_Vayeira_20_MarCheshvan_5706"}, {"type": "saying", "title": "לקחת משקה", "summary": "חסידים שתו כמה שצריך ומתי שצריך.", "who": "אדמו\"ר הרש\"ב", "themes": ["התוועדות"], "occasion": "", "text": "אמר: צריכים לקחת משקה. אאמו\"ר אמר שלקחת משקה יכול להיות לא טוב, אבל מלא לקחת יכול להיות גרוע יותר.\nחסידיו של הרבי שתו משקה, אבל הם שתו כמה שצריך ומתי שצריך. בהתוועדויותיו של אאמו\"ר היו לוקחים הרבה משקה, אבל זה היה הולך למקום הראוי.", "chunk": "19_Kislev_5698#0.6", "t": "י\"ט כסלו תרצ\"ח", "f": "19_Kislev_5698"}, {"type": "saying", "title": "יהודי אינ , "chunk": "simchat_tora_yom_5708#0.3", "t": "שמחת תורה תש\"ח", "f": "simchat_tora_yom_5708"}, {"type": "saying", "title": "שתמיד יחסר כסף לתורה", "summary": "כלומר, שיעשו כל כך הרבה ישיבות עד שתמיד יחסר כסף.", "who": "אדמו\"ר הריי\"צ", "themes": ["לימוד תורה", "חינוך"], "occasion": "", "text": "(אמר רא\"ד קריימער נ\"י: שכבר אין כסף. ע\"ז השיב כ\"ק אדמו\"ר שליט\"א:) הקב\"ה יעזור שליהודים יהי' כסף על כל מה שהם צריכים, ועל תורה תמיד יחסר — כלומר, שיעשו כל־כך הרבה ישיבות עד שיחסר כסף, העבודה עדיין לא נגמרה.", "chunk": "16_adar_a_5708#0.1", "t": "שיחת יום ה' ט\"ז אדר ראשון תש\"ח", "f": "16_adar_a_5708"}, {"type": "saying", "title": "חסידים מתפללים ופועלים", "summary": "מפני הצורך שיהיה במה להתפלל, מוכרחים ללמוד תחילה.", "who": "חסידים", "themes": ["תפילה", "לימוד תורה"], "occasion": "", "text": "זקני חסידי־חב\"ד היו מספרים, שמיד כאשר הוד כ\"ק רבינו הזקן גילה וסידר את דרך העבודה וההשכלה של חסידות חב\"ד, נוצר אצל החסידים פתגם עממי: יהודים לומדים ומתפללים, חסידים מתפללים ופועלים, ומפני הצורך שיהיה במה להתפלל, מוכרחים ממילא ללמוד תחילה.", "chunk": "19_kislev_5707#0.12", "t": "שיחת י\"ט כסלו תש\"ז", "f": "19_kislev_5707"}, {"type": "saying", "title": "היום מוקדם ממחר", "summary": "", "who": "חסידים", "themes": ["שמחה", "אמונה ובטחון"], "occasion": "", "text": "אצל מחונכים חסידיים ישנה אמרה מסורתית, מן האמרות הקדומות ביותר, שזקני החסידים היו חוזרים עליה, שקיבלוה מחסידי חב\"ד הראשונים.\n\"אמת שה'היום' מאוחר יותר מה'אתמול', אך נחמתנו היא שה'היום' מוקדם יותר מן ה'מחר'\" — ובכך היו מנגנים ניגון המוטעם בטעם פנימי, איזה ניגון התעוררות, ופוצחים בריקוד דבקות.", "chunk": "achron_shel_pesach_5707#0.15", "t": "אחרון של פסח תש\"ז", "f": "achron_shel_pesach_5707"}, {"type": "saying", "title": "על חטא לא נגמר ביום כיפור", "summary": "", "who": "חסידים", "themes": ["עבודת המידות"], "occasion": "סוכות", "text": "חסידים זקנים היו אומרים: כשאומרים ביום הכיפורים 'על חטא' – כאן זה לא נגמר; לאחר יום הכיפורים עושים קפל [בסידור]; וכשמגיע סוכות אומר [היהודי] לנפש הבהמית: נו! מה, לקחת את הגוף ואתה מת const WHO = ['הבעש"ט','המגיד','אדמו"ר הזקן','אדמו"ר האמצעי','הצמח צדק','אדמו"ר מהר"ש','אדמו"ר הרש"ב','אדמו"ר הריי"צ','חסידים'];
let tab = 'story', who = '', theme = '', q = '', only = null;
const $ = id => document.getElementById(id);
function el(t, c, x){ const e = document.createElement(t); if(c) e.className = c; if(x != null) e.textContent = x; return e; }
function link(it){ return 'read.html?file=' + encodeURIComponent('pdfs/' + it.f + '.pdf') + '&title=' + encodeURIComponent(it.t); }
function norm(s){ return s.replace(/[\u0591-\u05C7"'״׳]/g, ''); }

  }

function render(){

    && (!n || norm(i.title + ' ' + i.summary + ' ' + i.text + ' ' + i.who + ' ' + i.themes.join(' ')).includes(n)));
  if (only) list = [only];
  $('count').textContent = only ? 'סיפור אקראי · ' : (list.length + (tab === 'story' ? ' סיפורים' : ' פתגמים'));

}
function tags(it){

}
function actions(it, extra){

}
document.querySelectorAll('.sp-tabs button').forEach(b => b.onclick = () => {
